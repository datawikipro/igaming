apiVersion: v1
kind: Service
metadata:
  name: igaming-source-redbet
  namespace: igaming-source
  labels:
    app: igaming-source-redbet
spec:
  selector:
    app: igaming-source-redbet
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-redbet
  namespace: igaming-source
  labels:
    app: igaming-source-redbet
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-redbet
  template:
    metadata:
      labels:
        app: igaming-source-redbet
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      tolerations:
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers: []
      
      containers:
      - name: igaming-source-redbet
        image: ghcr.io/datawikipro/igaming-source-unibet:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "league-crawler"
        - name: APP_ROLE
          value: "league-crawler"
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://igaming-source-redbet-db:5432/igaming_redbet"
        - name: DATABASE_HOST
          value: "igaming-source-redbet-db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: DB_HOST
          value: "igaming-source-redbet-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "igaming_redbet"
        - name: DB_USER
          value: "sa"
        - name: DB_PASSWORD
          value: ""
        - name: DB_URL
          value: "jdbc:h2:mem:redbet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: APP_BOOKMAKER_NAME
          value: "redbet"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "de-proxy.proxy.svc.cluster.local"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: KAMBI_API_BASE_URL
          value: "https://eu.offering-api.kambicdn.com/offering/v2018"
        - name: UNIBET_API_BASE_URL
          value: "https://eu.offering-api.kambicdn.com/offering/v2018"
        - name: KAMBI_API_BRAND
          value: "ub"
        - name: KAMBI_API_LOCALE
          value: "en_GB"
        - name: KAMBI_API_MARKET
          value: "GB"
        - name: NO_PROXY
          value: "localhost,127.0.0.1,.svc,.cluster.local,igaming-source-redbet-db,igaming-source-redbet-db.igaming-source.svc.cluster.local"
        - name: no_proxy
          value: "localhost,127.0.0.1,.svc,.cluster.local,igaming-source-redbet-db,igaming-source-redbet-db.igaming-source.svc.cluster.local"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx512m -XX:+UseG1GC -Dhttp.nonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\" -DsocksNonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\""
        resources:
          requests:
            cpu: 10m
            memory: "192Mi"
          limits:
            cpu: 1000m
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
