spring.application.name=igaming-source-bovada
server.port=8080

app.bookmaker.name=bovada
app.bookmaker.country=US
app.bookmaker.currency=USD
app.bookmaker.legal-status=OFFSHORE
app.bookmaker.kyc-level=LIGHT_PHONE
app.bookmaker.accepts-crypto=true
app.bookmaker.features=CRYPTO,FAST_PAYOUT
app.bookmaker.regions=US

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-bovada-db}:${DB_PORT:5432}/${DB_NAME:igaming_bovada}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-blocking HikariCP Configuration (Golden Rule #4)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Proxy configuration (US Gateway via ru-proxy)
app.proxy.enabled=${APP_PROXY_ENABLED:true}
app.proxy.host=${APP_PROXY_HOST:100.83.113.50}
app.proxy.port=${APP_PROXY_PORT:3128}
bovada.proxy.enabled=${APP_PROXY_ENABLED:true}
bovada.proxy.host=${APP_PROXY_HOST:100.83.113.50}
bovada.proxy.port=${APP_PROXY_PORT:3128}
app.target.host=www.bovada.lv
app.vpn.enabled=false

# Bovada API configuration
bovada.api.base-url=https://www.bovada.lv/services/sports/event/coupon/events/A/description
bovada.sports=football,basketball,soccer,hockey,baseball,tennis,ufc-mma

# Schedulers
bovada.discovery.cron=${BOVADA_DISCOVERY_CRON:0 */2 * * * *}
bovada.loader.cron=${BOVADA_LOADER_CRON:*/10 * * * * *}

# Health probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
