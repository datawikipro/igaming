apiVersion: v1
kind: Service
metadata:
  name: igaming-source-unibet-json
  namespace: igaming-source
  labels:
    app: igaming-source-unibet-json
spec:
  selector:
    app: igaming-source-unibet-json
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-unibet
  namespace: igaming-source
  labels:
    app: igaming-source-unibet-json
spec:
  selector:
    app: igaming-source-unibet-json
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-unibet-json
  namespace: igaming-source
  labels:
    app: igaming-source-unibet-json
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-unibet-json
  template:
    metadata:
      labels:
        app: igaming-source-unibet-json
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      priorityClassName: prod-critical
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-unibet-json
        image: 100.78.183.101:30500/igaming-source-unibet:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: APP_BOOKMAKER_NAME
          value: "unibet"
        - name: APP_BOOKMAKER_REGIONS
          value: "EU,GLOBAL"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "purevpn-uk-direct.proxy.svc.cluster.local"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: UNIBET_PROXY_ENABLED
          value: "true"
        - name: UNIBET_PROXY_HOST
          value: "purevpn-uk-direct.proxy.svc.cluster.local"
        - name: UNIBET_PROXY_PORT
          value: "3128"
        - name: APP_PROXY_HOST
          value: "purevpn-uk-direct.proxy.svc.cluster.local"
        - name: APP_PROXY_PORT
          value: "3128"
        - name: APP_VPN_ENABLED
          value: "false"
        - name: KAMBI_API_BRAND
          value: "ub"
        - name: KAMBI_API_LOCALE
          value: "en_GB"
        - name: KAMBI_API_MARKET
          value: "GB"
        - name: UNIBET_API_BRAND
          value: "ub"
        - name: UNIBET_API_LOCALE
          value: "en_GB"
        - name: UNIBET_API_MARKET
          value: "GB"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:unibet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.h2.Driver"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.H2Dialect"
        - name: SPRING_DATASOURCE_USERNAME
          value: "sa"
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "2"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -Djava.net.preferIPv4Stack=true"
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
