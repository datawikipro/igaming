apiVersion: v1
kind: Service
metadata:
  name: igaming-aggregator-api
  namespace: igaming-api
  labels:
    app: igaming-aggregator-api
spec:
  ports:
  - name: http
    port: 80
    targetPort: 3035
  - name: http-alt
    port: 8080
    targetPort: 3035
  selector:
    app: igaming-aggregator-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-aggregator-api
  namespace: igaming-api
  labels:
    app: igaming-aggregator-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-aggregator-api
  template:
    metadata:
      labels:
        app: igaming-aggregator-api
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: api
        image: 100.78.183.101:30500/igaming-aggregator-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3035
          name: http
        env:
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: "true"
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: SERVER_PORT
          value: "3035"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-aggregator-db:5432/igaming_aggregator
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: DATABASE_HOST
          value: igaming-aggregator-db
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis
        - name: REDIS_HOST
          value: igaming-redis
        - name: HIKARI_MAX_POOL_SIZE
          value: "30"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75.0
        - name: CLICKHOUSE_HOST
          value: clickhouse
        - name: CLICKHOUSE_PORT
          value: "8123"
        - name: REDIS_HISTORY_HOST
          value: igaming-redis-history
        - name: REDIS_HISTORY_PORT
          value: "6379"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3035
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3035
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3035
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 384Mi
---
