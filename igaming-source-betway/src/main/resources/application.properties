spring.application.name=igaming-source-betway
spring.profiles.active=${SPRING_PROFILES_ACTIVE:crawler}

server.port=${SERVER_PORT:8080}

app.bookmaker.name=betway
app.bookmaker.family=sbtech

# SBTech / Betway API Configuration
app.betway.base-url=${APP_BETWAY_BASE_URL:https://api.betway.com/v1/sportsbook}
app.betway.brand=betway
app.betway.connect-timeout=10000
app.betway.read-timeout=15000
app.betway.use-proxy=${APP_BETWAY_USE_PROXY:true}
app.betway.proxy-host=${APP_BETWAY_PROXY_HOST:cluster-ai-proxy.proxy.svc.cluster.local}
app.betway.proxy-port=${APP_BETWAY_PROXY_PORT:3128}

# Aggregator and Proxy URLs
app.proxy.backend.url=${APP_PROXY_BACKEND_URL:http://service-proxy-backend.service-proxy.svc.cluster.local}
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Database Configuration (In-Memory H2 PostgreSQL Mode)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:betway;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# HikariCP & JPA non-blocking
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Crawler Delays
app.crawler.discovery-delay=${CRAWLER_DISCOVERY_DELAY:120000}
app.crawler.odds-delay=${CRAWLER_ODDS_DELAY:20000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
