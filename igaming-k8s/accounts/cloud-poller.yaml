apiVersion: v1
kind: Secret
metadata:
  name: cloud-poller-secret
  namespace: accounts
  annotations:
    note: "kubectl edit secret cloud-poller-secret -n accounts to fill real values"
type: Opaque
stringData:
  k3s-token: ""
  tailscale-auth-key: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-poller
  namespace: accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-poller
  template:
    metadata:
      labels:
        app: cloud-poller
    spec:
      imagePullSecrets:
      - name: regcred
      nodeSelector:
        node-type: master
      containers:
      - name: cloud-poller
        image: ghcr.io/datawikipro/cloud-poller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8092
        env:
        - name: ACCOUNTS_SERVICE_URL
          value: "http://accounts-service:8091"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: K3S_SERVER_URL
          value: "https://master-vm-1:6443"
        - name: K3S_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloud-poller-secret
              key: k3s-token
        - name: TAILSCALE_AUTH_KEY
          valueFrom:
            secretKeyRef:
              name: cloud-poller-secret
              key: tailscale-auth-key
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8092
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-poller
  namespace: accounts
spec:
  selector:
    app: cloud-poller
  ports:
  - protocol: TCP
    port: 8092
    targetPort: 8092
  type: ClusterIP
