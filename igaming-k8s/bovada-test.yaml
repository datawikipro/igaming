apiVersion: v1
kind: Pod
metadata:
  name: igaming-source-bovada-test
  namespace: igaming-dev
  labels:
    app: igaming-source-bovada-test
spec:
  dnsConfig:
    options:
    - name: ndots
      value: "1"
  initContainers:
  - name: db-wait
    image: postgres:15-alpine
    imagePullPolicy: IfNotPresent
    env:
    - name: PGPASSWORD
      value: postgres
    command:
    - /bin/sh
    - -c
    - |
      echo "Waiting for igaming-source-bovada-db..."
      until pg_isready -h igaming-source-bovada-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
        sleep 2
      done
      echo "Database is ready!"
  containers:
  - name: igaming-source-bovada-test
    image: 100.78.183.101:30500/igaming-source-bovada:latest
    imagePullPolicy: Always
    env:
    - name: SERVER_PORT
      value: "8080"
    - name: SPRING_DATASOURCE_URL
      value: jdbc:postgresql://igaming-source-bovada-db.igaming-source.svc.cluster.local:5432/igaming_bovada
    - name: SPRING_DATASOURCE_USERNAME
      value: postgres
    - name: SPRING_DATASOURCE_PASSWORD
      value: postgres
    - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
      value: "0"
    - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
      value: "5000"
    - name: SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT
      value: "3000"
    - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
      value: "false"
    - name: SPRING_JPA_HIBERNATE_DDL_AUTO
      value: update
    - name: SPRING_JPA_DATABASE_PLATFORM
      value: org.hibernate.dialect.PostgreSQLDialect
    - name: APP_PROXY_ENABLED
      value: "true"
    - name: APP_PROXY_HOST
      value: "100.83.113.50"
    - name: APP_PROXY_PORT
      value: "3128"
    - name: BOVADA_PROXY_ENABLED
      value: "true"
    - name: BOVADA_PROXY_HOST
      value: "100.83.113.50"
    - name: BOVADA_PROXY_PORT
      value: "3128"
    - name: APP_BOOKMAKER_NAME
      value: bovada
    - name: APP_BOOKMAKER_REGIONS
      value: US,GLOBAL
    - name: APP_AGGREGATOR_URL
      value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
    - name: JAVA_OPTS
      value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
    ports:
    - containerPort: 8080
      protocol: TCP
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 800m
        memory: 768Mi
    startupProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 3
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3
      timeoutSeconds: 3
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
  restartPolicy: Always
