apiVersion: v1
kind: Service
metadata:
  name: igaming-source-superbet
  namespace: igaming-source
  labels:
    app: igaming-source-superbet
spec:
  selector:
    app: igaming-source-superbet
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-superbet
  namespace: igaming-source
  labels:
    app: igaming-source-superbet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-superbet
  template:
    metadata:
      labels:
        app: igaming-source-superbet
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-superbet
        image: 100.78.183.101:30500/igaming-source-superbet:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "dev,unified"
        - name: APP_ROLE
          value: "unified"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:superbet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH"
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.h2.Driver"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.H2Dialect"
        - name: SPRING_DATASOURCE_USERNAME
          value: "sa"
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: DB_URL
          value: "jdbc:h2:mem:superbet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH"
        - name: DB_USER
          value: "sa"
        - name: DB_PASSWORD
          value: ""
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: APP_SUPERBET_BASE_URL
          value: "https://production-superbet-offer-pl.freetls.fastly.net/v3/pl-PL"
        - name: APP_SUPERBET_USE_PROXY
          value: "true"
        - name: APP_SUPERBET_PROXY_HOST
          value: "de-proxy.proxy.svc.cluster.local"
        - name: APP_SUPERBET_PROXY_PORT
          value: "3128"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx512m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 50m
            memory: "256Mi"
          limits:
            cpu: "1500m"
            memory: "1024Mi"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
