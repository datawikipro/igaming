apiVersion: v1
kind: Service
metadata:
  name: igaming-source-winline-crawler
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-winline-crawler
  ports:
  - protocol: TCP
    port: 3033
    targetPort: 3033
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-winline-crawler
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-winline-crawler
  template:
    metadata:
      labels:
        app: igaming-source-winline-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-winline-crawler
        image: ghcr.io/datawikipro/igaming-source-winline:latest
        imagePullPolicy: Always
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: SPRING_PROFILES_ACTIVE
          value: dev,league-crawler
        - name: APP_ROLE
          value: league-crawler
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-winline-db:5432/igaming_winline
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_WINLINE_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_WINLINE_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '600'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '120000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '600000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3000'
        - name: SERVER_PORT
          value: '3033'
        - name: APP_WINLINE_REQUEST_TIMEOUT_MS
          value: '60000'
        - name: APP_WINLINE_SAPI_WAIT_TIMEOUT_MS
          value: '45000'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
        ports:
        - containerPort: 3033
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-winline-loader
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-winline-loader
  ports:
  - protocol: TCP
    port: 3033
    targetPort: 3033
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-winline-loader
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-winline-loader
  template:
    metadata:
      labels:
        app: igaming-source-winline-loader
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-winline-loader
        image: ghcr.io/datawikipro/igaming-source-winline:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev,match-loader
        - name: APP_ROLE
          value: match-loader
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-winline-db:5432/igaming_winline
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_WINLINE_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_WINLINE_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '600'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '120000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '600000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3000'
        - name: SERVER_PORT
          value: '3033'
        resources:
          requests:
            cpu: 30m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 1Gi
        ports:
        - containerPort: 3033
        resources:
          requests:
            cpu: 30m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3033
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3033
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3033
          initialDelaySeconds: 15
          periodSeconds: 10
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-winline-db
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-winline-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-winline-db
  namespace: igaming-dev
spec:
  serviceName: igaming-source-winline-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-winline-db
  template:
    metadata:
      labels:
        app: igaming-source-winline-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_winline
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}

