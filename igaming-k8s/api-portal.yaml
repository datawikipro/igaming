apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-api-portal
  namespace: igaming-dev
  labels:
    app: igaming-api-portal
    tier: b2b-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-api-portal
  template:
    metadata:
      labels:
        app: igaming-api-portal
        tier: b2b-frontend
    spec:
      containers:
        - name: api-portal
          image: ghcr.io/datawikipro/igaming-api-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: B2B_API_URL
              value: "http://igaming-b2b-api.igaming-dev.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-api-portal
  namespace: igaming-dev
  labels:
    app: igaming-api-portal
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: igaming-api-portal