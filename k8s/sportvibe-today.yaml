apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sportvibe-today
  name: sportvibe-today
  namespace: igaming-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sportvibe-today
  template:
    metadata:
      labels:
        app: sportvibe-today
    spec:
      containers:
      - command:
        - node
        - server.js
        env:
        - name: NODE_ENV
          value: production
        - name: HOSTNAME
          value: 0.0.0.0
        - name: PORT
          value: "3000"
        - name: SITE_MODE
          value: "clean"
        - name: NEXT_PUBLIC_SITE_MODE
          value: "clean"
        - name: NEXT_PUBLIC_BRAND_DOMAIN
          value: "sportvibe.today"
        - name: NEXT_PUBLIC_BRAND_NAME
          value: "SportVibe"
        - name: PORTAL_API_URL
          value: http://igaming-portal:80
        - name: AUTH_API_URL
          value: http://carrier-auth:8000
        image: 100.78.183.101:30500/smartbet.guru:v89
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: sportvibe-today
        ports:
        - containerPort: 3000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        startupProbe:
          failureThreshold: 20
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      nodeSelector:
        node-type: standard
      priorityClassName: prod-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: sportvibe-today
  name: sportvibe-today
  namespace: igaming-api
spec:
  type: NodePort
  selector:
    app: sportvibe-today
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 32001
    protocol: TCP
  externalIPs:
  - 100.78.183.101
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: sportvibe-today
  name: sportvibe-today
  namespace: igaming-dev
spec:
  type: ExternalName
  externalName: sportvibe-today.igaming-api.svc.cluster.local
