server.port=${SERVER_PORT:3060}

spring.application.name=igaming-source-draftkings

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:5432/igaming_draftkings}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=draftkings
app.bookmaker.regions=US

# DraftKings API Configuration
draftkings.api.base-url=${DRAFTKINGS_API_BASE_URL:https://sportsbook-us-east-1.draftkings.com}
draftkings.api.site-id=${DRAFTKINGS_API_SITE_ID:US-SB}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=
