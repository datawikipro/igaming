apiVersion: v1
kind: Service
metadata:
  name: igaming-redis
  namespace: igaming-enrichment
  labels:
    app: igaming-redis
spec:
  ports:
  - port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: igaming-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-redis
  namespace: igaming-enrichment
  labels:
    app: igaming-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: igaming-redis
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - --save
        - ""
        - --stop-writes-on-bgsave-error
        - "no"
        - --maxmemory
        - 1gb
        - --maxmemory-policy
        - allkeys-lru
        ports:
        - containerPort: 6379
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 1536Mi
          requests:
            cpu: 50m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-redis-history
  namespace: igaming-enrichment
  labels:
    app: igaming-redis-history
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  selector:
    app: igaming-redis-history
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-redis-history
  namespace: igaming-enrichment
  labels:
    app: igaming-redis-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-redis-history
  template:
    metadata:
      labels:
        app: igaming-redis-history
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - --maxmemory
        - 2gb
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - ""
        - --appendonly
        - "no"
        ports:
        - containerPort: 6379
          name: redis
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 2560Mi
          requests:
            cpu: 100m
            memory: 256Mi
