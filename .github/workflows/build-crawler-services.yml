name: "Build Docker Services (source-*, admin-backend)"

on:
  push:
    branches: ['**']
    paths:
      - "igaming-dto"
      - "igaming-dto/**"
      - "igaming-source-core"
      - "igaming-source-core/**"
      - "igaming-source-*"
      - "igaming-source-*/**"
      - "igaming-admin-backend"
      - "igaming-admin-backend/**"
      - "pom.xml"
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to build (e.g. igaming-source-winline, all, or leave empty for auto-detect)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # ----------------------------------------------------------------
  # Detect which source modules actually changed
  # ----------------------------------------------------------------
  detect-changes:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: set-matrix
        run: |
          INPUT_MOD="${{ github.event.inputs.module }}"
          if [ "$INPUT_MOD" = "all" ]; then
            CHANGED=$(ls -d igaming-source-*/ igaming-admin-backend/ service-proxy-backend/ 2>/dev/null | sed 's|/||' | grep -v 'igaming-source-core')
          elif [ -n "$INPUT_MOD" ]; then
            CHANGED="$INPUT_MOD"
          else
            # git diff returns bare dir name (no slash) for submodule pointer updates
            # and dir/file paths for in-tree changes — grep handles both cases
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -oP '(igaming-source-[^/]+|igaming-admin-backend|service-proxy-backend)' | sort -u || true)

            # If core libs changed, rebuild ALL sources + admin-backend
            CORE_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(igaming-dto|igaming-source-core)(/|$)?' || true)
            if [ -n "$CORE_CHANGED" ]; then
              CHANGED=$(ls -d igaming-source-*/ igaming-admin-backend/ service-proxy-backend/ 2>/dev/null | sed 's|/||' | grep -v 'igaming-source-core')
            fi
          fi

          # Remove igaming-source-core from build list (it's a library, not a service)
          CHANGED=$(echo "$CHANGED" | grep -v 'igaming-source-core' || true)

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"module":[]}' >> "$GITHUB_OUTPUT"
          else
            MODULES=$(echo "$CHANGED" | jq -R -s 'split("\n") | map(select(length > 0))' | jq -c '{module: .}')
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$MODULES" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------
  # Build and push changed modules
  # ----------------------------------------------------------------
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          # Only update the specific module being built + shared core library
          git submodule sync ${{ matrix.module }} igaming-source-core igaming-dto || true
          git submodule update --init ${{ matrix.module }} || true
          git submodule update --init igaming-source-core || true
          git submodule update --init igaming-dto || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build module JAR
        run: |
          mvn -pl ${{ matrix.module }} -am clean package \
            -DskipTests -Dmaven.test.skip=true


      - name: Configure GHCR credentials
        run: |
          mkdir -p ~/.docker
          AUTH=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      - name: Build and push Docker image
        env:
          XDG_RUNTIME_DIR: "/run/user/1000"
        run: |
          RAW_BRANCH="${{ github.ref_name }}"
          CLEAN_TAG=$(echo "$RAW_BRANCH" | sed 's|/|-|g' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')
          
          echo "Building image for branch '$RAW_BRANCH' with clean tag '$CLEAN_TAG'..."
          
          if [ "$RAW_BRANCH" = "master" ] || [ "$RAW_BRANCH" = "main" ]; then
            TAG_ARGS="-t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.module }}:latest -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.module }}:${CLEAN_TAG}"
          else
            TAG_ARGS="-t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.module }}:${CLEAN_TAG}"
          fi

          docker build \
            --creds ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} \
            $TAG_ARGS \
            -f ${{ matrix.module }}/Dockerfile .
            
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.module }}:${CLEAN_TAG}
          if [ "$RAW_BRANCH" = "master" ] || [ "$RAW_BRANCH" = "main" ]; then
            docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.module }}:latest
          fi

      - name: Check system load before deployment
        if: github.ref_name == 'master' || github.ref_name == 'main'
        run: |
          echo "Checking system load and loader delays before rollout restart..."
          HEALTH_URL="http://workload-manager.igaming-dev.svc.cluster.local/api/v1/analytics/aggregator/stats"
          HEALTH_STATUS=$(curl -s --max-time 10 "$HEALTH_URL" | jq -r '.health.status // "OK"' 2>/dev/null || echo "OK")
          MAX_DELAY=$(curl -s --max-time 10 "$HEALTH_URL" | jq -r '.health.maxOddsDelayMinutes // 0' 2>/dev/null || echo "0")
          
          echo "Current system status: $HEALTH_STATUS (max odds lag: ${MAX_DELAY}m)"
          
          if [ "$HEALTH_STATUS" = "CRITICAL" ]; then
            echo "::error::System load/lag is CRITICAL (max delay: ${MAX_DELAY}m). Aborting deployment to avoid overload during peak traffic."
            exit 1
          elif [ "$HEALTH_STATUS" = "DEGRADED" ]; then
            echo "::warning::System status is DEGRADED (max delay: ${MAX_DELAY}m). Proceeding with deployment..."
          fi

      - name: Rollout restart Kubernetes deployments
        if: github.ref_name == 'master' || github.ref_name == 'main'
        run: |
          if [ "${{ matrix.module }}" = "igaming-admin-backend" ]; then
            kubectl rollout restart deployment/igaming-admin-backend -n igaming-master || true
          elif [ "${{ matrix.module }}" = "service-proxy-backend" ]; then
            kubectl rollout restart deployment/service-proxy-backend -n igaming-source || true
          else
            kubectl rollout restart deployment/${{ matrix.module }}-crawler -n igaming-source || true
            kubectl rollout restart deployment/${{ matrix.module }}-loader -n igaming-source || true
          fi


