apiVersion: v1
kind: Service
metadata:
  name: igaming-affiliate-db
  namespace: igaming-api
  labels:
    app: igaming-affiliate-db
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: igaming-affiliate-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-affiliate-db
  namespace: igaming-api
  labels:
    app: igaming-affiliate-db
spec:
  replicas: 1
  serviceName: igaming-affiliate-db
  selector:
    matchLabels:
      app: igaming-affiliate-db
  template:
    metadata:
      labels:
        app: igaming-affiliate-db
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        command:
        - docker-entrypoint.sh
        - postgres
        - -c
        - synchronous_commit=off
        - -c
        - shared_buffers=64MB
        - -c
        - max_connections=50
        args:
        - -c
        - fsync=off
        - -c
        - synchronous_commit=off
        - -c
        - full_page_writes=off
        - -c
        - wal_level=minimal
        - -c
        - max_wal_senders=0
        - -c
        - shared_buffers=128MB
        env:
        - name: POSTGRES_DB
          value: affiliate
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 192Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data-igaming-affiliate-db-0
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-affiliate-service
  namespace: igaming-api
  labels:
    app: igaming-affiliate-service
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: igaming-affiliate-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-affiliate-service
  namespace: igaming-api
  labels:
    app: igaming-affiliate-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-affiliate-service
  template:
    metadata:
      labels:
        app: igaming-affiliate-service
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: igaming-affiliate-service
        image: 100.78.183.101:30500/igaming-affiliate-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: DB_HOST
          value: igaming-affiliate-db
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: affiliate
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: REQUIRE_CF_ACCESS
          value: "true"
        - name: AFFILIATE_ADMIN_SECRET
          value: sb_admin_cf_secret_2026
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 10m
            memory: 128Mi
