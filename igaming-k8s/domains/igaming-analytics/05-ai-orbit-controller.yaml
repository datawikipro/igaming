kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '3'
    kubectl.kubernetes.io/last-applied-configuration: '{"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{},"labels":{"app":"igaming-ai-orbit-controller"},"name":"igaming-ai-orbit-controller","namespace":"igaming-dev"},"spec":{"replicas":1,"selector":{"matchLabels":{"app":"igaming-ai-orbit-controller"}},"template":{"metadata":{"labels":{"app":"igaming-ai-orbit-controller"}},"spec":{"containers":[{"command":["/bin/sh","/scripts/orbit-controller.sh"],"env":[{"name":"DB_HOST","value":"igaming-aggregator-db.igaming-enrichment.svc.cluster.local"},{"name":"DB_PORT","value":"5432"},{"name":"DB_NAME","value":"igaming_aggregator"},{"name":"DB_USER","value":"postgres"},{"name":"DB_PASSWORD","value":"postgres"},{"name":"ANALYST_HOST","value":"igaming-ai-analyst.igaming-analytics.svc.cluster.local"},{"name":"ANALYST_PORT","value":"8080"}],"image":"postgres:15-alpine","name":"orbit-controller","resources":{"limits":{"cpu":"300m","memory":"256Mi"},"requests":{"cpu":"50m","memory":"64Mi"}},"volumeMounts":[{"mountPath":"/scripts","name":"script-volume"}]}],"volumes":[{"configMap":{"defaultMode":493,"name":"igaming-ai-orbit-controller-config"},"name":"script-volume"}]}}}}

