spring.application.name=igaming-source-stake
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-stake-db}:${DB_PORT:5432}/${DB_NAME:igaming_source_stake}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

app.stake.graphql-url=${STAKE_GRAPHQL_URL:https://stake.com/_api/graphql}
app.stake.use-proxy=${STAKE_USE_PROXY:true}
app.stake.proxy-host=${STAKE_PROXY_HOST:100.83.113.50}
app.stake.proxy-port=${STAKE_PROXY_PORT:3128}
app.stake.fetch-interval-ms=${STAKE_FETCH_INTERVAL_MS:30000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
app.bookmaker.country=INT
app.bookmaker.currency=USD
app.bookmaker.legal-status=CRYPTO_NO_KYC
app.bookmaker.kyc-level=NO_KYC
app.bookmaker.accepts-crypto=true
app.bookmaker.features=CRYPTO,FAST_PAYOUT,VIP_HIGH_LIMIT
app.bookmaker.regions=INT,GLOBAL
