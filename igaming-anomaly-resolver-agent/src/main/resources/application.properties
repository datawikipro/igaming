server.port=${SERVER_PORT:8098}
spring.application.name=igaming-anomaly-resolver-agent

# ── Kafka Configuration ────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-0.kafka-headless.igaming-master.svc.cluster.local:9092}
spring.kafka.consumer.group-id=igaming-anomaly-resolver-agent
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.max.poll.interval.ms=900000

app.kafka.topics.anomaly-errors=${APP_KAFKA_TOPIC_ANOMALY:mdm.anomaly.errors}

# ── Upstream Services Integration ─────────────────────────────────────────────
app.mdm.url=${APP_MDM_URL:http://igaming-mdm-service.igaming-enrichment.svc.cluster.local:8095}
app.analyst.url=${APP_ANALYST_URL:http://igaming-ai-analyst.igaming-analytics.svc.cluster.local:8080}
app.sofascore.ondemand-url=${APP_SOFASCORE_ONDEMAND_URL:http://igaming-capture-sofascore-on-demand.igaming-enrichment.svc.cluster.local:3041/api/v1/sofascore/on-demand}

# ── Plane AI Worker Pool Configuration (20-Account Dedicated Pool) ────────────
app.plane.workers.count=${PLANE_WORKERS_COUNT:18}
app.plane.workers.base-url-pattern=${PLANE_WORKERS_URL_PATTERN:http://plane-ai-worker-%d.plane-ai-worker.plane.svc.cluster.local:8000}
app.plane.workers.timeout-seconds=${PLANE_WORKERS_TIMEOUT:180}
app.plane.workers.model=${PLANE_WORKERS_MODEL:gemini-3.8-flash-high}
app.plane.workers.max-attempts=${PLANE_WORKERS_MAX_ATTEMPTS:10}

# ── Actuator Probes ───────────────────────────────────────────────────────────
management.health.kafka.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
