server:
  port: 62001

spring:
  application:
    name: igaming-llm-admin
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:igaming_llm_admin}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: caffeine
    cache-names: llm-responses, active-gateways

logging:
  level:
    root: INFO
    pro.datawiki.igaming.llm.admin: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
