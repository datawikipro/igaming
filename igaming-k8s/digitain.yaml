apiVersion: v1
kind: Service
metadata:
  name: igaming-source-digitain-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-digitain-crawler
  ports:
  - protocol: TCP
    port: 3080
    targetPort: 3080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-digitain-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-digitain-crawler
  template:
    metadata:
      labels:
        app: igaming-source-digitain-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-digitain-crawler
        image: ghcr.io/datawikipro/igaming-source-digitain:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          Xvfb :99 -ac -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          export DISPLAY=:99
          exec java -jar app.jar
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: '3080'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-digitain-db.igaming-source.svc.cluster.local:5432/igaming_digitain
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: AGGREGATOR_URL
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BOOKMAKER_REGIONS
          value: ru
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XshowSettings:vm
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        ports:
        - containerPort: 3080
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-digitain-db
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-digitain-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-digitain-db
  namespace: igaming-source
spec:
  serviceName: igaming-source-digitain-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-digitain-db
  template:
    metadata:
      labels:
        app: igaming-source-digitain-db
    spec:
      nodeSelector:
        node-type: master
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_digitain
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}
