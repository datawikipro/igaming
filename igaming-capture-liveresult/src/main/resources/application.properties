server.port=3042

# Aggregator connection
app.aggregator.url=http://igaming-aggregator-api.igaming-dev.svc.cluster.local:8080

# Polling configuration (2 minutes in milliseconds)
app.capture.fixed-delay=120000
app.capture.enabled=true
spring.task.scheduling.pool.size=5

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# HikariCP / JPA Non-blocking start (AGENTS.md)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Logging
logging.level.pro.datawiki.igaming.capture=INFO
app.browser.pre-visit-keywords=

# User-Agent & Network settings
app.capture.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
