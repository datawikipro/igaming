apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betcity-com-json
  namespace: igaming-source
  labels:
    app: igaming-source-betcity-com-json
spec:
  selector:
    app: igaming-source-betcity-com-json
  ports:
  - protocol: TCP
    port: 3042
    targetPort: 3042
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betcity-com-json
  namespace: igaming-source
  labels:
    app: igaming-source-betcity-com-json
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betcity-com-json
  template:
    metadata:
      labels:
        app: igaming-source-betcity-com-json
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      priorityClassName: prod-critical
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-betcity-com-json
        image: 100.78.183.101:30500/igaming-source-betcity:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3042
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: "3042"
        - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BEANS
          value: "WARN"
        - name: APP_BOOKMAKER_NAME
          value: betcity-com
        - name: APP_BOOKMAKER_REGIONS
          value: COM
        - name: APP_ROLE
          value: league-crawler
        - name: APP_TARGET_HOST
          value: ad.betcity.ru
        - name: APP_BETCITY_LIVE_URL
          value: "https://ad.betcity.ru/d/on_air/bets?rev=8&add=dep_event&template=1"
        - name: APP_BETCITY_PREMATCH_URL
          value: "https://ad.betcity.ru/d/off/events?rev=6"
        - name: APP_BETCITY_EVENT_URL_TEMPLATE
          value: "https://betcity.ru/ru/line/bets?id=%s"
        - name: APP_BETCITY_FETCH_INTERVAL_SECONDS
          value: "30"
        - name: APP_BETCITY_PREMATCH_FETCH_INTERVAL_SECONDS
          value: "120"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:betcity_com;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "2"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_PROXY_DIRECT
          value: "true"
        - name: APP_VPN_FORCE
          value: "false"
        - name: APP_PROXY_BACKEND_URL
          value: "http://service-proxy-backend.service-proxy.svc.cluster.local"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -Djava.net.preferIPv4Stack=true"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 1024Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3042
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
          initialDelaySeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3042
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3042
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
