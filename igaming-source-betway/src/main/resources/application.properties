spring.application.name=igaming-source-betway
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://igaming-source-betway-db.igaming-source.svc.cluster.local:5432/igaming_betway}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-blocking HikariCP Configuration (Golden Rule #4)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# JPA / Hibernate Configuration (Golden Rule #7)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Aggregator & Kafka
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}

# Betway Specific Crawler & Proxy Configuration (Golden Rule #6)
app.betway.api-url=${APP_BETWAY_API_URL:https://sports.betway.com}
app.betway.use-proxy=${APP_BETWAY_USE_PROXY:true}
app.betway.proxy-host=${APP_BETWAY_PROXY_HOST:100.83.113.50}
app.betway.proxy-port=${APP_BETWAY_PROXY_PORT:3128}
app.betway.poll-rate-ms=${APP_BETWAY_POLL_RATE_MS:10000}
app.betway.scheduler.enabled=${APP_BETWAY_SCHEDULER_ENABLED:true}
app.betway.scheduler.cron=${APP_BETWAY_SCHEDULER_CRON:0 */2 * * * *}

# Redis Cluster Configuration
spring.data.redis.host=${REDIS_HOST:redis.igaming-dev.svc.cluster.local}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator Health & Probes (Golden Rule #1)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.pro.datawiki.igaming.source.betway=INFO
