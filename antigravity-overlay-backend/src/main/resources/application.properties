server.port=8080

# In-Memory H2 Database configuration for fast startup and clean concurrency
spring.datasource.url=jdbc:h2:mem:overlaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hikari & Hibernate non-blocking startup properties
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# JPA and Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Google OAuth API Settings
google.client.id=${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET}

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Autonomous AI Agent Verification Stamp
app.ai.verified=true
