spring.application.name=igaming-source-crickex
server.port=${SERVER_PORT:8080}

# Bookmaker Profile
app.bookmaker.name=crickex
app.bookmaker.country=IN
app.bookmaker.currency=INR
app.bookmaker.legal-status=OFFSHORE
app.bookmaker.kyc-level=LIGHT_PHONE
app.bookmaker.accepts-crypto=true
app.bookmaker.regions=IN,BD,PK
app.bookmaker.features=CRICKET_EXCHANGE

# Database Configuration (In-Memory H2 for Standalone Pod)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:crickex;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Non-blocking Hikari & JPA
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Crawler schedule
app.crawler.discovery.interval-ms=${APP_CRAWLER_DISCOVERY_INTERVAL_MS:30000}
