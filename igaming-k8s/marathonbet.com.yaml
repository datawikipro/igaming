apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-com-db
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-marathonbet-com-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-marathonbet-com-db
  namespace: igaming-dev
spec:
  serviceName: igaming-source-marathonbet-com-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-marathonbet-com-db
  template:
    metadata:
      labels:
        app: igaming-source-marathonbet-com-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_marathonbet_com
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}

