spring.application.name=igaming-capture-injuries
server.port=3044

# ===================================================================
# Non-blocking HikariCP & JPA Configuration (Golden Rules #4)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-core-db}:5432/${DB_NAME:igaming_injuries}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ===================================================================
# K8s DNS Service Names (Strictly NO IP addresses! Golden Rules #2)
# ===================================================================
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator}
app.mdm.url=${MDM_URL:http://igaming-aggregator/api/v1/mdm}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka:9092}
app.kafka.topics.canonical-injuries=sports.canonical.injuries

# ===================================================================
# Cluster HTTP Proxy (ru-proxy 100.83.113.50:3128) for Crawlers
# ===================================================================
app.crawler.proxy.host=100.83.113.50
app.crawler.proxy.port=3128
app.crawler.proxy.enabled=true

# Crawler source endpoints
app.crawler.premier-injuries.url=https://www.premierinjuries.com/injury-table.php
app.crawler.whoscored.url=https://www.whoscored.com/Matches
app.crawler.transfermarkt.url=https://www.transfermarkt.com/premier-league/verletztespieler/wettbewerb/GB1

# Polling configuration (every 5 minutes = 300000ms)
app.capture.injuries.fixed-delay=300000
app.capture.injuries.initial-delay=15000
app.capture.injuries.enabled=true

# ===================================================================
# Spring Boot Actuator & Health Probes (Golden Rules #1)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.pro.datawiki.igaming=INFO
