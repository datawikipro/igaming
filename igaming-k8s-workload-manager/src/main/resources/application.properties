# Hikari non-blocking config per Golden Rule #4
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Health Watcher targets configuration
health-watcher.enabled=true
health-watcher.poll-interval-ms=30000

health-watcher.targets[0].name=airflow-api
health-watcher.targets[0].url=http://airflow-api-server.airflow.svc.cluster.local:8080/api/v2/monitor/health
health-watcher.targets[0].namespace=airflow
health-watcher.targets[0].deployment-name=airflow-api-server
health-watcher.targets[0].timeout-ms=10000
health-watcher.targets[0].failure-threshold=3
health-watcher.targets[0].cooldown-minutes=15
health-watcher.targets[0].enabled=true
health-watcher.targets[0].auto-restart=true

health-watcher.targets[1].name=llm-admin
health-watcher.targets[1].url=http://llm-admin.llm.svc.cluster.local:80/actuator/health
health-watcher.targets[1].namespace=llm
health-watcher.targets[1].deployment-name=llm-admin
health-watcher.targets[1].timeout-ms=10000
health-watcher.targets[1].failure-threshold=3
health-watcher.targets[1].cooldown-minutes=15
health-watcher.targets[1].enabled=true
health-watcher.targets[1].auto-restart=true

health-watcher.targets[2].name=data-catalog
health-watcher.targets[2].url=http://data-catalog-backend.data-catalog.svc.cluster.local:8080/api/sources
health-watcher.targets[2].namespace=data-catalog
health-watcher.targets[2].deployment-name=data-catalog-backend
health-watcher.targets[2].timeout-ms=10000
health-watcher.targets[2].failure-threshold=3
health-watcher.targets[2].cooldown-minutes=15
health-watcher.targets[2].enabled=true
health-watcher.targets[2].auto-restart=true

health-watcher.targets[3].name=superset
health-watcher.targets[3].url=http://superset.bi.svc.cluster.local:8088/superset/welcome/
health-watcher.targets[3].namespace=bi
health-watcher.targets[3].deployment-name=superset
health-watcher.targets[3].timeout-ms=15000
health-watcher.targets[3].failure-threshold=3
health-watcher.targets[3].cooldown-minutes=15
health-watcher.targets[3].enabled=false
health-watcher.targets[3].auto-restart=false
