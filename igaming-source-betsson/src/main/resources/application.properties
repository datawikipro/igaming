server.port=${SERVER_PORT:3055}

spring.application.name=igaming-source-betsson

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:5432/igaming_betsson}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=betsson
app.bookmaker.regions=SE

# Betsson / Kambi API Configuration
betsson.api.base-url=${BETSSON_API_BASE_URL:https://eu-offering.kambicdn.org/offering/v2018}
betsson.api.brand=${BETSSON_API_BRAND:betssonse}
betsson.api.locale=${BETSSON_API_LOCALE:en_GB}
betsson.api.market=${BETSSON_API_MARKET:SE}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/London}

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Autonomous AI Agent Verification Stamp
app.ai.verified=true
