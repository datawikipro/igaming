server:
  port: 62001

spring:
  application:
    name: igaming-llm-admin
  mvc:
    async:
      request-timeout: 120000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:igaming_llm_admin}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: caffeine
    cache-names: llm-responses, active-gateways

app:
  aggregator-url: ${AGGREGATOR_URL:http://igaming-aggregator:3034}

logging:
  level:
    root: INFO
    pro.datawiki.igaming.llm.admin: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
