apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '9'
  labels:
    app: smm-video-shorts
    module: smm-agent
  name: smm-video-shorts
  namespace: igaming-smm
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: smm-video-shorts
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-10-12T14:41:38+03:00'
      creationTimestamp: null
      labels:
        app: smm-video-shorts
        module: smm-agent
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
            weight: 10
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - command:
        - python3
        - /app/video_shorts_pipeline.py
        env:
        - name: PORT
          value: '8080'
        - name: CLOUD_VIDEO_PROVIDER
          value: gemini_veo
        - name: REDIS_URL
          value: redis://igaming-redis.igaming-dev.svc.cluster.local:6379/0
        - name: PORTAL_API_URL
          value: http://igaming-portal.igaming-dev.svc.cluster.local:80
        - name: US_PROXY
          value: http://cluster-ai-proxy.proxy.svc.cluster.local:3128
        - name: NO_PROXY
          value: localhost,127.0.0.1,10.0.0.0/8,igaming-redis,igaming-portal,.svc.cluster.local
        - name: GEMINI_STUDIO_API_URL
          value: http://gemini-studio-api.igaming-smm.svc.cluster.local:30098
        image: 100.78.183.101:30500/auth-inbox-gateway:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        name: smm-video-shorts
        ports:
        - containerPort: 8080
          name: http-api
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/video_shorts_pipeline.py
          name: code-volume
          subPath: video_shorts_pipeline.py
      dnsPolicy: ClusterFirst
      priorityClassName: preemptible
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: smm-video-shorts-code
        name: code-volume
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: '{"apiVersion":"v1","kind":"Service","metadata":{"annotations":{},"labels":{"app":"smm-video-shorts","module":"smm-agent"},"name":"smm-video-shorts","namespace":"igaming-dev"},"spec":{"ports":[{"name":"http-api","port":8080,"protocol":"TCP","targetPort":8080}],"selector":{"app":"smm-video-shorts"},"type":"ClusterIP"}}

      '
  labels:
    app: smm-video-shorts
    module: smm-agent
  name: smm-video-shorts
  namespace: igaming-smm
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http-api
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: smm-video-shorts
  sessionAffinity: None
  type: ClusterIP
