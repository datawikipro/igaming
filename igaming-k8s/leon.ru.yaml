apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-leon-db
  namespace: igaming-dev
  labels:
    app: igaming-source-leon-db
spec:
  serviceName: igaming-source-leon-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-leon-db
  template:
    metadata:
      labels:
        app: igaming-source-leon-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_leon
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        emptyDir: {}

