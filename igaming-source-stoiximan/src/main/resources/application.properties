server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-stoiximan

# Database configuration (in-memory H2 default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:stoiximan;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false

# Non-blocking HikariCP & JPA defaults
# spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Bookmaker identity
app.bookmaker.name=${APP_BOOKMAKER_NAME:stoiximan}
app.bookmaker.country=${APP_BOOKMAKER_COUNTRY:GR}
app.bookmaker.currency=${APP_BOOKMAKER_CURRENCY:EUR}
app.bookmaker.legal-status=${APP_BOOKMAKER_LEGAL_STATUS:LICENSED}
app.bookmaker.kyc-level=${APP_BOOKMAKER_KYC_LEVEL:FULL_DOCUMENT}
app.bookmaker.accepts-crypto=${APP_BOOKMAKER_ACCEPTS_CRYPTO:false}
app.bookmaker.features=${APP_BOOKMAKER_FEATURES:BET_BUILDER,CASH_OUT,FAST_PAYOUT}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS:GR,CY}

spring.main.allow-circular-references=true

# Stoiximan / Kambi API Configuration
stoiximan.api.base-url=${STOIXIMAN_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}
stoiximan.api.brand=${STOIXIMAN_API_BRAND:${KAMBI_API_BRAND:kambi}}
stoiximan.api.locale=${STOIXIMAN_API_LOCALE:${KAMBI_API_LOCALE:en_GB}}
stoiximan.api.market=${STOIXIMAN_API_MARKET:${KAMBI_API_MARKET:GLOBAL}}

# Proxy configuration
stoiximan.proxy.enabled=${KAMBI_PROXY_ENABLED:${STOIXIMAN_PROXY_ENABLED:true}}
stoiximan.proxy.host=${KAMBI_PROXY_HOST:${STOIXIMAN_PROXY_HOST:purevpn-uk-direct.proxy.svc.cluster.local}}
stoiximan.proxy.port=${KAMBI_PROXY_PORT:${STOIXIMAN_PROXY_PORT:3128}}

# Kafka configuration
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka.igaming-master.svc.cluster.local:9092}}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka.igaming-master.svc.cluster.local:9092}

# Redis configuration & health check disable
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:igaming-redis.igaming-dev.svc.cluster.local}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:el-GR}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:el-GR,el;q=0.9,en;q=0.8}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/Athens}
