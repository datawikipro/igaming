apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betmotion
  namespace: igaming-source
  labels:
    app: igaming-source-betmotion
spec:
  selector:
    app: igaming-source-betmotion
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betmotion
  namespace: igaming-source
  labels:
    app: igaming-source-betmotion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betmotion
  template:
    metadata:
      labels:
        app: igaming-source-betmotion
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      tolerations:
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h igaming-source-betmotion-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            echo "Waiting for igaming-source-betmotion-db..."
            sleep 2
          done
      containers:
      - name: igaming-source-betmotion
        image: 100.78.183.101:30500/igaming-source-bet7k:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_APPLICATION_NAME
          value: "igaming-source-betmotion"
        - name: SPRING_PROFILES_ACTIVE
          value: "crawler"
        - name: DB_URL
          value: "jdbc:postgresql://igaming-source-betmotion-db.igaming-source.svc.cluster.local:5432/igaming_betmotion"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: APP_BOOKMAKER_NAME
          value: "betmotion"
        - name: APP_ALTENAR_BRAND
          value: "betmotion"
        - name: APP_ALTENAR_INTEGRATION_ID
          value: "betmotion"
        - name: APP_VPN_ENABLED
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms256m -Xmx768m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 200m
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betmotion-db
  namespace: igaming-source
  labels:
    app: igaming-source-betmotion-db
spec:
  selector:
    app: igaming-source-betmotion-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-betmotion-db
  namespace: igaming-source
  labels:
    app: igaming-source-betmotion-db
spec:
  serviceName: igaming-source-betmotion-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-betmotion-db
  template:
    metadata:
      labels:
        app: igaming-source-betmotion-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      tolerations:
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_betmotion
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 10m
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: data
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
