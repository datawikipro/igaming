apiVersion: v1
kind: Service
metadata:
  name: igaming-source-pinnacle-crawler
  namespace: igaming-source
  labels:
    app: igaming-source-pinnacle-crawler
spec:
  selector:
    app: igaming-source-pinnacle-crawler
  ports:
  - protocol: TCP
    port: 3040
    targetPort: 3040
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-pinnacle
  namespace: igaming-source
  labels:
    app: igaming-source-pinnacle-crawler
spec:
  selector:
    app: igaming-source-pinnacle-crawler
  ports:
  - protocol: TCP
    port: 3040
    targetPort: 3040
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-pinnacle-crawler
  namespace: igaming-source
  labels:
    app: igaming-source-pinnacle-crawler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-pinnacle-crawler
  template:
    metadata:
      labels:
        app: igaming-source-pinnacle-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-pinnacle-crawler
        image: 100.78.183.101:30500/igaming-source-pinnacle:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: '3040'
        - name: APP_ROLE
          value: unified
        - name: APP_BOOKMAKER_NAME
          value: pinnacle
        - name: APP_BOOKMAKER_REGIONS
          value: "INT,EU"
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_VPN_FORCE
          value: "false"
        - name: PINNACLE_API_BASE_URL
          value: "https://guest.api.arcadia.pinnacle.com/0.1"
        - name: APP_TARGET_HOST
          value: pinnacle.com
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:pinnacle;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-master.svc.cluster.local:9092
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -Dhttp.proxyHost=purevpn-jp.proxy.svc.cluster.local -Dhttp.proxyPort=3128 -Dhttps.proxyHost=purevpn-jp.proxy.svc.cluster.local -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\""
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        ports:
        - containerPort: 3040
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 3040
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3040
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3040
          initialDelaySeconds: 10
          periodSeconds: 15
