apiVersion: v1
kind: Service
metadata:
  name: igaming-source-digitain-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-digitain-crawler
  ports:
  - protocol: TCP
    port: 3043
    targetPort: 3043
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-digitain-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-digitain-crawler
  template:
    metadata:
      labels:
        app: igaming-source-digitain-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-digitain-crawler
        image: 100.78.183.101:30500/igaming-source-digitain:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: crawler
        - name: APP_ROLE
          value: unified
        - name: SERVER_PORT
          value: "3043"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:digitain;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'false'
        - name: APP_BOOKMAKER_NAME
          value: digitain
        - name: APP_BOOKMAKER_FAMILY
          value: digitain
        - name: APP_TARGET_HOST
          value: melbet.ru
        - name: APP_DIGITAIN_WS_URL
          value: wss://apisportfeed-ff.melbet.ru/v3
        - name: APP_DIGITAIN_UUID
          value: 35c6d708-2caa-464a-bab5-a6656b2b80f3
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.kafka.svc.cluster.local:9092
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx512m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        ports:
        - containerPort: 3043
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3043
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3043
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3043
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 5
          timeoutSeconds: 5
