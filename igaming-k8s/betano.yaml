apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betano
  namespace: igaming-source
  labels:
    app: igaming-source-betano
spec:
  selector:
    app: igaming-source-betano
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betano
  namespace: igaming-source
  labels:
    app: igaming-source-betano
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betano
  template:
    metadata:
      labels:
        app: igaming-source-betano
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers: []
      containers:
      - name: igaming-source-betano
        image: 100.78.183.101:30500/igaming-source-betano:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "crawler"
        - name: PLAYWRIGHT_BROWSERS_PATH
          value: "/ms-playwright"
        - name: APP_BROWSER_STEALTH_PROFILE
          value: "HEADLESS_STEALTH"
        - name: APP_BROWSER_PRE_VISIT_KEYWORDS
          value: "none"
        - name: DB_URL
          value: "jdbc:h2:mem:betano;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:betano;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.h2.Driver"
        - name: SPRING_DATASOURCE_USERNAME
          value: "sa"
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: DB_USER
          value: "sa"
        - name: DB_PASSWORD
          value: ""
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.H2Dialect"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator-api.igaming-dev.svc.cluster.local:8080"
        - name: APP_PROXY_BACKEND_URL
          value: "http://service-proxy-backend.proxy.svc.cluster.local"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: APP_BETANO_BASE_URL
          value: "https://www.betano.de"
        - name: APP_VPN_ENABLED
          value: "true"
        - name: APP_BETANO_USE_PROXY
          value: "true"
        - name: APP_BETANO_PROXY_HOST
          value: "purevpn-de-direct.proxy.svc.cluster.local"
        - name: APP_BETANO_PROXY_PORT
          value: "3128"
        - name: APP_BROWSER_LOCALE
          value: "de-DE"
        - name: APP_BROWSER_ACCEPT_LANGUAGE
          value: "de-DE,de;q=0.9,en-US;q=0.8,en;q=0.7"
        - name: APP_BROWSER_TIMEZONE
          value: "Europe/Berlin"
        - name: APP_BROWSER_CONTEXT_ROTATION_THRESHOLD
          value: "500"
        - name: HTTP_PROXY
          value: "http://purevpn-de-direct.proxy.svc.cluster.local:3128"
        - name: HTTPS_PROXY
          value: "http://purevpn-de-direct.proxy.svc.cluster.local:3128"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: SPRING_CLOUD_REFRESH_ENABLED
          value: "false"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx1024m -XX:+UseG1GC -Dhttp.proxyHost=purevpn-de-direct.proxy.svc.cluster.local -Dhttp.proxyPort=3128 -Dhttps.proxyHost=purevpn-de-direct.proxy.svc.cluster.local -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.*|10.*|*.cluster.local|*.svc.cluster.local"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 6
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi

