apiVersion: v1
kind: Service
metadata:
  name: igaming-source-zenit-crawler
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-zenit-crawler
  ports:
  - protocol: TCP
    port: 3044
    targetPort: 3044
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-zenit-crawler
  namespace: igaming-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-zenit-crawler
  template:
    metadata:
      labels:
        app: igaming-source-zenit-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-zenit-crawler
        image: ghcr.io/datawikipro/igaming-source-zenit:latest
        imagePullPolicy: Always
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: HEADLESS_STEALTH
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: APP_BOOKMAKER_NAME
          value: zenit
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_ZENIT_LIVE_URL
          value: https://zenit.win/ajax/live/printer/ranked/%d?onlyview=0&lang_id=1&timezone=3
        - name: APP_ZENIT_PREMATCH_URL
          value: https://zenit.win/ajax/line/printer/react?all=1&onlyview=0&timeline=0&tournaments_mode=0&lang_id=1&timezone=3&length=50
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-zenit-db:5432/igaming_zenit
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_ZENIT_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_ZENIT_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '600'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '120000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '600000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3000'
        - name: SERVER_PORT
          value: '3044'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
        ports:
        - containerPort: 3044
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-zenit-loader
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-zenit-loader
  ports:
  - protocol: TCP
    port: 3044
    targetPort: 3044
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-zenit-loader
  namespace: igaming-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-zenit-loader
  template:
    metadata:
      labels:
        app: igaming-source-zenit-loader
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-zenit-loader
        image: ghcr.io/datawikipro/igaming-source-zenit:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: match-loader
        - name: APP_BOOKMAKER_NAME
          value: zenit
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_ZENIT_LIVE_URL
          value: https://zenit.win/ajax/live/printer/ranked/%d?onlyview=0&lang_id=1&timezone=3
        - name: APP_ZENIT_PREMATCH_URL
          value: https://zenit.win/ajax/line/printer/react?all=1&onlyview=0&timeline=0&tournaments_mode=0&lang_id=1&timezone=3&length=50
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-zenit-db:5432/igaming_zenit
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_ZENIT_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_ZENIT_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '600'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '120000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '600000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3000'
        - name: SERVER_PORT
          value: '3044'
        resources:
          requests:
            cpu: 30m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 1Gi
        ports:
        - containerPort: 3044
        resources:
          requests:
            cpu: 30m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3044
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3044
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3044
          initialDelaySeconds: 15
          periodSeconds: 10
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-zenit-db
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-zenit-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-zenit-db
  namespace: igaming-dev
spec:
  serviceName: igaming-source-zenit-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-zenit-db
  template:
    metadata:
      labels:
        app: igaming-source-zenit-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_zenit
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}

