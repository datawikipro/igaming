apiVersion: v1
kind: Pod
metadata:
  name: igaming-source-10bet-test
  namespace: igaming-dev
  labels:
    app: igaming-source-10bet-test
spec:
  dnsConfig:
    options:
    - name: ndots
      value: "1"
  imagePullSecrets:
  - name: regcred
  initContainers:
  - name: wait-for-db
    image: postgres:16-alpine
    command:
    - sh
    - -c
    - |
      until pg_isready -h igaming-source-10bet-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
        echo "Waiting for igaming-source-10bet-db..."
        sleep 2
      done
  containers:
  - name: igaming-source-10bet-test
    image: 100.78.183.101:30500/igaming-source-10bet:latest
    imagePullPolicy: Always
    ports:
    - containerPort: 8080
      protocol: TCP
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: "crawler"
    - name: DB_URL
      value: "jdbc:postgresql://igaming-source-10bet-db.igaming-source.svc.cluster.local:5432/igaming_10bet"
    - name: DB_USER
      value: "postgres"
    - name: DB_PASSWORD
      value: "postgres"
    - name: SPRING_JPA_HIBERNATE_DDL_AUTO
      value: "update"
    - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
      value: "false"
    - name: SPRING_JPA_DATABASE_PLATFORM
      value: "org.hibernate.dialect.PostgreSQLDialect"
    - name: APP_AGGREGATOR_URL
      value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: "kafka.kafka.svc.cluster.local:9092"
    - name: APP_10BET_USE_PROXY
      value: "false"
    - name: APP_10BET_PROXY_HOST
      value: "100.83.113.50"
    - name: APP_10BET_PROXY_PORT
      value: "3128"
    - name: SPRING_SQL_INIT_MODE
      value: "never"
    - name: SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION
      value: "true"
    - name: REDIS_HOST
      value: "igaming-redis.igaming-dev.svc.cluster.local"
    - name: MANAGEMENT_HEALTH_REDIS_ENABLED
      value: "false"
    - name: JAVA_TOOL_OPTIONS
      value: "-Xms128m -Xmx512m -XX:+UseG1GC"
    resources:
      requests:
        cpu: 10m
        memory: "192Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    startupProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 15
      failureThreshold: 3
      timeoutSeconds: 5
  restartPolicy: Always
