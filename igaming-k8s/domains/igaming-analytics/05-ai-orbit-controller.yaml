    app: igaming-ai-orbit-controller
  name: igaming-ai-orbit-controller
  namespace: igaming-analytics
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: igaming-ai-orbit-controller
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-10-19T05:10:15+03:00'
      creationTimestamp: null
      labels:
        app: igaming-ai-orbit-controller
    spec:
      containers:
      - command:
        - /bin/sh
        - /scripts/orbit-controller.sh
        env:
        - name: DB_HOST
          value: igaming-aggregator-db.igaming-enrichment.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        - name: DB_NAME
          value: igaming_analytics
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: ANALYST_HOST
          value: igaming-ai-analyst.igaming-analytics.svc.cluster.local
        - name: ANALYST_PORT
          value: '8080'
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        name: orbit-controller
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /scripts
          name: script-volume
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 493
          name: igaming-ai-orbit-controller-config
        name: script-volume
