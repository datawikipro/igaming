apiVersion: v1
kind: Service
metadata:
  name: igaming-source-dafabet-crawler
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-dafabet-crawler
  ports:
  - protocol: TCP
    port: 3050
    targetPort: 3050
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-dafabet-crawler
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-dafabet-crawler
  template:
    metadata:
      labels:
        app: igaming-source-dafabet-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-dafabet-crawler
        image: ghcr.io/datawikipro/igaming-source-dafabet:latest
        imagePullPolicy: Always
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: HEADLESS_STEALTH
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: '3050'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-dafabet-db:5432/igaming_dafabet
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: AGGREGATOR_URL
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: DAFABET_API_BASE_URL
          value: https://www.dafabet.com
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XshowSettings:vm
        ports:
        - containerPort: 3050
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1.5Gi
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
