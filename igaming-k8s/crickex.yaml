apiVersion: v1
kind: Service
metadata:
  name: igaming-source-crickex-json
  namespace: igaming-source
  labels:
    app: igaming-source-crickex-json
spec:
  selector:
    app: igaming-source-crickex-json
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-crickex-json
  namespace: igaming-source
  labels:
    app: igaming-source-crickex-json
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-crickex-json
  template:
    metadata:
      labels:
        app: igaming-source-crickex-json
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      priorityClassName: prod-critical
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-crickex-json
        image: 127.0.0.1:30500/igaming-source-crickex:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: crawler
        - name: SERVER_PORT
          value: "8080"
        - name: APP_BOOKMAKER_NAME
          value: crickex
        - name: APP_BOOKMAKER_REGIONS
          value: "IN,BD,PK"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:crickex;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "2"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: APP_CRAWLER_DISCOVERY_INTERVAL_MS
          value: "30000"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -Dhttp.proxyHost=cluster-ai-proxy.proxy.svc.cluster.local -Dhttp.proxyPort=3128 -Dhttps.proxyHost=cluster-ai-proxy.proxy.svc.cluster.local -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\""
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
          initialDelaySeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
