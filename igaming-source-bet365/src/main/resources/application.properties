server.port=${SERVER_PORT:3065}

spring.application.name=igaming-source-bet365

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:5432/igaming_bet365}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=bet365
app.bookmaker.regions=EU,GB,DE

# Bet365 API Configuration
bet365.api.base-url=${BET365_API_BASE_URL:https://www.bet365.com}
bet365.api.token=${BET365_API_TOKEN:mock-token-123}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=
app.browser.stealth-profile=HEADLESS_STEALTH

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/London}

# Telegram Bot Configuration
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_BOT_CHAT_ID:}
telegram.bot.cooldown-min=${TELEGRAM_BOT_COOLDOWN_MIN:15}


