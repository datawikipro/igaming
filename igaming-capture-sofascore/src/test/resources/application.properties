server.port=0

# Disable proxy and external connections during tests
sofascore.proxy.enabled=false
sofascore.proxy.host=localhost
sofascore.proxy.port=3128

app.role=none
app.capture.enabled=false
app.enrichment.enabled=false
app.kafka.enabled=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# In-memory datasource or mock
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
