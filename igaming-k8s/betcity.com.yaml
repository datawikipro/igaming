apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betcity-com-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betcity-com-crawler
  ports:
  - protocol: TCP
    port: 3042
    targetPort: 3042
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betcity-com-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betcity-com-crawler
  template:
    metadata:
      labels:
        app: igaming-source-betcity-com-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      initContainers:
      - name: wait-for-low-cpu
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          # Calculate a delay based on hostname hash to stagger startup
          delay=$(( $(echo -n "$(hostname)" | cksum | cut -f1 -d' ') % 90 ))
          echo "Staggering startup: sleeping for ${delay} seconds..."
          sleep ${delay}
          echo "Checking node CPU load before starting..."
          while true; do
            # Read /proc/stat twice 1 second apart to calculate CPU usage
            read cpu user1 nice1 system1 idle1 rest1 < /proc/stat
            sleep 1
            read cpu user2 nice2 system2 idle2 rest2 < /proc/stat
            total1=$((user1 + nice1 + system1 + idle1))
            total2=$((user2 + nice2 + system2 + idle2))
            dtotal=$((total2 - total1))
            didle=$((idle2 - idle1))
            if [ $dtotal -eq 0 ]; then
              echo "Could not compute CPU usage, retrying..."
              sleep 5
              continue
            fi
            cpu_pct=$(( (dtotal - didle) * 100 / dtotal ))
            echo "Current node CPU usage: ${cpu_pct}%  (threshold: 90%)"
            if [ "$cpu_pct" -lt 90 ]; then
              echo "CPU usage is below 90%, proceeding with startup."
              exit 0
            fi
            echo "CPU is too high (${cpu_pct}%), waiting 15 seconds..."
            sleep 15
          done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 20m
            memory: 16Mi
      containers:
      - name: igaming-source-betcity-com-crawler
        image: ghcr.io/datawikipro/igaming-source-betcity:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          Xvfb :99 -ac -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          export DISPLAY=:99
          exec java -jar app.jar
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_ROLE
          value: league-crawler
        - name: SERVER_PORT
          value: '3042'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-betcity-db:5432/igaming_betcity
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BETCITY_FETCH_INTERVAL_SECONDS
          value: '144'
        - name: APP_BETCITY_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '720'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '144000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '720000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3600'
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: betcity-com
        - name: APP_BOOKMAKER_REGIONS
          value: COM
        - name: APP_VPN_ENABLED
          value: 'false'
        - name: APP_TARGET_HOST
          value: ad.betsbc.com
        - name: APP_BETCITY_LIVE_URL
          value: https://ad.betsbc.com/d/on_air/bets?rev=8&add=dep_event&template=1
        - name: APP_BETCITY_PREMATCH_URL
          value: https://ad.betsbc.com/d/off/events?rev=6
        - name: APP_BETCITY_EVENT_URL_TEMPLATE
          value: https://betcity.com/ru/line/bets?id=%s
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        ports:
        - containerPort: 3042---
