apiVersion: v1
kind: Service
metadata:
  name: igaming-source-baltbet-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-baltbet-crawler
  ports:
  - protocol: TCP
    port: 3043
    targetPort: 3043
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-baltbet-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-baltbet-crawler
  template:
    metadata:
      labels:
        app: igaming-source-baltbet-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-baltbet-crawler
        image: 100.78.183.101:30500/igaming-source-baltbet:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: APP_BOOKMAKER_NAME
          value: baltbet
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_BALTBET_PREMATCH_URL
          value: https://events.baltbet.ru/api/prematch/table/fetch
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:baltbet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "2"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BALTBET_FETCH_INTERVAL_SECONDS
          value: "30"
        - name: APP_BALTBET_PREMATCH_FETCH_INTERVAL_SECONDS
          value: "60"
        - name: SERVER_PORT
          value: "3043"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC"
        ports:
        - containerPort: 3043
        resources:
          requests:
            cpu: 10m
            memory: 192Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3043
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3043
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3043
          periodSeconds: 10
          timeoutSeconds: 5
