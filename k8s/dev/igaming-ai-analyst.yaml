apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-ai-analyst
  namespace: igaming-dev
  labels:
    app: igaming-ai-analyst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-ai-analyst
  template:
    metadata:
      labels:
        app: igaming-ai-analyst
    spec:
      containers:
      - name: igaming-ai-analyst
        image: 100.78.183.101:30500/igaming-ai-analyst:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://igaming-aggregator-db.igaming-dev.svc.cluster.local:5432/igaming_aggregator"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: WORKER_POOL_SIZE
          value: "20"
        - name: WORKER_URL_TEMPLATE
          value: "http://plane-ai-worker-%d.plane-ai-worker.plane.svc.cluster.local:8000"
        - name: ANALYST_MODEL
          value: "gemini-3.8-flash-high"
        - name: ANALYST_SCAN_ENABLED
          value: "true"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-ai-analyst
  namespace: igaming-dev
  labels:
    app: igaming-ai-analyst
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30895
    name: http
  selector:
    app: igaming-ai-analyst
