apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-capture-liveresult
  namespace: igaming-dev
  labels:
    app: igaming-capture-liveresult
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-capture-liveresult
  template:
    metadata:
      labels:
        app: igaming-capture-liveresult
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: igaming-capture-liveresult
        image: 100.78.183.101:30500/igaming-capture-liveresult:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3042
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator-api.igaming-dev.svc.cluster.local:8080
        - name: APP_CAPTURE_ENABLED
          value: "true"
        - name: APP_CAPTURE_FIXED_DELAY
          value: "120000"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3042
          initialDelaySeconds: 45
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3042
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-capture-liveresult
  namespace: igaming-dev
  labels:
    app: igaming-capture-liveresult
spec:
  ports:
  - name: http
    port: 80
    targetPort: 3042
  selector:
    app: igaming-capture-liveresult
  type: ClusterIP
