# Server port
server.port=${SERVER_PORT:3050}
spring.application.name=igaming-source-dafabet

# Bookmaker config
app.bookmaker.name=${APP_BOOKMAKER_NAME:dafabet}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS:${APP_BOOKMAKER_REGION:international}}
app.target.host=${APP_TARGET_HOST:www.dafabet.com}

# Dafabet API
dafabet.api.base-url=${DAFABET_API_BASE_URL:https://www.dafabet.com}
dafabet.fetch.delay-ms=60000

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Proxy config (disabled)
app.proxy.backend.url=${APP_PROXY_BACKEND_URL:http://service-proxy-backend.service-proxy.svc.cluster.local}
app.vpn.enabled=false
app.browser.pre-visit-keywords=dafabet,sports

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Asia/Singapore}
