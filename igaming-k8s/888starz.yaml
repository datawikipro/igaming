apiVersion: v1
kind: Service
metadata:
  name: igaming-source-888starz-db
  namespace: igaming-source
  labels:
    app: igaming-source-888starz-db
spec:
  selector:
    app: igaming-source-888starz-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-888starz-db
  namespace: igaming-source
  labels:
    app: igaming-source-888starz-db
spec:
  serviceName: igaming-source-888starz-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-888starz-db
  template:
    metadata:
      labels:
        app: igaming-source-888starz-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_888starz
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 10m
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: data
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
