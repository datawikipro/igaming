server.port=${SERVER_PORT:8080}

# Kafka Consumer configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=igaming-ai-analyst-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Canonical Reactive Topics
app.kafka.topics.xg=sports.canonical.xg
app.kafka.topics.shots=sports.canonical.shots
app.kafka.topics.injuries=sports.canonical.injuries
app.kafka.topics.weather=sports.canonical.weather
app.kafka.topics.referees=sports.canonical.referees
app.kafka.topics.smart-money=odds.smart-money
app.kafka.topics.tennis-points=sports.tennis.point-by-point

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
