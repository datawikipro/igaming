apiVersion: v1
kind: Pod
metadata:
  name: igaming-source-betano-test
  namespace: igaming-dev
  labels:
    app: igaming-source-betano-test
spec:
  dnsConfig:
    options:
    - name: ndots
      value: "1"
  imagePullSecrets:
  - name: regcred
  initContainers:
  - name: wait-for-db
    image: postgres:16-alpine
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - |
      until pg_isready -h igaming-source-betano-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
        echo "Waiting for igaming-source-betano-db..."
        sleep 2
      done
      echo "Database is ready!"
  containers:
  - name: igaming-source-betano-test
    image: 100.78.183.101:30500/igaming-source-betano:latest
    imagePullPolicy: Always
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: "league-crawler"
    - name: APP_ROLE
      value: "league-crawler"
    - name: SERVER_PORT
      value: "8080"
    - name: DB_URL
      value: "jdbc:postgresql://igaming-source-betano-db.igaming-source.svc.cluster.local:5432/igaming_betano"
    - name: DB_USER
      value: "postgres"
    - name: DB_PASSWORD
      value: "postgres"
    - name: SPRING_DATASOURCE_URL
      value: "jdbc:postgresql://igaming-source-betano-db.igaming-source.svc.cluster.local:5432/igaming_betano"
    - name: SPRING_DATASOURCE_USERNAME
      value: "postgres"
    - name: SPRING_DATASOURCE_PASSWORD
      value: "postgres"
    - name: SPRING_JPA_HIBERNATE_DDL_AUTO
      value: "update"
    - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
      value: "false"
    - name: SPRING_JPA_DATABASE_PLATFORM
      value: "org.hibernate.dialect.PostgreSQLDialect"
    - name: SPRING_SQL_INIT_MODE
      value: "never"
    - name: SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION
      value: "true"
    - name: APP_AGGREGATOR_URL
      value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
    - name: SPRING_DATA_REDIS_HOST
      value: "igaming-redis.igaming-dev.svc.cluster.local"
    - name: SPRING_DATA_REDIS_PORT
      value: "6379"
    - name: MANAGEMENT_HEALTH_REDIS_ENABLED
      value: "false"
    - name: BETANO_PROXY_ENABLED
      value: "true"
    - name: BETANO_PROXY_HOST
      value: "100.83.113.50"
    - name: BETANO_PROXY_PORT
      value: "3128"
    - name: APP_BETANO_USE_PROXY
      value: "true"
    - name: APP_BETANO_PROXY_HOST
      value: "100.83.113.50"
    - name: APP_BETANO_PROXY_PORT
      value: "3128"
    - name: JAVA_TOOL_OPTIONS
      value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -Dhttp.proxyHost=100.83.113.50 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=100.83.113.50 -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\""
    ports:
    - containerPort: 8080
      protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
    startupProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 3
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3
      timeoutSeconds: 3
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 5
      timeoutSeconds: 3
  restartPolicy: Always
