events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # LLM Services
    server {
        listen 80;
        server_name llm-admin.smartbet.guru.local llm.smartbet.guru.local localhost 100.86.137.112;

        location / {
            proxy_pass http://llm-frontend.llm.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Airflow Service in s3-dev
    server {
        listen 80;
        server_name airflow.smartbet.guru.local airflow.s3-dev.smartbet.guru.local;

        location / {
            proxy_pass http://airflow-api-server.s3-dev.svc.cluster.local:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets and execution logs support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
        }
    }

    # MinIO Console in s3-dev
    server {
        listen 80;
        server_name minio.smartbet.guru.local minio.s3-dev.smartbet.guru.local minio-console.smartbet.guru.local;

        location / {
            proxy_pass http://minio-console.s3-dev.svc.cluster.local:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # MinIO API in s3-dev
    server {
        listen 80;
        server_name minio-api.smartbet.guru.local minio-api.s3-dev.smartbet.guru.local;

        location / {
            proxy_pass http://minio.s3-dev.svc.cluster.local:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable body limits for S3 uploads
            client_max_body_size 0;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # Apache Superset in s3-dev (Uses dynamic DNS resolution to prevent Nginx boot failure when service is offline)
    server {
        listen 80;
        server_name superset.smartbet.guru.local superset.s3-dev.smartbet.guru.local;

        location / {
            resolver 10.43.0.10 valid=5s;
            set $superset_upstream http://superset.s3-dev.svc.cluster.local:8088;
            proxy_pass $superset_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
