spring.application.name=igaming-source-wplay
spring.profiles.active=${SPRING_PROFILES_ACTIVE:crawler}

server.port=${SERVER_PORT:8080}

app.bookmaker.name=wplay
app.bookmaker.family=playtech
app.bookmaker.country=CO
app.bookmaker.currency=COP
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=LIGHT_PHONE
app.bookmaker.accepts-crypto=false
app.bookmaker.features=FAST_PAYOUT,CASH_OUT
app.bookmaker.regions=CO,LATAM

app.wplay.base-url=${APP_WPLAY_BASE_URL:https://apuestas.wplay.co}
app.target.host=apuestas.wplay.co
app.vpn.enabled=${APP_VPN_ENABLED:false}

app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}
app.proxy.backend.url=${APP_PROXY_BACKEND_URL:http://service-proxy-backend.service-proxy.svc.cluster.local}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://igaming-source-wplay-db:5432/igaming_wplay}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.cloud.refresh.enabled=false

# Non-blocking HikariCP & JPA per Golden Rule 4
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:igaming-redis.igaming-dev.svc.cluster.local}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
app.persistence.use-redis-factors=true

# Crawler Delays
app.crawler.discovery-delay=${CRAWLER_DISCOVERY_DELAY:120000}
app.crawler.odds-delay=${CRAWLER_ODDS_DELAY:30000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
