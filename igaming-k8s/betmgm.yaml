apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betmgm-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betmgm-crawler
  ports:
  - protocol: TCP
    port: 3065
    targetPort: 3065
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betmgm-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betmgm-crawler
  template:
    metadata:
      labels:
        app: igaming-source-betmgm-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers: []
      containers:
      - name: igaming-source-betmgm-crawler
        image: 100.78.183.101:30500/igaming-source-betmgm:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3065
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "crawler"
        - name: APP_ROLE
          value: "unified"
        - name: SERVER_PORT
          value: "3065"
        - name: APP_BROWSER_STEALTH_PROFILE
          value: "XVFB_HEADED"
        - name: APP_BROWSER_LOCALE
          value: "en-US"
        - name: APP_BROWSER_ACCEPT_LANGUAGE
          value: "en-US,en;q=0.9"
        - name: APP_BROWSER_TIMEZONE
          value: "America/New_York"
        - name: APP_BOOKMAKER_REGIONS
          value: "us"
        - name: HTTP_PROXY_HOST
          value: "purevpn-us-ca.proxy.svc.cluster.local"
        - name: HTTP_PROXY_PORT
          value: "3128"
        - name: APP_PROXY_DIRECT
          value: "false"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:betmgm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_DATASOURCE_USERNAME
          value: "sa"
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.h2.Driver"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.H2Dialect"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: APP_BOOKMAKER_NAME
          value: "betmgm"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx768m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3065
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3065
          initialDelaySeconds: 40
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3065
          initialDelaySeconds: 25
          periodSeconds: 10
          failureThreshold: 3
