          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi

