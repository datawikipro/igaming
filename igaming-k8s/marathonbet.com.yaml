apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-com-crawler
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-marathonbet-com-crawler
  ports:
  - protocol: TCP
    port: 3037
    targetPort: 3037
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-marathonbet-com-crawler
  namespace: igaming-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-marathonbet-com-crawler
  template:
    metadata:
      labels:
        app: igaming-source-marathonbet-com-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-marathonbet-com-crawler
        image: ghcr.io/datawikipro/igaming-source-marathonbet:latest
        imagePullPolicy: Always
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: HEADLESS_STEALTH
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-marathonbet-com
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: '3037'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-marathonbet-com-db:5432/igaming_marathonbet_com
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: MARATHONBET_FETCH_INTERVAL
          value: '120'
        - name: MARATHONBET_PREMATCH_FETCH_INTERVAL
          value: '600'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '120000'
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: marathonbet-com
        - name: APP_BOOKMAKER_REGIONS
          value: INT,EU
        - name: APP_BOOKMAKER_URL
          value: https://www.marathonbet.com
        - name: APP_TARGET_HOST
          value: www.marathonbet.com
        - name: APP_MENU_PREMATCH_URL
          value: https://www.marathonbet.com/su/react/event/menu/prematch
        - name: APP_MENU_LIVE_URL
          value: https://www.marathonbet.com/su/react/event/menu/live
        - name: APP_BETTING_BASE_URL
          value: https://www.marathonbet.com/su/betting
        - name: APP_LIVE_UPDATE_URL
          value: https://lu.marathonbet.com/su/liveupdate
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            -XX:+UseStringDeduplication -XshowSettings:vm
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
        ports:
        - containerPort: 3037
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
