apiVersion: v1
kind: Service
metadata:
  name: igaming-aggregator
  namespace: igaming-enrichment
  labels:
    app: igaming-aggregator
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: http-alt
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: igaming-aggregator-api
  type: ClusterIP
