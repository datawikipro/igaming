server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-paf

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:igaming-source-paf-db}:${DATABASE_PORT:5432}/${DATABASE_NAME:igaming_paf}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

app.aggregator.url=${APP_AGGREGATOR_URL:${AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}}

app.bookmaker.name=paf
app.bookmaker.country=FI
app.bookmaker.currency=EUR
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT
app.bookmaker.regions=FI,EU,GLOBAL

paf.api.base-url=${PAF_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}
paf.api.brand=${KAMBI_API_BRAND:${PAF_API_BRAND:paf}}
paf.api.locale=${KAMBI_API_LOCALE:${PAF_API_LOCALE:fi_FI}}
paf.api.market=${KAMBI_API_MARKET:${PAF_API_MARKET:FI}}

paf.proxy.enabled=${KAMBI_PROXY_ENABLED:true}
paf.proxy.host=${KAMBI_PROXY_HOST:100.83.113.50}
paf.proxy.port=${KAMBI_PROXY_PORT:3128}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
