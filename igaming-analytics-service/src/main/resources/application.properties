server.port=3043

# ──────────────────────────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ──────────────────────────────────────────────────────────────
# Aggregator service URLs (K8s DNS, no IP addresses!)
# ──────────────────────────────────────────────────────────────
aggregator.stats.url=${AGGREGATOR_STATS_URL:http://igaming-aggregator/api/diagnostics/stats}
aggregator.analytics.url=${AGGREGATOR_ANALYTICS_URL:http://igaming-aggregator/api/analytics/matches}
aggregator.management.url=${AGGREGATOR_MANAGEMENT_URL:http://igaming-aggregator/api/v1/management}
aggregator.fleet.url=${AGGREGATOR_FLEET_URL:http://igaming-aggregator/api/bookmakers/fleet}
aggregator.fleet.refresh.url=${AGGREGATOR_FLEET_REFRESH_URL:http://igaming-aggregator/api/bookmakers/fleet/refresh}
aggregator.delays.url=${AGGREGATOR_DELAYS_URL:http://igaming-aggregator/api/diagnostics/loader-delays}

# ──────────────────────────────────────────────────────────────
# Static resources — serve entity-resolution-hub.html
# ──────────────────────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**

# ──────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────
logging.level.pro.datawiki.igaming.analytics=INFO
logging.level.org.springframework.web.client=WARN
