# Server Port
server.port=${SERVER_PORT:3040}
spring.application.name=igaming-source-pinnacle

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://igaming-source-pinnacle-db.igaming-source.svc.cluster.local:5432/igaming_pinnacle}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hikari non-blocking settings
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}}

# Bookmaker identity
app.bookmaker.name=pinnacle
app.bookmaker.regions=INT,EU

# Pinnacle Guest API Configuration
pinnacle.api.base-url=${PINNACLE_API_BASE_URL:https://guest.api.arcadia.pinnacle.com/0.1}
app.target.host=pinnacle.com

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/London}
