spring.application.name=igaming-source-bcgame
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bcgame;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

app.bcgame.base-url=${BCGAME_BASE_URL:https://bc.game/api/sports}
app.bcgame.use-proxy=${APP_BCGAME_USE_PROXY:${BCGAME_USE_PROXY:true}}
app.bcgame.proxy-host=${APP_BCGAME_PROXY_HOST:${BCGAME_PROXY_HOST:cluster-ai-proxy.proxy.svc.cluster.local}}
app.bcgame.proxy-port=${APP_BCGAME_PROXY_PORT:${BCGAME_PROXY_PORT:3128}}
app.bcgame.fetch-interval-ms=${BCGAME_FETCH_INTERVAL_MS:30000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

app.bookmaker.name=bcgame
app.bookmaker.country=INT
app.bookmaker.currency=USD
app.bookmaker.legal-status=CRYPTO_NO_KYC
app.bookmaker.kyc-level=NO_KYC
app.bookmaker.accepts-crypto=true
app.bookmaker.features=CRYPTO,FAST_PAYOUT,VIP_HIGH_LIMIT
app.bookmaker.regions=INT,GLOBAL
