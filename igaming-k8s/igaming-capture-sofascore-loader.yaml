apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-capture-sofascore-loader
  namespace: igaming-dev
  labels:
    app: igaming-capture-sofascore-loader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-capture-sofascore-loader
  template:
    metadata:
      labels:
        app: igaming-capture-sofascore-loader
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: igaming-capture-sofascore-loader
        image: 100.78.183.101:30500/igaming-capture-sofascore:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3041
          protocol: TCP
        env:
        - name: APP_ROLE
          value: "loader"
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-aggregator-db.igaming-dev.svc.cluster.local:5432/igaming_sofascore
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: SOFASCORE_PROXY_ENABLED
          value: "true"
        - name: SOFASCORE_PROXY_HOST
          value: cluster-switch-proxy.proxy
        - name: SOFASCORE_PROXY_PORT
          value: "3128"
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator-api.igaming-dev.svc.cluster.local:8080
        - name: SOFASCORE_LOADER_HISTORY_DELAY_MS
          value: "250"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3041
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3041
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3041
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 800m
            memory: 1024Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-capture-sofascore-loader
  namespace: igaming-dev
  labels:
    app: igaming-capture-sofascore-loader
spec:
  ports:
  - name: http
    port: 80
    targetPort: 3041
  selector:
    app: igaming-capture-sofascore-loader
  type: ClusterIP
