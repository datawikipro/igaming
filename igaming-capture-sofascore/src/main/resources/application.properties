server.port=3041

# Aggregator connection
app.aggregator.url=http://localhost:3034

# Polling configuration (5 minutes in milliseconds)
app.capture.fixed-delay=300000
app.capture.enabled=true

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Autonomous AI Agent Verification Stamp
app.ai.verified=true
