spring.application.name=igaming-source-digitain
spring.profiles.active=${SPRING_PROFILES_ACTIVE:league-crawler}

server.port=${SERVER_PORT:3043}

app.bookmaker.name=${APP_BOOKMAKER_NAME:digitain}
app.bookmaker.family=${APP_BOOKMAKER_FAMILY:digitain}
app.role=${APP_ROLE:${SPRING_PROFILES_ACTIVE:league-crawler}}
app.vpn.enabled=true
app.bookmaker.region=${APP_BOOKMAKER_REGIONS:ru}
app.target.host=melbet.ru
app.digitain.ws-url=${APP_DIGITAIN_WS_URL:wss://apisportfeed-ff.melbet.ru/v3}
app.digitain.uuid=${APP_DIGITAIN_UUID:35c6d708-2caa-464a-bab5-a6656b2b80f3}

# Proxy backend
app.proxy.backend.url=${APP_PROXY_BACKEND_URL:http://service-proxy-backend.service-proxy.svc.cluster.local}
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/igaming_digitain}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# Crawler Configuration
app.crawler.delay=${CRAWLER_DELAY:60000}
app.browser.pre-visit-keywords=

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# HikariCP & JPA non-blocking
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
