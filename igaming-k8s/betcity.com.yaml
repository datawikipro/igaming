apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betcity-com-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betcity-com-crawler
  ports:
  - protocol: TCP
    port: 3042
    targetPort: 3042
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betcity-com-crawler
  namespace: igaming-source
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betcity-com-crawler
  template:
    metadata:
      labels:
        app: igaming-source-betcity-com-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-schema-check
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          HOST="igaming-source-betcity-com-db"
          USER="postgres"
          export PGPASSWORD="postgres"
          echo "⏳ Waiting for PostgreSQL ($HOST) to accept connections..."
          until pg_isready -h "$HOST.igaming-source.svc.cluster.local." -p 5432 -U "$USER" >/dev/null 2>&1; do
            sleep 1
          done
          echo "✅ PostgreSQL ($HOST) is ready! Handing over schema management to Java AutoMigrate."
      containers:
      - name: igaming-source-betcity-com-crawler
        image: ghcr.io/datawikipro/igaming-source-betcity:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_ROLE
          value: league-crawler
        - name: SERVER_PORT
          value: '3042'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-betcity-com-db.igaming-source.svc.cluster.local:5432/igaming_betcity_com
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BETCITY_FETCH_INTERVAL_SECONDS
          value: '30'
        - name: APP_BETCITY_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '30000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '120000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '500'
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: betcity-com
        - name: APP_BOOKMAKER_REGIONS
          value: COM
        - name: APP_VPN_ENABLED
          value: 'false'
        - name: APP_TARGET_HOST
          value: ad.betcity.ru
        - name: APP_BETCITY_LIVE_URL
          value: https://ad.betcity.ru/d/on_air/bets?rev=8&add=dep_event&template=1
        - name: APP_BETCITY_PREMATCH_URL
          value: https://ad.betcity.ru/d/off/events?rev=6
        - name: APP_BETCITY_EVENT_URL_TEMPLATE
          value: https://betcity.com/ru/line/bets?id=%s
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -Dhttp.proxyHost=100.83.113.50 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=100.83.113.50 -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\""
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1200m
            memory: 2048Mi
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp
          name: tmp
        ports:
        - containerPort: 3042
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3042
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 120
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3042
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3042
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
---
