apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-aggregator-api
  namespace: igaming-dev
  labels:
    app: igaming-aggregator-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: igaming-aggregator-api
  template:
    metadata:
      labels:
        app: igaming-aggregator-api
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      imagePullSecrets:
      - name: regcred
      containers:
      - name: api
        image: 100.78.183.101:30500/igaming-aggregator-api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3035
          protocol: TCP
        env:
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: "true"
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: SERVER_PORT
          value: "3035"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-aggregator-db:5432/igaming_aggregator
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: DATABASE_HOST
          value: igaming-aggregator-db
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis
        - name: REDIS_HOST
          value: igaming-redis
        - name: HIKARI_MAX_POOL_SIZE
          value: "30"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75.0
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3035
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3035
            scheme: HTTP
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3035
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 1Gi
      restartPolicy: Always
