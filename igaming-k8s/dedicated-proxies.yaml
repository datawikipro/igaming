---
# Cross-namespace aliases for igaming-dev
apiVersion: v1
kind: Service
metadata:
  name: de-proxy
  namespace: igaming-dev
spec:
  type: ExternalName
  externalName: de-proxy.proxy.svc.cluster.local
---
apiVersion: v1
kind: Service
