apiVersion: v1
kind: Service
metadata:
  name: igaming-source-paf
  namespace: igaming-source
  labels:
    app: igaming-source-paf
spec:
  selector:
    app: igaming-source-paf
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-paf
  namespace: igaming-source
  labels:
    app: igaming-source-paf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-paf
  template:
    metadata:
      labels:
        app: igaming-source-paf
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-wait
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for igaming-source-paf-db..."
          until pg_isready -h igaming-source-paf-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            sleep 2
          done
          echo "Database is ready!"
      containers:
      - name: igaming-source-paf
        image: ghcr.io/datawikipro/igaming-source-paf:latest
        imagePullPolicy: Always
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: DB_HOST
          value: "igaming-source-paf-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "igaming_paf"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: DATABASE_HOST
          value: "igaming-source-paf-db"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "igaming_paf"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "100.83.113.50"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: KAMBI_API_BRAND
          value: "paf"
        - name: KAMBI_API_LOCALE
          value: "fi_FI"
        - name: KAMBI_API_MARKET
          value: "FI"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: JAVA_OPTS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-paf-db
  namespace: igaming-source
  labels:
    app: igaming-source-paf-db
spec:
  selector:
    app: igaming-source-paf-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-paf-db
  namespace: igaming-source
  labels:
    app: igaming-source-paf-db
spec:
  serviceName: igaming-source-paf-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-paf-db
  template:
    metadata:
      labels:
        app: igaming-source-paf-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_paf
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        command:
        - "docker-entrypoint.sh"
        - "postgres"
        - "-c"
        - "synchronous_commit=off"
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
