server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-stoiximan

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:igaming_stoiximan}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Non-blocking HikariCP & JPA defaults
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=stoiximan
app.bookmaker.country=GR
app.bookmaker.currency=EUR
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT
app.bookmaker.regions=GR,CY

spring.main.allow-circular-references=true

# Stoiximan / Kambi API Configuration
stoiximan.api.base-url=${STOIXIMAN_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}
stoiximan.api.brand=${STOIXIMAN_API_BRAND:${KAMBI_API_BRAND:kambi}}
stoiximan.api.locale=${STOIXIMAN_API_LOCALE:${KAMBI_API_LOCALE:en_GB}}
stoiximan.api.market=${STOIXIMAN_API_MARKET:${KAMBI_API_MARKET:GLOBAL}}

# Proxy configuration
stoiximan.proxy.enabled=${KAMBI_PROXY_ENABLED:true}
stoiximan.proxy.host=${KAMBI_PROXY_HOST:proxy-us.service-proxy.svc.cluster.local}
stoiximan.proxy.port=${KAMBI_PROXY_PORT:31292}

# Redis configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:igaming-redis.igaming-dev.svc.cluster.local}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}


# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:el-GR}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:el-GR,el;q=0.9,en;q=0.8}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/Athens}
