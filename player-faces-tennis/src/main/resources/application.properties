server.port=${SERVER_PORT:8092}

# Database Connection (Golden Rule #2: Service DNS names only, never hardcoded IP)
spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-player-faces-db}:${DB_PORT:5432}/${DB_NAME:player_faces}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Golden Rule #4: Non-blocking HikariCP & JPA Initialization
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Spring Boot Actuator Probes (Golden Rule #1)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Jackson JSON Settings
spring.jackson.serialization.fail-on-empty-beans=false
