        resources:
          requests:
            cpu:  10m
            memory:  256Mi
          limits:
            cpu:  800m
            memory:  512Mi
        ports:
        - containerPort: 3043
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3043
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 120
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
