# ============================================================
# igaming-boosty-bot — Dedicated pod for Boosty.to community agent
# Boosty API polling + donor management + comment collection for SmartBet.guru
# Namespace: igaming-dev
# ============================================================
---
# ── PostgreSQL for Boosty bot ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-boosty-bot-db
  namespace: igaming-dev
  labels:
    app: igaming-boosty-bot-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-boosty-bot-db
  template:
    metadata:
      labels:
        app: igaming-boosty-bot-db
        tier: database
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "igaming_boosty"
            - name: POSTGRES_USER
              value: "igaming"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: igaming-boosty-bot-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - postgres
            - -c
            - synchronous_commit=off
          volumeMounts:
            - name: boosty-db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - igaming
                - -d
                - igaming_boosty
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: boosty-db-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-boosty-bot-db
  namespace: igaming-dev
  labels:
    app: igaming-boosty-bot-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: igaming-boosty-bot-db
---
# ── Boosty Bot Application ────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-boosty-bot
  namespace: igaming-dev
  labels:
    app: igaming-boosty-bot
    tier: bots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-boosty-bot
  template:
    metadata:
      labels:
        app: igaming-boosty-bot
        tier: bots
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        # Wait for PostgreSQL to be ready before starting the app.
        # Uses DNS service name per AGENTS.md Rule #2 (no hardcoded IPs).
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z igaming-boosty-bot-db 5432; do
                echo "Waiting for igaming-boosty-bot-db:5432..."
                sleep 2
              done
              echo "DB is ready."
      containers:
        - name: boosty-bot
          image: 100.78.183.101:30500/igaming-boosty-bot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8089
              name: http
          env:
            - name: DB_HOST
              value: "igaming-boosty-bot-db"
            - name: DB_NAME
              value: "igaming_boosty"
            - name: DB_USER
              value: "igaming"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: igaming-boosty-bot-secrets
                  key: db-password
            # Boosty account credentials (extracted from browser session)
            - name: BOOSTY_BLOG_NAME
              valueFrom:
                secretKeyRef:
                  name: igaming-boosty-bot-secrets
                  key: boosty-blog-name
            - name: BOOSTY_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: igaming-boosty-bot-secrets
                  key: boosty-access-token
            - name: BOOSTY_DEVICE_ID
              valueFrom:
                secretKeyRef:
                  name: igaming-boosty-bot-secrets
                  key: boosty-device-id
            # Telegram donor chat notification bot
            - name: BOOSTY_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: igaming-boosty-bot-secrets
                  key: telegram-bot-token
                  optional: true
            - name: BOOSTY_TELEGRAM_DONOR_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: igaming-boosty-bot-secrets
                  key: telegram-donor-chat-id
                  optional: true
            - name: PORTAL_API_URL
              value: "http://igaming-portal.igaming-dev.svc.cluster.local:80"
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            # Polling intervals
            - name: BOOSTY_POLLING_INTERVAL_MS
              value: "60000"
            - name: BOOSTY_POLLING_INITIAL_DELAY_MS
              value: "15000"
            - name: BOOSTY_COMMENTS_POLLING_INTERVAL_MS
              value: "120000"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8089
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-boosty-bot
  namespace: igaming-dev
  labels:
    app: igaming-boosty-bot
spec:
  ports:
    - port: 8089
      targetPort: 8089
      name: http
  selector:
    app: igaming-boosty-bot
---
# ── Secret Template (create with kubectl) ──────────────────────
# kubectl create secret generic igaming-boosty-bot-secrets \
#   --namespace igaming-dev \
#   --from-literal=db-password='<DB_PASSWORD>' \
#   --from-literal=boosty-blog-name='smartbetguru' \
#   --from-literal=boosty-access-token='<BOOSTY_ACCESS_TOKEN_FROM_BROWSER>' \
#   --from-literal=boosty-device-id='<BOOSTY_DEVICE_ID_FROM_BROWSER>' \
#   --from-literal=telegram-bot-token='<TELEGRAM_BOT_TOKEN>' \
#   --from-literal=telegram-donor-chat-id='<TELEGRAM_CHAT_ID>'
#
# To obtain BOOSTY_ACCESS_TOKEN and BOOSTY_DEVICE_ID:
#   1. Log in to boosty.to in your browser
#   2. Open DevTools > Application > Cookies > api.boosty.to
#   3. Copy "auth" cookie or localStorage token
# ───────────────────────────────────────────────────────────────
