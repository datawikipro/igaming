server.port=3043

# ──────────────────────────────────────────────────────────────
# Actuator
# ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ──────────────────────────────────────────────────────────────
# Aggregator service URLs (K8s DNS, no IP addresses!)
# ──────────────────────────────────────────────────────────────
aggregator.stats.url=http://igaming-aggregator/api/diagnostics/stats
aggregator.analytics.url=http://igaming-aggregator/api/analytics/matches
aggregator.management.url=http://igaming-aggregator/api/v1/management

# ──────────────────────────────────────────────────────────────
# Static resources — serve entity-resolution-hub.html
# ──────────────────────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**

# ──────────────────────────────────────────────────────────────
# Crawler Operations & Threshold Monitor (Rule 8: >= 500 matches)
# ──────────────────────────────────────────────────────────────
crawler.threshold.min-matches=${CRAWLER_THRESHOLD_MIN_MATCHES:500}
crawler.threshold.warning-matches=${CRAWLER_THRESHOLD_WARNING_MATCHES:300}
crawler.threshold.stale-seconds=${CRAWLER_THRESHOLD_STALE_SECONDS:180}

# ──────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────
logging.level.pro.datawiki.igaming.analytics=INFO
logging.level.org.springframework.web.client=WARN

