spring.application.name=igaming-source-altenar
spring.profiles.active=${SPRING_PROFILES_ACTIVE:crawler}

server.port=${SERVER_PORT:8080}

app.bookmaker.name=${APP_BOOKMAKER_NAME:apuestatotal}
app.bookmaker.family=altenar
app.bookmaker.country=${APP_BOOKMAKER_COUNTRY:BR}
app.bookmaker.currency=${APP_BOOKMAKER_CURRENCY:BRL}
app.bookmaker.legal-status=${APP_BOOKMAKER_LEGAL_STATUS:LICENSED}
app.bookmaker.kyc-level=${APP_BOOKMAKER_KYC_LEVEL:LIGHT_PHONE}
app.bookmaker.accepts-crypto=${APP_BOOKMAKER_ACCEPTS_CRYPTO:false}
app.bookmaker.features=${APP_BOOKMAKER_FEATURES:CASH_OUT,FAST_PAYOUT}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS:BR}

# Altenar API Configuration
app.altenar.base-url=${APP_ALTENAR_BASE_URL:https://sb2frontend-altenar2.biahosted.com/api}
app.altenar.integration-id=${APP_ALTENAR_INTEGRATION_ID:${APP_BOOKMAKER_NAME:apuestatotal}}
app.altenar.origin=${APP_ALTENAR_ORIGIN:}
app.altenar.culture=${APP_ALTENAR_CULTURE:en-GB}
app.altenar.country-code=${APP_ALTENAR_COUNTRY_CODE:BR}
app.altenar.timezone-offset=${APP_ALTENAR_TIMEZONE_OFFSET:180}
app.altenar.connect-timeout=${APP_ALTENAR_CONNECT_TIMEOUT:15000}
app.altenar.read-timeout=${APP_ALTENAR_READ_TIMEOUT:120000}

# Proxy Configuration
app.altenar.proxy.enabled=${APP_ALTENAR_PROXY_ENABLED:${APP_PROXY_ENABLED:false}}
app.altenar.proxy.host=${APP_ALTENAR_PROXY_HOST:${APP_PROXY_HOST:purevpn-jp-direct.proxy.svc.cluster.local}}
app.altenar.proxy.port=${APP_ALTENAR_PROXY_PORT:${APP_PROXY_PORT:3128}}

# Aggregator
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# In-Memory H2 Database (Default 1-Pod / 1-Container)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:altenar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:-1}
spring.sql.init.mode=never
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:igaming-redis.igaming-dev.svc.cluster.local}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
management.health.redis.enabled=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}

# Schedulers
app.crawler.discovery-interval-ms=${APP_CRAWLER_DISCOVERY_INTERVAL_MS:10000}
app.crawler.live-interval-ms=${APP_CRAWLER_LIVE_INTERVAL_MS:3000}
app.crawler.odds-interval-ms=${APP_CRAWLER_ODDS_INTERVAL_MS:5000}
