server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-expekt

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:igaming_expekt}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

app.bookmaker.name=expekt
app.bookmaker.regions=EU,DK

expekt.api.base-url=${EXPEKT_API_BASE_URL:https://eu.offering-api.kambicdn.org/offering/v2018}
expekt.api.brand=${EXPEKT_API_BRAND:expekt}
expekt.api.locale=${EXPEKT_API_LOCALE:da_DK}
expekt.api.market=${EXPEKT_API_MARKET:DK}

expekt.proxy.enabled=${KAMBI_PROXY_ENABLED:true}
expekt.proxy.host=${KAMBI_PROXY_HOST:100.83.113.50}
expekt.proxy.port=${KAMBI_PROXY_PORT:3128}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always