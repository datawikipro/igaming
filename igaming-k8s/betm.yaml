apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betm-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betm-crawler
  ports:
  - protocol: TCP
    port: 3048
    targetPort: 3048
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betm-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betm-crawler
  template:
    metadata:
      labels:
        app: igaming-source-betm-crawler
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-betm-crawler
        image: 100.78.183.101:30500/igaming-source-betcity:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3048
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev,unified
        - name: APP_ROLE
          value: unified
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:betm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "50"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "5"
        - name: SPRING_THREADS_VIRTUAL_ENABLED
          value: "true"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-dev.svc.cluster.local:9092
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local
        - name: APP_BOOKMAKER_NAME
          value: betm
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_TARGET_HOST
          value: ad.betcity.ru
        - name: APP_BETCITY_LIVE_URL
          value: https://ad.betcity.ru/d/on_air/bets?rev=8&add=dep_event&template=1
        - name: APP_BETCITY_PREMATCH_URL
          value: https://ad.betcity.ru/d/off/events?rev=6
        - name: APP_BETCITY_EVENT_URL_TEMPLATE
          value: https://betm.ru/ru/line/bets?id=%s
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: SERVER_PORT
          value: '3048'
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2048Mi
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3048
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3048
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 6
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3048
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp
          name: tmp
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
