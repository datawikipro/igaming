apiVersion: v1
kind: Service
metadata:
  name: igaming-source-tonybet
  namespace: igaming-source
  labels:
    app: igaming-source-tonybet
spec:
  selector:
    app: igaming-source-tonybet
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-tonybet
  namespace: igaming-source
  labels:
    app: igaming-source-tonybet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-tonybet
  template:
    metadata:
      labels:
        app: igaming-source-tonybet
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-wait
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for igaming-source-tonybet-db..."
          until pg_isready -h igaming-source-tonybet-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            sleep 2
          done
          echo "Database is ready!"
      containers:
      - name: igaming-source-tonybet
        image: 127.0.0.1:30500/igaming-source-kambi:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: APP_BOOKMAKER_NAME
          value: "tonybet"
        - name: APP_BOOKMAKER_REGIONS
          value: "GLOBAL,EU"
        - name: APP_BOOKMAKER_EVENT_URL_PREFIX
          value: "https://tonybet.com/sport/event/"
        - name: APP_TARGET_HOST
          value: "eu.offering-api.kambicdn.com"
        - name: APP_PROXY_ENABLED
          value: "true"
        - name: APP_PROXY_HOST
          value: "purevpn-nl.proxy.svc.cluster.local"
        - name: APP_PROXY_PORT
          value: "3128"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "purevpn-nl.proxy.svc.cluster.local"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: STOIXIMAN_PROXY_HOST
          value: "purevpn-nl.proxy.svc.cluster.local"
        - name: STOIXIMAN_PROXY_PORT
          value: "3128"
        - name: KAMBI_API_BRAND
          value: "paf"
        - name: KAMBI_API_LOCALE
          value: "en_GB"
        - name: KAMBI_API_MARKET
          value: "GLOBAL"
        - name: STOIXIMAN_API_BRAND
          value: "paf"
        - name: STOIXIMAN_API_LOCALE
          value: "en_GB"
        - name: STOIXIMAN_API_MARKET
          value: "GLOBAL"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://igaming-source-tonybet-db.igaming-source.svc.cluster.local:5432/igaming_tonybet"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.postgresql.Driver"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -Djava.net.preferIPv4Stack=true"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-tonybet-db
  namespace: igaming-source
  labels:
    app: igaming-source-tonybet-db
spec:
  selector:
    app: igaming-source-tonybet-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-tonybet-db
  namespace: igaming-source
  labels:
    app: igaming-source-tonybet-db
spec:
  serviceName: igaming-source-tonybet-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-tonybet-db
  template:
    metadata:
      labels:
        app: igaming-source-tonybet-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_tonybet
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        command:
        - "docker-entrypoint.sh"
        - "postgres"
        - "-c"
        - "synchronous_commit=off"
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
