apiVersion: v1
kind: Service
metadata:
  name: smm-bot-vk
  namespace: igaming-dev
  labels:
    app: smm-bot-vk
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http-api
    protocol: TCP
  selector:
    app: smm-bot-vk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smm-bot-vk
  namespace: igaming-dev
  labels:
    app: smm-bot-vk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smm-bot-vk
  template:
    metadata:
      labels:
        app: smm-bot-vk
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
            weight: 10
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: smm-bot-vk
        image: 100.78.183.101:30500/auth-inbox-gateway:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/vk_donut_agent.py"]
        env:
        - name: PORT
          value: "8080"
        - name: VK_GROUP_ID
          value: "229123456"
        - name: VK_CONFIRMATION_CODE
          value: "sb_vk_donut_confirm_777"
        - name: VK_SECRET_KEY
          value: "sb_vk_donut_secret_key_888"
        - name: VK_ACCESS_TOKEN
          value: "vk1.a.dummy_donut_community_token_for_dev_mode"
        - name: REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: NO_PROXY
          value: "vk.com,api.vk.com,localhost,127.0.0.1,10.0.0.0/8"
        - name: HTTP_PROXY
          value: "http://100.83.113.50:3128"
        ports:
        - containerPort: 8080
          name: http-api
          protocol: TCP
        - containerPort: 6080
          name: novnc-ws
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: code-volume
          mountPath: /app/vk_donut_agent.py
          subPath: vk_donut_agent.py
      volumes:
      - name: code-volume
        configMap:
          name: smm-bot-vk-code
