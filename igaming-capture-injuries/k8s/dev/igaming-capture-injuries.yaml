apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-capture-injuries
  namespace: igaming-dev
  labels:
    app: igaming-capture-injuries
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-capture-injuries
  template:
    metadata:
      labels:
        app: igaming-capture-injuries
    spec:
      containers:
      - name: igaming-capture-injuries
        image: ghcr.io/datawikipro/igaming-capture-injuries:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3044
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: DB_HOST
          value: igaming-source-core-db
        - name: DB_NAME
          value: igaming_injuries
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: MDM_URL
          value: http://igaming-aggregator/api/v1/mdm
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.kafka:9092
        - name: APP_CRAWLER_PROXY_HOST
          value: "100.83.113.50"
        - name: APP_CRAWLER_PROXY_PORT
          value: "3128"
        - name: APP_CAPTURE_INJURIES_ENABLED
          value: "true"
        - name: APP_CAPTURE_INJURIES_FIXED_DELAY
          value: "300000"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3044
          initialDelaySeconds: 45
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3044
          initialDelaySeconds: 25
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-capture-injuries
  namespace: igaming-dev
  labels:
    app: igaming-capture-injuries
spec:
  ports:
  - port: 80
    targetPort: 3044
    name: http
  selector:
    app: igaming-capture-injuries
