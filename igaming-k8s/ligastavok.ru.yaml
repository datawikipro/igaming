apiVersion: v1
kind: Service
metadata:
  name: igaming-source-ligastavok-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-ligastavok-crawler
  ports:
  - protocol: TCP
    port: 8086
    targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-ligastavok-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-ligastavok-crawler
  template:
    metadata:
      labels:
        app: igaming-source-ligastavok-crawler
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-ligastavok-crawler
        image: 100.78.183.101:30500/igaming-source-ligastavok:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args: ["Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp & sleep 1 && exec java -cp @/app/jib-classpath-file pro.datawiki.igaming.source.ligastavok.LigastavokApplication"]
        ports:
        - containerPort: 8086
        env:
        - name: DISPLAY
          value: ":99"
        - name: SPRING_PROFILES_ACTIVE
          value: dev,unified
        - name: APP_ROLE
          value: unified
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: PLAYWRIGHT_BROWSERS_PATH
          value: /ms-playwright
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:ligastavok;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "50"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "5"
        - name: SPRING_THREADS_VIRTUAL_ENABLED
          value: "true"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-dev.svc.cluster.local:9092
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local
        - name: APP_MDM_SERVICE_URL
          value: "http://igaming-mdm-service.igaming-dev.svc.cluster.local:8095"
        - name: APP_BOOKMAKER_CODE
          value: "ligastavok"
        - name: APP_BOOKMAKER_NAME
          value: ligastavok
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_VPN_FORCE
          value: "false"
        - name: LIGASTAVOK_LIVE_URL
          value: https://www.ligastavok.ru/live
        - name: LIGASTAVOK_PREMATCH_URL
          value: https://www.ligastavok.ru/sports
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: SERVER_PORT
          value: '8086'
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2048Mi
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp
          name: tmp
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
