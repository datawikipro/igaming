apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-crawler
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-marathonbet-crawler
  ports:
  - protocol: TCP
    port: 3036
    targetPort: 3036
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-marathonbet-crawler
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-marathonbet-crawler
  template:
    metadata:
      labels:
        app: igaming-source-marathonbet-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-marathonbet-crawler
        image: ghcr.io/datawikipro/igaming-source-marathonbet:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-marathonbet
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: '3036'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-marathonbet-db:5432/igaming_marathonbet
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: 'http://service-proxy-backend.service-proxy.svc.cluster.local'
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: 'marathonbet'
        - name: APP_BOOKMAKER_REGIONS
          value: 'RU'
        - name: APP_BOOKMAKER_URL
          value: 'https://www.marathonbet.ru'
        - name: APP_TARGET_HOST
          value: 'www.marathonbet.ru'
        - name: APP_MENU_PREMATCH_URL
          value: 'https://www.marathonbet.ru/su/react/event/menu/prematch'
        - name: APP_MENU_LIVE_URL
          value: 'https://www.marathonbet.ru/su/react/event/menu/live'
        - name: APP_BETTING_BASE_URL
          value: 'https://www.marathonbet.ru/su/betting'
        - name: APP_LIVE_UPDATE_URL
          value: 'https://lu.marathonbet.ru/su/liveupdate'
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XshowSettings:vm
        ports:
        - containerPort: 3036
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1.5Gi
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-loader
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-marathonbet-loader
  ports:
  - protocol: TCP
    port: 3036
    targetPort: 3036
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-marathonbet-loader
  namespace: igaming-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: igaming-source-marathonbet-loader
  template:
    metadata:
      labels:
        app: igaming-source-marathonbet-loader
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-marathonbet-loader
        image: ghcr.io/datawikipro/igaming-source-marathonbet:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-marathonbet
        - name: SPRING_PROFILES_ACTIVE
          value: match-loader
        - name: SERVER_PORT
          value: '3036'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-marathonbet-db:5432/igaming_marathonbet
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: 'http://service-proxy-backend.service-proxy.svc.cluster.local'
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: 'marathonbet'
        - name: APP_BOOKMAKER_REGIONS
          value: 'RU'
        - name: APP_BOOKMAKER_URL
          value: 'https://www.marathonbet.ru'
        - name: APP_TARGET_HOST
          value: 'www.marathonbet.ru'
        - name: APP_MENU_PREMATCH_URL
          value: 'https://www.marathonbet.ru/su/react/event/menu/prematch'
        - name: APP_MENU_LIVE_URL
          value: 'https://www.marathonbet.ru/su/react/event/menu/live'
        - name: APP_BETTING_BASE_URL
          value: 'https://www.marathonbet.ru/su/betting'
        - name: APP_LIVE_UPDATE_URL
          value: 'https://lu.marathonbet.ru/su/liveupdate'
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XshowSettings:vm
        ports:
        - containerPort: 3036
        resources:
          requests:
            cpu: 30m
            memory: 192Mi
          limits:
            cpu: 300m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3036
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3036
          initialDelaySeconds: 90
          periodSeconds: 10
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-db
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-marathonbet-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-marathonbet-db
  namespace: igaming-dev
spec:
  serviceName: igaming-source-marathonbet-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-marathonbet-db
  template:
    metadata:
      labels:
        app: igaming-source-marathonbet-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_marathonbet
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
  volumeClaimTemplates:
  - metadata:
      name: pgdata
      namespace: igaming-dev
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
