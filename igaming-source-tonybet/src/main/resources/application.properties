server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-tonybet

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:igaming_tonybet}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Non-blocking HikariCP & JPA defaults
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=tonybet
app.bookmaker.regions=EU,GB

# TonyBet / Kambi API Configuration
tonybet.api.base-url=${TONYBET_API_BASE_URL:https://eu.offering-api.kambicdn.org/offering/v2018}
tonybet.api.brand=${TONYBET_API_BRAND:tonybet}
tonybet.api.locale=${TONYBET_API_LOCALE:en_GB}
tonybet.api.market=${TONYBET_API_MARKET:GB}

# Proxy configuration
tonybet.proxy.enabled=${KAMBI_PROXY_ENABLED:true}
tonybet.proxy.host=${KAMBI_PROXY_HOST:100.83.113.50}
tonybet.proxy.port=${KAMBI_PROXY_PORT:3128}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/London}
