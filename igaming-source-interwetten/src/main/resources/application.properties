spring.application.name=igaming-source-interwetten
server.port=${SERVER_PORT:8080}

app.bookmaker.name=interwetten
app.bookmaker.family=interwetten
app.bookmaker.country=AT
app.bookmaker.currency=EUR
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=LIGHT_PHONE
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT
app.bookmaker.accepts-crypto=false
app.bookmaker.regions=AT,DE,ES,GR,EU,GLOBAL

# Crawler API configuration
app.interwetten.base-url=https://www.interwetten.com/rest/sportsbook/v1
app.interwetten.connect-timeout=10000
app.interwetten.read-timeout=15000

# Aggregator URL
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Database Configuration (K8s DNS)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://igaming-source-interwetten-db.igaming-source.svc.cluster.local:5432/igaming_interwetten}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mandatory non-blocking HikariCP & JPA per Golden Rule 4
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true