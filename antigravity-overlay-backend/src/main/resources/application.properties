server.port=8080

# File-based H2 Database configuration (will persist data under a local ./data directory)
spring.datasource.url=jdbc:h2:file:./data/overlaydb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA and Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Google OAuth API Settings
google.client.id=${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET}

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Autonomous AI Agent Verification Stamp
app.ai.verified=true
