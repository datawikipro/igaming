            cpu: 30m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3037
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3037
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
