# Server Port
server.port=${SERVER_PORT}
spring.application.name=igaming-source-pinnacle

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL}

# Bookmaker identity
app.bookmaker.name=pinnacle
app.bookmaker.regions=INT,EU

# Pinnacle Guest API Configuration
pinnacle.api.base-url=${PINNACLE_API_BASE_URL}
app.target.host=pinnacle.com

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
