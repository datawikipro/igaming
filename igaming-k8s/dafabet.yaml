  template:
    metadata:
      labels:
        app: igaming-source-dafabet-loader
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-dafabet-loader
        image: ghcr.io/datawikipro/igaming-source-dafabet:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: match-loader
        - name: SERVER_PORT
          value: '3050'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-dafabet-db:5432/igaming_dafabet
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: AGGREGATOR_URL
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: DAFABET_API_BASE_URL
          value: https://www.dafabet.com
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XshowSettings:vm
        ports:
        - containerPort: 3050
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1.5Gi
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3050
          initialDelaySeconds: 420
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3050
          initialDelaySeconds: 300
          periodSeconds: 10
          failureThreshold: 3
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-dafabet-db
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-dafabet-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-dafabet-db
  namespace: igaming-dev
spec:
  serviceName: igaming-source-dafabet-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-dafabet-db
  template:
    metadata:
      labels:
        app: igaming-source-dafabet-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_dafabet
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}
