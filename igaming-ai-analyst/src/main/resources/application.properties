server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
spring.application.name=igaming-ai-analyst

# ── Operational Database (igaming_analytics) ──────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:igaming-aggregator-db.igaming-enrichment.svc.cluster.local}:5432/igaming_analytics}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── MDM Ground Truth Integration ───────────────────────────────────────────
app.mdm.url=${APP_MDM_URL:http://igaming-mdm-service.igaming-enrichment.svc.cluster.local:8095}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ── HikariCP Non-Blocking Configuration ───────────────────────────────────────
# spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# ── Redis (Live Ingestion Odds Consensus) ─────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:igaming-redis.igaming-enrichment.svc.cluster.local}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
management.health.redis.enabled=false

# ── AGY AI Worker Pool Orchestration ──────────────────────────────────────────
analyst.ml.url=${ANALYST_ML_URL:http://igaming-ml-inference.igaming-analytics.svc.cluster.local:8085}
analyst.dataset.export-dir=${ANALYST_DATASET_EXPORT_DIR:/data/cold-storage/sofascore/cache}
# ── ClickHouse DDS Integration (Polymorphic Tactical Feature Engine) ───────────
analyst.clickhouse.url=${ANALYST_CLICKHOUSE_URL:http://clickhouse.igaming-analytics.svc.cluster.local:8123}
analyst.clickhouse.database=${ANALYST_CLICKHOUSE_DATABASE:igaming_dds}
analyst.clickhouse.user=${ANALYST_CLICKHOUSE_USER:default}
analyst.clickhouse.password=${ANALYST_CLICKHOUSE_PASSWORD:clickhouse}
analyst.clickhouse.timeout-seconds=${ANALYST_CLICKHOUSE_TIMEOUT_SECONDS:3}

# ── Scheduling & Automation (Targeting 400+ matches/24h across all sports) ────
spring.task.scheduling.pool.size=4
analyst.scheduling.scan-enabled=${ANALYST_SCAN_ENABLED:true}
analyst.scheduling.settle-cron=${ANALYST_SETTLE_CRON:0 */2 * * * *}
analyst.scheduling.scan-cron=${ANALYST_SCAN_CRON:0 * * * * *}
analyst.scheduling.batch-size=${ANALYST_BATCH_SIZE:100}
analyst.scheduling.target-minutes-before-start=40
analyst.scheduling.backfill-enabled=${ANALYST_BACKFILL_ENABLED:true}
analyst.scheduling.backfill-batch-size=${ANALYST_BACKFILL_BATCH_SIZE:50}
analyst.scheduling.backfill-delay-ms=${ANALYST_BACKFILL_DELAY_MS:5000}

# ── Actuator Probes ───────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ── Web Static Resources Cache-Busting ───────────────────────────────────────
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.max-age=0

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.pro.datawiki.igaming.analyst=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# ── Kafka Configuration (Reactive Settlement & Lineup Streams) ───────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.igaming-master.svc.cluster.local:9092}
spring.kafka.consumer.group-id=ai-analyst-reactive-settlement-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=pro.datawiki.igaming.dto.live.CanonicalLiveScoreDto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
app.kafka.topics.canonical-scores=${KAFKA_TOPIC_CANONICAL_SCORES:sports.canonical.scores}

# ── Kafka Producer (Anomaly & Error Reporting) ──────────────────────────────
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.topics.anomaly-errors=${KAFKA_TOPIC_ANOMALY_ERRORS:mdm.anomaly.errors}
