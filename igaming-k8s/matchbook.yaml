apiVersion: v1
kind: Service
metadata:
  name: igaming-source-matchbook
  namespace: igaming-source
  labels:
    app: igaming-source-matchbook
spec:
  selector:
    app: igaming-source-matchbook
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-matchbook
  namespace: igaming-source
  labels:
    app: igaming-source-matchbook
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-matchbook
  template:
    metadata:
      labels:
        app: igaming-source-matchbook
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-matchbook
        image: 100.78.183.101:30500/igaming-source-matchbook:latest
        imagePullPolicy: Always
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:matchbook;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_DATASOURCE_USERNAME
          value: "sa"
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.h2.Driver"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.H2Dialect"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: APP_ROLE
          value: "unified"
        - name: HTTP_PROXY_ENABLED
          value: "true"
        - name: MATCHBOOK_PROXY_ENABLED
          value: "true"
        - name: MATCHBOOK_PROXY_HOST
          value: "purevpn-uk.proxy.svc.cluster.local"
        - name: MATCHBOOK_PROXY_PORT
          value: "3128"
        - name: MATCHBOOK_API_URL
          value: "https://api.matchbook.com/edge/rest"
        - name: APP_BOOKMAKER_NAME
          value: "matchbook"
        - name: APP_BOOKMAKER_REGIONS
          value: "GB,EU,GLOBAL"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: JAVA_OPTS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -Dhttp.proxyHost=purevpn-uk.proxy.svc.cluster.local -Dhttp.proxyPort=3128 -Dhttps.proxyHost=purevpn-uk.proxy.svc.cluster.local -Dhttps.proxyPort=3128"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
