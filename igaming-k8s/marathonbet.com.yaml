        - name: APP_MENU_PREMATCH_URL
          value: https://www.marathonbet.com/su/react/event/menu/prematch
        - name: APP_MENU_LIVE_URL
          value: https://www.marathonbet.com/su/react/event/menu/live
        - name: APP_BETTING_BASE_URL
          value: https://www.marathonbet.com/su/betting
        - name: APP_LIVE_UPDATE_URL
          value: https://lu.marathonbet.com/su/liveupdate
