apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betandyou-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betandyou-crawler
  ports:
  - protocol: TCP
    port: 3053
    targetPort: 3053
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betandyou-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betandyou-crawler
  template:
    metadata:
      labels:
        app: igaming-source-betandyou-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      initContainers:
      - name: db-schema-check
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          echo "🔍 Checking database schema readiness..."
          HOST="igaming-source-betandyou-db"
          DB="igaming_betandyou"
          USER="postgres"
          export PGPASSWORD="postgres"

          until psql -h "$HOST" -U "$USER" -d postgres -c "SELECT 1;" >/dev/null 2>&1; do
            echo "Waiting for PostgreSQL ($HOST) to accept queries..."
            sleep 2
          done

          EXISTS=$(psql -h "$HOST" -U "$USER" -d "$DB" -tAc "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'match_cache');" 2>/dev/null | tr -d '[:space:]')

          if [ "$EXISTS" = "t" ]; then
            echo "✅ Database tables already exist. Fast-starting application with ddl-auto=none..."
            exit 0
          fi

          echo "⚙️ Fresh database detected! Initializing schema tables..."
          psql -h "$HOST" -U "$USER" -d "$DB" -c "
          CREATE TABLE IF NOT EXISTS match_cache (
              id BIGSERIAL PRIMARY KEY,
              external_id VARCHAR(255) NOT NULL UNIQUE,
              bookmaker VARCHAR(50),
              sport_id INT,
              sport_name VARCHAR(255),
              league_name VARCHAR(255),
              format_info VARCHAR(255),
              team1 VARCHAR(255),
              team2 VARCHAR(255),
              score1 VARCHAR(255),
              score2 VARCHAR(255),
              is_live BOOLEAN DEFAULT FALSE,
              start_time BIGINT,
              potential_end_time BIGINT,
              event_url VARCHAR(1024),
              status VARCHAR(20) DEFAULT 'NEW',
              json_payload TEXT,
              payload_hash VARCHAR(64),
              updated_at TIMESTAMP,
              created_at TIMESTAMP,
              last_changed_at TIMESTAMP,
              external_updated_at BIGINT,
              version INT DEFAULT 0
          );
          CREATE TABLE IF NOT EXISTS league_cache (
              id BIGSERIAL PRIMARY KEY,
              external_id VARCHAR(255) NOT NULL UNIQUE,
              sport_name VARCHAR(255),
              region_name VARCHAR(255),
              league_name VARCHAR(255),
              url VARCHAR(1024),
              status VARCHAR(50),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          CREATE TABLE IF NOT EXISTS sport_cache (
              id BIGSERIAL PRIMARY KEY,
              external_id INT UNIQUE NOT NULL,
              name VARCHAR(255),
              kind VARCHAR(255),
              parent_id INT,
              updated_at TIMESTAMP
          );
          CREATE TABLE IF NOT EXISTS unmapped_bet (
              id BIGSERIAL PRIMARY KEY,
              sport_name VARCHAR(255),
              raw_name VARCHAR(255) NOT NULL,
              group_name VARCHAR(255),
              event_id VARCHAR(255),
              created_at TIMESTAMP
          );
          CREATE INDEX IF NOT EXISTS idx_mc_status_updated ON match_cache(status, updated_at);
          CREATE INDEX IF NOT EXISTS idx_mc_is_live ON match_cache(is_live);
          CREATE INDEX IF NOT EXISTS idx_mc_last_changed ON match_cache(last_changed_at);
          CREATE INDEX IF NOT EXISTS idx_mc_bookmaker ON match_cache(bookmaker);
          CREATE INDEX IF NOT EXISTS idx_mc_sport_live ON match_cache(sport_name, is_live);
          CREATE INDEX IF NOT EXISTS idx_mc_potential_end_time ON match_cache(potential_end_time);
          "
          echo "✅ Database schema initialization completed successfully!"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      - name: wait-for-low-cpu
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          # Calculate a delay based on hostname hash to stagger startup
          delay=$(( $(echo -n "$(hostname)" | cksum | cut -f1 -d' ') % 90 ))
          echo "Staggering startup: sleeping for ${delay} seconds..."
          sleep ${delay}
          echo "Checking node CPU load before starting..."
          while true; do
            # Read /proc/stat twice 1 second apart to calculate CPU usage
            read cpu user1 nice1 system1 idle1 rest1 < /proc/stat
            sleep 1
            read cpu user2 nice2 system2 idle2 rest2 < /proc/stat
            total1=$((user1 + nice1 + system1 + idle1))
            total2=$((user2 + nice2 + system2 + idle2))
            dtotal=$((total2 - total1))
            didle=$((idle2 - idle1))
            if [ $dtotal -eq 0 ]; then
              echo "Could not compute CPU usage, retrying..."
              sleep 5
              continue
            fi
            cpu_pct=$(( (dtotal - didle) * 100 / dtotal ))
            echo "Current node CPU usage: ${cpu_pct}%  (threshold: 90%)"
            if [ "$cpu_pct" -lt 90 ]; then
              echo "CPU usage is below 90%, proceeding with startup."
              exit 0
            fi
            echo "CPU is too high (${cpu_pct}%), waiting 15 seconds..."
            sleep 15
          done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 20m
            memory: 16Mi
      containers:
      - name: igaming-source-betandyou-crawler
        image: ghcr.io/datawikipro/igaming-source-betb2b:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          Xvfb :99 -ac -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          export DISPLAY=:99
          exec java -jar app.jar
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-betandyou
        - name: APP_TARGET_HOST
          value: betandyou.com
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: '3053'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-betandyou-db.igaming-source.svc.cluster.local:5432/igaming_betandyou
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: betandyou
        - name: APP_BOOKMAKER_REGIONS
          value: INT,EU
        - name: APP_BETB2B_LIVE_URL
          value: https://betandyou.com/LiveFeed/Get1xMatchByLeague
        - name: APP_BETB2B_PREMATCH_URL
          value: https://betandyou.com/LineFeed/Get1xMatchByLeague
        - name: APP_BETB2B_PARTNER_ID
          value: '5'
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BETANDYOU_FETCH_INTERVAL_SECONDS
          value: '144'
        - name: APP_BETANDYOU_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '720'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '144000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '720000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3600'
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            -XX:+UseStringDeduplication -XshowSettings:vm
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        ports:
        - containerPort: 3053
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
