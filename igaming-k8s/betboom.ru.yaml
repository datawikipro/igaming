apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betboom-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betboom-crawler
  ports:
  - protocol: TCP
    port: 3037
    targetPort: 3037
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betboom-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betboom-crawler
  template:
    metadata:
      labels:
        app: igaming-source-betboom-crawler
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-betboom-crawler
        image: 100.78.183.101:30500/igaming-source-betboom:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args: ["Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp & sleep 1 && exec java -cp @/app/jib-classpath-file pro.datawiki.igaming.source.betboom.BetboomApplication"]
        ports:
        - containerPort: 3037
        env:
        - name: DISPLAY
          value: ":99"
        - name: SPRING_PROFILES_ACTIVE
          value: dev,unified
        - name: APP_ROLE
          value: unified
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:betboom;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "50"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "5"
        - name: SPRING_THREADS_VIRTUAL_ENABLED
          value: "true"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-dev.svc.cluster.local:9092
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local
        - name: APP_BOOKMAKER_NAME
          value: betboom
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_VPN_FORCE
          value: "false"
        - name: BETBOOM_API_BASE_URL
          value: https://siteapi.betboom.ru/api/site_api/v1/sporthub
        - name: BETBOOM_SPORTS_URL
          value: https://siteapi.betboom.ru/api/site_api/v1/sporthub/tree/get_tree
        - name: BETBOOM_EVENTS_URL
          value: https://siteapi.betboom.ru/api/site_api/v1/sporthub/tree/get_match_details_info
        - name: BETBOOM_WS_URL
          value: wss://ru-ws.sporthub.bet:444/api/tree_ws/v1
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BETBOOM_FETCH_INTERVAL_SECONDS
          value: '144'
        - name: APP_BETBOOM_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '720'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '144000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '720000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3600'
        - name: SERVER_PORT
          value: '3037'
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2048Mi
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3037
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3037
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 6
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3037
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp
          name: tmp
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
