server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-paf

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:igaming_paf}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.sql.init.mode=never

app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

app.bookmaker.name=paf
app.bookmaker.country=FI
app.bookmaker.currency=EUR
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=LIGHT_PHONE
app.bookmaker.accepts-crypto=false
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT
app.bookmaker.regions=GLOBAL,EU,FI,SE,EE,ES

app.target.host=eu.offering-api.kambicdn.com
app.vpn.enabled=false
app.vpn.force=false

paf.api.base-url=${PAF_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}
paf.api.brand=${PAF_API_BRAND:paf}
paf.api.locale=${PAF_API_LOCALE:en_GB}
paf.api.market=${PAF_API_MARKET:GLOBAL}

paf.proxy.enabled=${PAF_PROXY_ENABLED:${KAMBI_PROXY_ENABLED:true}}
paf.proxy.host=${PAF_PROXY_HOST:${KAMBI_PROXY_HOST:de-proxy.proxy.svc.cluster.local}}
paf.proxy.port=${PAF_PROXY_PORT:${KAMBI_PROXY_PORT:3128}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
