apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betrivers
  namespace: igaming-source
  labels:
    app: igaming-source-betrivers
spec:
  selector:
    app: igaming-source-betrivers
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betrivers
  namespace: igaming-source
  labels:
    app: igaming-source-betrivers
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betrivers
  template:
    metadata:
      labels:
        app: igaming-source-betrivers
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-wait
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for igaming-source-betrivers-db..."
          until pg_isready -h igaming-source-betrivers-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            sleep 2
          done
          echo "Database is ready!"
      containers:
      - name: igaming-source-betrivers
        image: 100.78.183.101:30500/igaming-source-stoiximan:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://igaming-source-betrivers-db.igaming-source.svc.cluster.local:5432/igaming_betrivers"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: DB_HOST
          value: "igaming-source-betrivers-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "igaming_betrivers"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: DATABASE_HOST
          value: "igaming-source-betrivers-db"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "igaming_betrivers"
        - name: APP_BOOKMAKER_NAME
          value: "betrivers"
        - name: APP_BOOKMAKER_REGIONS
          value: "US,GLOBAL"
        - name: APP_BOOKMAKER_EVENT_URL_PREFIX
          value: "https://pa.betrivers.com/?page=sportsbook#event/"
        - name: STOIXIMAN_API_BRAND
          value: "rsiuspa"
        - name: STOIXIMAN_API_LOCALE
          value: "en_US"
        - name: STOIXIMAN_API_MARKET
          value: "US-PA"
        - name: KAMBI_API_BRAND
          value: "rsiuspa"
        - name: KAMBI_API_LOCALE
          value: "en_US"
        - name: KAMBI_API_MARKET
          value: "US-PA"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "de-proxy.proxy.svc.cluster.local"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: STOIXIMAN_PROXY_HOST
          value: "de-proxy.proxy.svc.cluster.local"
        - name: STOIXIMAN_PROXY_PORT
          value: "3128"
        - name: APP_TARGET_HOST
          value: "eu.offering-api.kambicdn.com"
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_VPN_FORCE
          value: "false"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: JAVA_OPTS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betrivers-db
  namespace: igaming-source
  labels:
    app: igaming-source-betrivers-db
spec:
  selector:
    app: igaming-source-betrivers-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-betrivers-db
  namespace: igaming-source
  labels:
    app: igaming-source-betrivers-db
spec:
  serviceName: igaming-source-betrivers-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-betrivers-db
  template:
    metadata:
      labels:
        app: igaming-source-betrivers-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_betrivers
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        command:
        - "docker-entrypoint.sh"
        - "postgres"
        - "-c"
        - "synchronous_commit=off"
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
