apiVersion: v1
kind: Service
metadata:
  name: igaming-source-olimpbet-kz-crawler
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-olimpbet-kz-crawler
  ports:
  - protocol: TCP
    port: 3040
    targetPort: 3040
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-olimpbet-kz-crawler
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-olimpbet-kz-crawler
  template:
    metadata:
      labels:
        app: igaming-source-olimpbet-kz-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - igaming-source-olimpbet-kz-db
            topologyKey: kubernetes.io/hostname
      containers:
      - name: igaming-source-olimpbet-kz-crawler
        image: ghcr.io/datawikipro/igaming-source-olimpbet:latest
        imagePullPolicy: Always
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: HEADLESS_STEALTH
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_ROLE
          value: league-crawler
        - name: SERVER_PORT
          value: '3040'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-olimpbet-kz-db.igaming-dev.svc.cluster.local:5432/igaming_olimpbet_kz
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_OLIMPBET_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_OLIMPBET_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '600'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '120000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '600000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3000'
        - name: APP_BOOKMAKER_NAME
          value: olimpbet-kz
        - name: APP_BOOKMAKER_REGIONS
          value: KZ
        - name: APP_TARGET_HOST
          value: olimpbet.kz
        - name: APP_OLIMPBET_LIVE_URL
          value: https://api4.olimpbet.kz/v2/events?page-size=500&live=true
        - name: APP_OLIMPBET_PREMATCH_URL
          value: https://api4.olimpbet.kz/v2/events?page-size=500&live=false
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: APP_VPN_ENABLED
          value: 'false'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
        ports:
        - containerPort: 3040
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
