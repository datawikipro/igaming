apiVersion: v1
kind: Service
metadata:
  name: igaming-source-ballybet
  namespace: igaming-source
  labels:
    app: igaming-source-ballybet
spec:
  selector:
    app: igaming-source-ballybet
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-ballybet
  namespace: igaming-source
  labels:
    app: igaming-source-ballybet
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-ballybet
  template:
    metadata:
      labels:
        app: igaming-source-ballybet
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers: []
      
      containers:
      - name: igaming-source-ballybet
        image: ghcr.io/datawikipro/igaming-source-betrivers:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:ballybet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_DATASOURCE_USERNAME
          value: "sa"
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.h2.Driver"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.H2Dialect"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: SERVER_PORT
          value: "8080"
        - name: APP_BOOKMAKER_NAME
          value: "ballybet"
        - name: DB_HOST
          value: "igaming-source-ballybet-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "ballybet"
        - name: DB_USER
          value: "sa"
        - name: DB_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "us-proxy.proxy.svc.cluster.local"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: KAMBI_API_BRAND
          value: "bbusny"
        - name: KAMBI_API_MARKET
          value: "US-NY"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local"
        - name: JAVA_OPTS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
