spec:
  ports:
  - port: 8086
    targetPort: 8086
  selector:
    app: igaming-syndicate-bots
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-syndicate-bots
  namespace: igaming-api
  labels:
    app: igaming-syndicate-bots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-syndicate-bots
  template:
    metadata:
      labels:
        app: igaming-syndicate-bots
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: syndicate-bots
        image: 100.78.183.101:30500/igaming-syndicate-bots:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: PORTAL_API_URL
          value: http://igaming-portal:80
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75.0
