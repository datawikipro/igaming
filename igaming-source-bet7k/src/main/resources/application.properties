spring.application.name=igaming-source-bet7k
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://igaming-source-bet7k-db.igaming-source.svc.cluster.local:5432/igaming_bet7k}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}
app.bet7k.api-url=${APP_BET7K_API_URL:https://bet7k.com}
app.bet7k.use-proxy=${APP_BET7K_USE_PROXY:true}
app.bet7k.proxy-host=${APP_BET7K_PROXY_HOST:100.83.113.50}
app.bet7k.proxy-port=${APP_BET7K_PROXY_PORT:3128}
app.bet7k.poll-rate-ms=${APP_BET7K_POLL_RATE_MS:10000}
