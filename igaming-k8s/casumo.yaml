apiVersion: v1
kind: Service
metadata:
  name: igaming-source-casumo
  namespace: igaming-source
  labels:
    app: igaming-source-casumo
spec:
  selector:
    app: igaming-source-casumo
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-casumo
  namespace: igaming-source
  labels:
    app: igaming-source-casumo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-casumo
  template:
    metadata:
      labels:
        app: igaming-source-casumo
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-wait
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for igaming-source-casumo-db..."
          until pg_isready -h igaming-source-casumo-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            sleep 2
          done
          echo "Database is ready!"
      containers:
      - name: igaming-source-casumo
        image: ghcr.io/datawikipro/igaming-source-888sport:latest
        imagePullPolicy: Always
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: DB_HOST
          value: "igaming-source-casumo-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "igaming_casumo"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: APP_BOOKMAKER_NAME
          value: "casumo"
        - name: APP_BOOKMAKER_REGIONS
          value: "EU,GLOBAL"
        - name: KAMBI_API_BASE_URL
          value: "https://eu.offering-api.kambicdn.com/offering/v2018"
        - name: KAMBI_API_BRAND
          value: "casumo"
        - name: KAMBI_API_LOCALE
          value: "en_GB"
        - name: KAMBI_API_MARKET
          value: "GB"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "100.83.113.50"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
          value: "5000"
        - name: SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT
          value: "3000"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx512m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 10m
            memory: "192Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-casumo-db
  namespace: igaming-source
  labels:
    app: igaming-source-casumo-db
spec:
  selector:
    app: igaming-source-casumo-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-casumo-db
  namespace: igaming-source
  labels:
    app: igaming-source-casumo-db
spec:
  serviceName: igaming-source-casumo-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-casumo-db
  template:
    metadata:
      labels:
        app: igaming-source-casumo-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: postgres
        image: postgres:15-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_casumo
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 10m
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: data
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
