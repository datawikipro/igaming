apiVersion: v1
kind: Service
metadata:
  name: igaming-source-1xbet-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-1xbet-crawler
  ports:
  - protocol: TCP
    port: 3049
    targetPort: 3049
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-1xbet-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-1xbet-crawler
  template:
    metadata:
      labels:
        app: igaming-source-1xbet-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-schema-check
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          echo "🔍 Checking database schema readiness..."
          HOST="igaming-source-1xbet-db"
          DB="igaming_xbet"
          USER="postgres"
          export PGPASSWORD="postgres"

          MAX_RETRIES=5
          COUNT=0
          until nc -z -v -w 3 "$HOST.igaming-source.svc.cluster.local." 5432 >/dev/null 2>&1 || [ $COUNT -ge $MAX_RETRIES ]; do
            echo "Waiting for PostgreSQL ($HOST) to accept queries..."
            sleep 2
            COUNT=$((COUNT + 1))
          done

          EXISTS=$(psql -h "$HOST.igaming-source.svc.cluster.local." -U "$USER" -d "$DB" -tAc "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'match_cache');" 2>/dev/null | tr -d '[:space:]')

          if [ "$EXISTS" = "t" ]; then
            echo "✅ Database tables already exist. Fast-starting application with ddl-auto=none..."
            exit 0
          fi

          echo "⚙️ Fresh database detected! Initializing schema tables..."
          psql -h "$HOST.igaming-source.svc.cluster.local." -U "$USER" -d "$DB" -c "
          CREATE TABLE IF NOT EXISTS match_cache (
              id BIGSERIAL PRIMARY KEY,
              external_id VARCHAR(255) NOT NULL UNIQUE,
              bookmaker VARCHAR(50),
              sport_id INT,
              sport_name VARCHAR(255),
              league_name VARCHAR(255),
              format_info VARCHAR(255),
              team1 VARCHAR(255),
              team2 VARCHAR(255),
              score1 VARCHAR(255),
              score2 VARCHAR(255),
              is_live BOOLEAN DEFAULT FALSE,
              start_time BIGINT,
              potential_end_time BIGINT,
              event_url VARCHAR(1024),
              status VARCHAR(20) DEFAULT 'NEW',
              json_payload TEXT,
              payload_hash VARCHAR(64),
              updated_at TIMESTAMP,
              created_at TIMESTAMP,
              last_changed_at TIMESTAMP,
              external_updated_at BIGINT,
              version INT DEFAULT 0
          );
          CREATE TABLE IF NOT EXISTS league_cache (
              id BIGSERIAL PRIMARY KEY,
              external_id VARCHAR(255) NOT NULL UNIQUE,
              sport_name VARCHAR(255),
              region_name VARCHAR(255),
              league_name VARCHAR(255),
              url VARCHAR(1024),
              status VARCHAR(50),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          CREATE TABLE IF NOT EXISTS sport_cache (
              id BIGSERIAL PRIMARY KEY,
              external_id INT UNIQUE NOT NULL,
              name VARCHAR(255),
              kind VARCHAR(255),
              parent_id INT,
              updated_at TIMESTAMP
          );
          CREATE TABLE IF NOT EXISTS unmapped_bet (
              id BIGSERIAL PRIMARY KEY,
              sport_name VARCHAR(255),
              raw_name VARCHAR(255) NOT NULL,
              group_name VARCHAR(255),
              event_id VARCHAR(255),
              created_at TIMESTAMP
          );
          CREATE INDEX IF NOT EXISTS idx_mc_status_updated ON match_cache(status, updated_at);
          CREATE INDEX IF NOT EXISTS idx_mc_is_live ON match_cache(is_live);
          CREATE INDEX IF NOT EXISTS idx_mc_last_changed ON match_cache(last_changed_at);
          CREATE INDEX IF NOT EXISTS idx_mc_bookmaker ON match_cache(bookmaker);
          CREATE INDEX IF NOT EXISTS idx_mc_sport_live ON match_cache(sport_name, is_live);
          CREATE INDEX IF NOT EXISTS idx_mc_potential_end_time ON match_cache(potential_end_time);
          "
          echo "✅ Database schema initialization completed successfully!"
        resources:
          requests:
            cpu:  20m
            memory:  256Mi
          limits:
            cpu:  1200m
            memory:  1280Mi
      containers:
      - name: igaming-source-1xbet-crawler
        image: ghcr.io/datawikipro/igaming-source-betb2b:latest
        imagePullPolicy: Always        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-1xbet
        - name: APP_TARGET_HOST
          value: 1xbet.com
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: '3049'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-1xbet-db.igaming-source.svc.cluster.local:5432/igaming_xbet
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_1XBET_FETCH_INTERVAL_SECONDS
          value: '144'
        - name: APP_1XBET_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '720'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '144000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '720000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3600'
        - name: APP_BOOKMAKER_NAME
          value: 1xbet
        - name: APP_BOOKMAKER_REGIONS
          value: INT,EU
        - name: APP_XBET_LIVE_URL
          value: https://1xbet.com/LiveFeed/Get1xMatchByLeague
        - name: APP_XBET_PREMATCH_URL
          value: https://1xbet.com/LineFeed/Get1xMatchByLeague
        - name: APP_XBET_PARTNER_ID
          value: '321'
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            -XX:+UseStringDeduplication -XshowSettings:vm
        resources:
          requests:
            cpu:  20m
            memory:  256Mi
          limits:
            cpu:  1200m
            memory:  1280Mi
        ports:
        - containerPort: 3049
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
