apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betcity-com-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betcity-com-crawler
  ports:
  - protocol: TCP
    port: 3042
    targetPort: 3042
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betcity-com-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betcity-com-crawler
  template:
    metadata:
      labels:
        app: igaming-source-betcity-com-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      containers:
      - name: igaming-source-betcity-com-crawler
        image: ghcr.io/datawikipro/igaming-source-betcity:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_ROLE
          value: league-crawler
        - name: SERVER_PORT
          value: '3042'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-betcity-db.igaming-source.svc.cluster.local:5432/igaming_betcity
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BETCITY_FETCH_INTERVAL_SECONDS
          value: '30'
        - name: APP_BETCITY_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '30000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '120000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '500'
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: betcity-com
        - name: APP_BOOKMAKER_REGIONS
          value: COM
        - name: APP_VPN_ENABLED
          value: 'false'
        - name: APP_TARGET_HOST
          value: ad.betsbc.com
        - name: APP_BETCITY_LIVE_URL
          value: https://ad.betsbc.com/d/on_air/bets?rev=8&add=dep_event&template=1
        - name: APP_BETCITY_PREMATCH_URL
          value: https://ad.betsbc.com/d/off/events?rev=6
        - name: APP_BETCITY_EVENT_URL_TEMPLATE
          value: https://betcity.com/ru/line/bets?id=%s
        resources:
          requests:
            cpu:  20m
            memory:  256Mi
          limits:
            cpu:  1200m
            memory:  1280Mi
        ports:
        - containerPort: 3042---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betcity-com-loader
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betcity-com-loader
  ports:
  - protocol: TCP
    port: 3042
    targetPort: 3042
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betcity-com-loader
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betcity-com-loader
  template:
    metadata:
      labels:
        app: igaming-source-betcity-com-loader
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      containers:
      - name: igaming-source-betcity-com-loader
        image: ghcr.io/datawikipro/igaming-source-betcity:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_ROLE
          value: match-loader
        - name: SERVER_PORT
          value: '3042'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-betcity-db.igaming-source.svc.cluster.local:5432/igaming_betcity
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BETCITY_FETCH_INTERVAL_SECONDS
          value: '30'
        - name: APP_BETCITY_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '30000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '120000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '500'
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: betcity-com
        - name: APP_BOOKMAKER_REGIONS
          value: COM
        - name: APP_VPN_ENABLED
          value: 'false'
        - name: APP_TARGET_HOST
          value: ad.betsbc.com
        - name: APP_BETCITY_LIVE_URL
          value: https://ad.betsbc.com/d/on_air/bets?rev=8&add=dep_event&template=1
        - name: APP_BETCITY_PREMATCH_URL
          value: https://ad.betsbc.com/d/off/events?rev=6
        - name: APP_BETCITY_EVENT_URL_TEMPLATE
          value: https://betcity.com/ru/line/bets?id=%s
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            -XX:+UseStringDeduplication -XshowSettings:vm
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        ports:
        - containerPort: 3042
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3042
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 120
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3042
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3042
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi

