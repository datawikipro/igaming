# Server port
server.port=${SERVER_PORT}
spring.application.name=${SPRING_APPLICATION_NAME:igaming-source-betb2b}
app.target.host=${APP_TARGET_HOST:}

# Bookmaker Identifier
app.bookmaker.name=${APP_BOOKMAKER_NAME}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS}

# Aggregator
app.aggregator.url=${APP_AGGREGATOR_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Betb2b Family Feed JSON API URLs
# Supports both APP_BETB2B_* (new) and APP_XBET_* (legacy) environment variable names for backward compat
app.betb2b.live-url=${APP_BETB2B_LIVE_URL:${APP_XBET_LIVE_URL:https://1xbet.com/LiveFeed/Get1xMatchByLeague?sports=1}}
app.betb2b.prematch-url=${APP_BETB2B_PREMATCH_URL:${APP_XBET_PREMATCH_URL:https://1xbet.com/LineFeed/Get1xMatchByLeague?sports=1}}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
