spring.application.name=igaming-source-betdaq
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-betdaq-db}:${DB_PORT:5432}/${DB_NAME:igaming_betdaq}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

app.betdaq.base-url=${BETDAQ_BASE_URL:https://api.betdaq.com/v2.0}
app.betdaq.use-proxy=${BETDAQ_USE_PROXY:true}
app.betdaq.proxy-host=${BETDAQ_PROXY_HOST:100.83.113.50}
app.betdaq.proxy-port=${BETDAQ_PROXY_PORT:3128}
app.betdaq.fetch-interval-ms=${BETDAQ_FETCH_INTERVAL_MS:30000}
app.betdaq.commission-rate=${BETDAQ_COMMISSION_RATE:0.02}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
app.bookmaker.name=betdaq
app.bookmaker.country=GB
app.bookmaker.currency=GBP
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=EXCHANGE,CASH_OUT,VIP_HIGH_LIMIT
app.bookmaker.regions=GB,EU,INT
