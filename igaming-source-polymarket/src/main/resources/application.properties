spring.application.name=igaming-source-polymarket
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-polymarket-db}:${DB_PORT:5432}/${DB_NAME:igaming_polymarket}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

app.polymarket.base-url=${POLYMARKET_BASE_URL:https://gamma-api.polymarket.com}
app.polymarket.use-proxy=${POLYMARKET_USE_PROXY:true}
app.polymarket.proxy-host=${POLYMARKET_PROXY_HOST:100.83.113.50}
app.polymarket.proxy-port=${POLYMARKET_PROXY_PORT:3128}
app.polymarket.fetch-interval-ms=${POLYMARKET_FETCH_INTERVAL_MS:30000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
