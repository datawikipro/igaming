spring.application.name=igaming-source-bcgame
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-bcgame-db.igaming-source.svc.cluster.local}:${DB_PORT:5432}/${DB_NAME:igaming_bcgame}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}

app.bcgame.base-url=${BCGAME_BASE_URL:https://bc.game/api/sports}
app.bcgame.use-proxy=${BCGAME_USE_PROXY:true}
app.bcgame.proxy-host=${BCGAME_PROXY_HOST:100.83.113.50}
app.bcgame.proxy-port=${BCGAME_PROXY_PORT:3128}
app.bcgame.connect-timeout=5000
app.bcgame.read-timeout=10000
app.bcgame.fetch-interval-ms=${BCGAME_FETCH_INTERVAL_MS:30000}
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

app.bookmaker.name=bcgame
app.bookmaker.family=crypto
app.bookmaker.country=INT
app.bookmaker.currency=USD
app.bookmaker.legal-status=CRYPTO_NO_KYC
app.bookmaker.kyc-level=NO_KYC
app.bookmaker.accepts-crypto=true
app.bookmaker.features=CRYPTO,FAST_PAYOUT,VIP_HIGH_LIMIT
app.bookmaker.regions=INT,GLOBAL
