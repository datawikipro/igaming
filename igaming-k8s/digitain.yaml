apiVersion: v1
kind: Service
metadata:
  name: igaming-source-digitain-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-digitain-crawler
  ports:
  - protocol: TCP
    port: 3043
    targetPort: 3043
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-digitain-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-digitain-crawler
  template:
    metadata:
      labels:
        app: igaming-source-digitain-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-schema-check
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          HOST="igaming-source-digitain-db"
          USER="postgres"
          export PGPASSWORD="postgres"
          echo "⏳ Waiting for PostgreSQL ($HOST) to accept connections..."
          until pg_isready -h "$HOST.igaming-source.svc.cluster.local." -p 5432 -U "$USER" >/dev/null 2>&1; do
            sleep 1
          done
          echo "✅ PostgreSQL ($HOST) is ready! Handing over schema management to Java AutoMigrate."
      containers:
      - name: igaming-source-digitain-crawler
        image: ghcr.io/datawikipro/igaming-source-digitain:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-digitain-db.igaming-source.svc.cluster.local:5432/igaming_digitain
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BALTBET_FETCH_INTERVAL_SECONDS
          value: '144'
        - name: APP_BALTBET_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '720'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '144000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '720000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3600'
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SERVER_PORT
          value: '3043'
        resources:
          requests:
            cpu:  10m
            memory:  256Mi
          limits:
            cpu:  1200m
            memory:  2048Mi
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp
          name: tmp
        ports:
        - containerPort: 3043
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi

---
