apiVersion: v1
kind: Service
metadata:
  name: igaming-source-zenit-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-zenit-crawler
  ports:
  - protocol: TCP
    port: 3044
    targetPort: 3044
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-zenit-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-zenit-crawler
  template:
    metadata:
      labels:
        app: igaming-source-zenit-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-zenit-crawler
        image: 100.78.183.101:30500/igaming-source-zenit:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: APP_BOOKMAKER_NAME
          value: zenit
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_ZENIT_LIVE_URL
          value: https://zenit.win/ajax/live/printer/ranked/0?onlyview=0&lang_id=1&timezone=3
        - name: APP_ZENIT_PREMATCH_URL
          value: https://zenit.win/ajax/line/printer/react?all=1&onlyview=0&timeline=0&tournaments_mode=0&sport=&league=&games=&ross=0&lang_id=1&timezone=3&offset=0&show_from_main=0&length=1000&sort_mode=2
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:zenit;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "2"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_ZENIT_FETCH_INTERVAL_SECONDS
          value: "15"
        - name: APP_ZENIT_PREMATCH_FETCH_INTERVAL_SECONDS
          value: "45"
        - name: SERVER_PORT
          value: "3044"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC"
        ports:
        - containerPort: 3044
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3044
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3044
          periodSeconds: 15
          failureThreshold: 6
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3044
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
