apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-syndicate-bots
  namespace: igaming-dev
  labels:
    app: igaming-syndicate-bots
    tier: bots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-syndicate-bots
  template:
    metadata:
      labels:
        app: igaming-syndicate-bots
        tier: bots
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: syndicate-bots
          image: 100.78.183.101:30500/igaming-syndicate-bots:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: PORTAL_API_URL
              value: "http://igaming-portal.igaming-dev.svc.cluster.local:80"
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-syndicate-bots
  namespace: igaming-dev
  labels:
    app: igaming-syndicate-bots
spec:
  ports:
    - port: 8086
      targetPort: 8086
      name: http
  selector:
    app: igaming-syndicate-bots
