apiVersion: v1
kind: Service
metadata:
  name: igaming-source-stoiximan
  namespace: igaming-source
  labels:
    app: igaming-source-stoiximan
spec:
  selector:
    app: igaming-source-stoiximan
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-stoiximan
  namespace: igaming-source
  labels:
    app: igaming-source-stoiximan
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-stoiximan
  template:
    metadata:
      labels:
        app: igaming-source-stoiximan
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-wait
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for igaming-source-stoiximan-db..."
          until pg_isready -h igaming-source-stoiximan-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            sleep 2
          done
          echo "Database is ready!"
      containers:
      - name: igaming-source-stoiximan
        image: 100.78.183.101:30500/igaming-source-stoiximan:latest
        imagePullPolicy: Always
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-stoiximan-db.igaming-source.svc.cluster.local:5432/igaming_stoiximan
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: APP_BOOKMAKER_NAME
          value: stoiximan
        - name: APP_VPN_FORCE
          value: "true"
        - name: APP_IS_OFFSHORE
          value: "true"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: proxy-us.service-proxy.svc.cluster.local
        - name: KAMBI_PROXY_PORT
          value: "31292"
        - name: KAMBI_API_BRAND
          value: kambi
        - name: KAMBI_API_LOCALE
          value: en_GB
        - name: KAMBI_API_MARKET
          value: GLOBAL
        - name: STOIXIMAN_PROXY_HOST
          value: proxy-us.service-proxy.svc.cluster.local
        - name: STOIXIMAN_PROXY_PORT
          value: "31292"
        - name: STOIXIMAN_API_BASE_URL
          value: https://eu.offering-api.kambicdn.com/offering/v2018
        - name: STOIXIMAN_API_BRAND
          value: kambi
        - name: STOIXIMAN_API_LOCALE
          value: en_GB
        - name: STOIXIMAN_API_MARKET
          value: GLOBAL
        - name: STOIXIMAN_FETCH_DELAY
          value: "15000"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: JAVA_OPTS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
          failureThreshold: 10
          timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-stoiximan-db
  namespace: igaming-source
  labels:
    app: igaming-source-stoiximan-db
spec:
  selector:
    app: igaming-source-stoiximan-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-stoiximan-db
  namespace: igaming-source
  labels:
    app: igaming-source-stoiximan-db
spec:
  serviceName: igaming-source-stoiximan-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-stoiximan-db
  template:
    metadata:
      labels:
        app: igaming-source-stoiximan-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_stoiximan
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        command:
        - "docker-entrypoint.sh"
        - "postgres"
        - "-c"
        - "synchronous_commit=off"
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
