# Server port
server.port=${SERVER_PORT:3040}
spring.application.name=igaming-source-sbobet

# Bookmaker config
app.bookmaker.name=${APP_BOOKMAKER_NAME:sbobet}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS:${APP_BOOKMAKER_REGION:international}}
app.target.host=${APP_TARGET_HOST:www.sbobet.com}

# Sbobet API
sbobet.api.base-url=${SBOBET_API_BASE_URL:https://www.sbobet.com}
sbobet.api.odds-url=${SBOBET_API_BASE_URL:https://www.sbobet.com}/web-root/delivery/odds
sbobet.fetch.delay-ms=60000

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Proxy backend
app.proxy.backend.url=${APP_PROXY_BACKEND_URL:http://service-proxy-backend.service-proxy.svc.cluster.local}
app.vpn.enabled=false
app.browser.pre-visit-keywords=sbobet,delivery/odds

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Asia/Singapore}

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Autonomous AI Agent Verification Stamp
app.ai.verified=true
