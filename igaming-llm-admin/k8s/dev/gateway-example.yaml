apiVersion: v1
kind: Service
metadata:
  name: igaming-llm-gateway-key1
  namespace: igaming-llm
  labels:
    app: igaming-llm-gateway-key1
spec:
  ports:
  - port: 80
    targetPort: 3040
    name: http
  selector:
    app: igaming-llm-gateway-key1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-llm-gateway-key1
  namespace: igaming-llm
  labels:
    app: igaming-llm-gateway-key1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-llm-gateway-key1
  template:
    metadata:
      labels:
        app: igaming-llm-gateway-key1
    spec:
      imagePullSecrets:
      - name: regcred
      nodeSelector:
        node-type: master
      containers:
      - name: gateway-runner
        image: ghcr.io/datawikipro/igaming-llm-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3040
        env:
        - name: LLM_ADMIN_URL
          value: "http://igaming-llm-admin:80"
        - name: LLM_DYNAMIC_LEASE_ENABLED
          value: "true"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GOOGLE_CLOUD_PROJECT
          value: "project-ec074516-4738-4d28-ad5"
        - name: GOOGLE_CLOUD_LOCATION
          value: "europe-north1"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 3040
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 3040
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
