apiVersion: v1
kind: Service
metadata:
  name: auth-inbox-gateway
  namespace: igaming-dev
  labels:
    app: auth-inbox-gateway
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: auth-inbox-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-inbox-gateway
  namespace: igaming-dev
  labels:
    app: auth-inbox-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-inbox-gateway
  template:
    metadata:
      labels:
        app: auth-inbox-gateway
    spec:
      containers:
      - name: auth-inbox-gateway
        image: 100.78.183.101:30500/auth-inbox-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
      nodeSelector:
        node-type: standard
