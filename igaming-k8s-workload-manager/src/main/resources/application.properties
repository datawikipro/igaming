server.port=3042

# ============================================================
# Spring Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================================
# HikariCP / JPA (неблокирующий старт)
# ============================================================
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ============================================================
# Aggregator delay endpoint
# ============================================================
aggregator.delay.url=http://igaming-aggregator/api/diagnostics/loader-delays

# ============================================================
# EndpointHealthWatcherService — URL для health-check эндпоинтов
# ============================================================

# Airflow 3 API Server:
#   ИСПРАВЛЕНО: путь изменён с /health (Airflow 2.x) на /api/v2/monitor/health (Airflow 3)
health.watcher.airflow-api.url=http://airflow-api-server.accounts/api/v2/monitor/health

# LLM Admin (Spring Boot Actuator):
#   ИСПРАВЛЕНО: путь изменён с / (корень, возвращал HTML) на /actuator/health
health.watcher.llm-admin.url=http://llm-admin.accounts/actuator/health

# Data Catalog Backend (Spring Boot Actuator):
#   ИСПРАВЛЕНО: стандартный Spring Actuator endpoint
health.watcher.data-catalog.url=http://data-catalog-backend.accounts/actuator/health

# Настройки поведения вотчера
# Количество последовательных неудач до инициирования rolling-restart
health.watcher.failures-before-restart=30
# Кулдаун между перезапусками одного сервиса (секунды)
health.watcher.restart-cooldown-seconds=600
# Интервал между плановыми проверками (мс)
health.watcher.check-interval-ms=60000
# Неймспейс K8s с мониторируемыми сервисами
health.watcher.namespace=accounts
# Разрешить ли автоматический rolling-restart (false = только наблюдение)
health.watcher.auto-restart-enabled=false

# ============================================================
# Pending pod watcher
# ============================================================
pending-pod.threshold-minutes=10
pending-pod.cooldown-minutes=15
