apiVersion: v1
kind: Service
metadata:
  name: igaming-source-grosvenor
  namespace: igaming-source
  labels:
    app: igaming-source-grosvenor
spec:
  selector:
    app: igaming-source-grosvenor
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-grosvenor
  namespace: igaming-source
  labels:
    app: igaming-source-grosvenor
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-grosvenor
  template:
    metadata:
      labels:
        app: igaming-source-grosvenor
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers: []
      
      containers:
      - name: igaming-source-grosvenor
        image: ghcr.io/datawikipro/igaming-source-888sport:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:h2:mem:grosvenor;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE"
        - name: SPRING_DATASOURCE_USERNAME
          value: "sa"
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: "org.h2.Driver"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.H2Dialect"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: SERVER_PORT
          value: "8080"
        - name: DB_HOST
          value: "igaming-source-grosvenor-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "igaming_grosvenor"
        - name: DB_USER
          value: "sa"
        - name: DB_PASSWORD
          value: ""
        - name: APP_BOOKMAKER_NAME
          value: "grosvenor"
        - name: APP_BOOKMAKER_REGIONS
          value: "EU,GLOBAL"
        - name: KAMBI_API_BASE_URL
          value: "https://eu.offering-api.kambicdn.com/offering/v2018"
        - name: KAMBI_API_BRAND
          value: "grosvenor"
        - name: KAMBI_API_LOCALE
          value: "en_GB"
        - name: KAMBI_API_MARKET
          value: "GB"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "de-proxy.proxy.svc.cluster.local"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
          value: "5000"
        - name: SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT
          value: "3000"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx512m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 10m
            memory: "192Mi"
          limits:
            cpu: 1000m
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
