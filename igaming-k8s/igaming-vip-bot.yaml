# ============================================================
# igaming-vip-bot — Dedicated pod for @SmartBetVipBot
# VIP Telegram community bot for SmartBet.guru
# Namespace: igaming-dev
# ============================================================
---
# ── PostgreSQL for VIP bot ───────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-vip-bot-db
  namespace: igaming-dev
  labels:
    app: igaming-vip-bot-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-vip-bot-db
  template:
    metadata:
      labels:
        app: igaming-vip-bot-db
        tier: database
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "igaming_vip"
            - name: POSTGRES_USER
              value: "igaming"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: igaming-vip-bot-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - postgres
            - -c
            - synchronous_commit=off
          volumeMounts:
            - name: vip-db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - igaming
                - -d
                - igaming_vip
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: vip-db-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-vip-bot-db
  namespace: igaming-dev
  labels:
    app: igaming-vip-bot-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: igaming-vip-bot-db
---
# ── VIP Bot Application ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-vip-bot
  namespace: igaming-dev
  labels:
    app: igaming-vip-bot
    tier: bots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-vip-bot
  template:
    metadata:
      labels:
        app: igaming-vip-bot
        tier: bots
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        # Wait for PostgreSQL to be ready before starting the app
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z igaming-vip-bot-db 5432; do
                echo "Waiting for igaming-vip-bot-db:5432..."
                sleep 2
              done
              echo "DB is ready."
      containers:
        - name: vip-bot
          image: 100.78.183.101:30500/igaming-vip-bot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
              name: http
          env:
            - name: DB_HOST
              value: "igaming-vip-bot-db"
            - name: DB_NAME
              value: "igaming_vip"
            - name: DB_USER
              value: "igaming"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: igaming-vip-bot-secrets
                  key: db-password
            - name: VIP_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: igaming-vip-bot-secrets
                  key: bot-token
            - name: VIP_BOT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: igaming-vip-bot-secrets
                  key: webhook-secret
            - name: VIP_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: igaming-vip-bot-secrets
                  key: channel-id
            - name: VIP_PORTAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: igaming-vip-bot-secrets
                  key: portal-service-token
                  optional: true
            - name: PORTAL_API_URL
              value: "http://igaming-portal.igaming-dev.svc.cluster.local:80"
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-vip-bot
  namespace: igaming-dev
  labels:
    app: igaming-vip-bot
spec:
  ports:
    - port: 8087
      targetPort: 8087
      name: http
  selector:
    app: igaming-vip-bot
---
# ── Secret Template (create with kubectl) ───────────────────
# kubectl create secret generic igaming-vip-bot-secrets \
#   --namespace igaming-dev \
#   --from-literal=db-password='<DB_PASSWORD>' \
#   --from-literal=bot-token='<SMARTBETVIPBOT_TOKEN>' \
#   --from-literal=webhook-secret='<RANDOM_SECRET>' \
#   --from-literal=channel-id='<VIP_CHANNEL_ID>' \
#   --from-literal=portal-service-token=''
# ─────────────────────────────────────────────────────────────
