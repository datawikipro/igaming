apiVersion: v1
kind: Service
metadata:
  name: igaming-source-tennisi-json
  namespace: igaming-source
  labels:
    app: igaming-source-tennisi-json
spec:
  selector:
    app: igaming-source-tennisi-json
  ports:
  - protocol: TCP
    port: 3047
    targetPort: 3047
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-tennisi-json
  namespace: igaming-source
  labels:
    app: igaming-source-tennisi-json
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-tennisi-json
  template:
    metadata:
      labels:
        app: igaming-source-tennisi-json
    spec:
      priorityClassName: prod-critical
      imagePullSecrets:
      - name: regcred
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-tennisi-json
        image: 127.0.0.1:30500/igaming-source-tennisi:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3047
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: "3047"
        - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BEANS
          value: WARN
        - name: APP_BOOKMAKER_NAME
          value: tennisi
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_ROLE
          value: league-crawler
        - name: APP_TARGET_HOST
          value: tennisi.bet
        - name: APP_TENNISI_API_URL
          value: https://tennisi.bet/mtg2/cgi/!mob_api
        - name: APP_TENNISI_FETCH_INTERVAL_SECONDS
          value: "60"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:tennisi;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "2"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "1"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-master.svc.cluster.local:9092
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-master.svc.cluster.local:9092
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_PROXY_DIRECT
          value: "true"
        - name: APP_VPN_FORCE
          value: "false"
        - name: JAVA_TOOL_OPTIONS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3047
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3047
            scheme: HTTP
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3047
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
