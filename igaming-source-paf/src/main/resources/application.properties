server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-paf

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DATABASE_HOST:${DB_HOST:localhost}}:${DATABASE_PORT:${DB_PORT:5432}}/${DATABASE_NAME:${DB_NAME:igaming_paf}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP & Hibernate configuration (Non-blocking Golden Rule #4 AGENTS.md)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${APP_AGGREGATOR_URL:${AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}}

# Bookmaker identity
app.bookmaker.name=${APP_BOOKMAKER_NAME:paf}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS:GLOBAL,EU,FI,SE,EE,ES}

# Paf / Kambi API Configuration
paf.api.base-url=${PAF_API_BASE_URL:${KAMBI_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}}
paf.api.brand=${KAMBI_API_BRAND:${PAF_API_BRAND:paf}}
paf.api.locale=${KAMBI_API_LOCALE:${PAF_API_LOCALE:fi_FI}}
paf.api.market=${KAMBI_API_MARKET:${PAF_API_MARKET:FI}}

# Proxy Configuration (Cluster proxy 100.83.113.50:3128)
paf.proxy.enabled=${PAF_PROXY_ENABLED:${KAMBI_PROXY_ENABLED:true}}
paf.proxy.host=${PAF_PROXY_HOST:${KAMBI_PROXY_HOST:100.83.113.50}}
paf.proxy.port=${PAF_PROXY_PORT:${KAMBI_PROXY_PORT:3128}}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

spring.main.allow-circular-references=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:fi-FI}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:fi-FI,fi;q=0.9,en;q=0.8}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/Helsinki}
