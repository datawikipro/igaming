apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-capture-sofascore
  namespace: igaming-dev
  labels:
    app: igaming-capture-sofascore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-capture-sofascore
  template:
    metadata:
      labels:
        app: igaming-capture-sofascore
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: igaming-capture-sofascore
        image: 100.78.183.101:30500/igaming-capture-sofascore:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3041
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator-api.igaming-dev.svc.cluster.local:8080
        - name: APP_CAPTURE_ENABLED
          value: "true"
        - name: APP_CAPTURE_FIXED_DELAY
          value: "120000"
        - name: DATABASE_HOST
          value: igaming-aggregator-db
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: SOFASCORE_PROXY_ENABLED
          value: "true"
        - name: SOFASCORE_PROXY_HOST
          value: cluster-switch-proxy.proxy
        - name: SOFASCORE_PROXY_PORT
          value: "3128"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3041
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3041
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3041
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-capture-sofascore
  namespace: igaming-dev
  labels:
    app: igaming-capture-sofascore
spec:
  ports:
  - name: http
    port: 80
    targetPort: 3041
  selector:
    app: igaming-capture-sofascore
  type: ClusterIP
