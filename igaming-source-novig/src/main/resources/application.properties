spring.application.name=igaming-source-novig
server.port=8080

# Golden Rule #2: K8s DNS Service Name ONLY
spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-novig-db}:${DB_PORT:5432}/${DB_NAME:novig}
spring.datasource.username=${DB_USER:novig}
spring.datasource.password=${DB_PASSWORD:novig}
spring.datasource.driver-class-name=org.postgresql.Driver

# Golden Rule #4: Non-blocking HikariCP / JPA
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator & Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Novig Exchange GraphQL Configuration
novig.api.graphql-url=${NOVIG_GRAPHQL_URL:https://api.novig.us/v1/graphql}
novig.api.connect-timeout-seconds=10
novig.api.read-timeout-seconds=25
novig.proxy.enabled=${HTTP_PROXY_ENABLED:true}
novig.proxy.host=${HTTP_PROXY_HOST:100.83.113.50}
novig.proxy.port=${HTTP_PROXY_PORT:3128}

# Polling interval (milliseconds)
novig.scheduler.poll-interval-ms=${POLL_INTERVAL_MS:30000}
