server.port=${SERVER_PORT:3055}

spring.application.name=igaming-source-888sport

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:5432/igaming_888sport}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=888sport
app.bookmaker.regions=EU

# Sport888 / Kambi API Configuration
888sport.api.base-url=${SPORT888_API_BASE_URL:https://eu-offering.api.kambi.com/offering/v2018}
888sport.api.brand=${SPORT888_API_BRAND:ub}
888sport.api.locale=${SPORT888_API_LOCALE:en_GB}
888sport.api.market=${SPORT888_API_MARKET:GB}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/London}
