apiVersion: v1
kind: Service
metadata:
  name: igaming-source-caliente
  namespace: igaming-dev
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: igaming-source-caliente
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-caliente
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-caliente
  template:
    metadata:
      labels:
        app: igaming-source-caliente
    spec:
      containers:
        - name: crawler
          image: ghcr.io/datawikipro/igaming-source-
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "crawler"
            - name: DB_URL
              value: "jdbc:postgresql://igaming-source-caliente-db:5432/igaming_caliente"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: APP_PROXY_BACKEND_URL
              value: "http://service-proxy-backend.service-proxy.svc.cluster.local"
            - name: APP_AGGREGATOR_URL
              value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
            - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
              value: "0"
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
              value: "5000"
            - name: SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT
              value: "3000"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-caliente-db
  namespace: igaming-dev
spec:
  clusterIP: None
  ports:
    - port: 5432
  selector:
    app: igaming-source-caliente-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-caliente-db
  namespace: igaming-dev
spec:
  serviceName: "igaming-source-caliente-db"
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-caliente-db
  template:
    metadata:
      labels:
        app: igaming-source-caliente-db
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: "igaming_caliente"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
          args: ["-c", "synchronous_commit=off"]
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"