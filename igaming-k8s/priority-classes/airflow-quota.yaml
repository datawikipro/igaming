---
# ResourceQuota для Airflow — лимитируем ETL чтобы не вешал сервер
apiVersion: v1
kind: ResourceQuota
metadata:
  name: airflow-quota
  namespace: airflow
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    pods: "50"

---
# LimitRange — дефолтные лимиты для Airflow подов
apiVersion: v1
kind: LimitRange
metadata:
  name: airflow-limits
  namespace: airflow
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    max:
      cpu: "4"
      memory: "8Gi"
