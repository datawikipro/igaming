apiVersion: v1
kind: Service
metadata:
  name: igaming-source-olimpbet-kz-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-olimpbet-kz-crawler
  ports:
  - protocol: TCP
    port: 3040
    targetPort: 3040
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-olimpbet-kz-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-olimpbet-kz-crawler
  template:
    metadata:
      labels:
        app: igaming-source-olimpbet-kz-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      initContainers:
      - name: wait-for-low-cpu
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          # Calculate a delay based on hostname hash to stagger startup
          delay=$(( $(echo -n "$(hostname)" | cksum | cut -f1 -d' ') % 90 ))
          echo "Staggering startup: sleeping for ${delay} seconds..."
          sleep ${delay}
          echo "Checking node CPU load before starting..."
          while true; do
            # Read /proc/stat twice 1 second apart to calculate CPU usage
            read cpu user1 nice1 system1 idle1 rest1 < /proc/stat
            sleep 1
            read cpu user2 nice2 system2 idle2 rest2 < /proc/stat
            total1=$((user1 + nice1 + system1 + idle1))
            total2=$((user2 + nice2 + system2 + idle2))
            dtotal=$((total2 - total1))
            didle=$((idle2 - idle1))
            if [ $dtotal -eq 0 ]; then
              echo "Could not compute CPU usage, retrying..."
              sleep 5
              continue
            fi
            cpu_pct=$(( (dtotal - didle) * 100 / dtotal ))
            echo "Current node CPU usage: ${cpu_pct}%  (threshold: 90%)"
            if [ "$cpu_pct" -lt 90 ]; then
              echo "CPU usage is below 90%, proceeding with startup."
              exit 0
            fi
            echo "CPU is too high (${cpu_pct}%), waiting 15 seconds..."
            sleep 15
          done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 20m
            memory: 16Mi
      containers:
      - name: igaming-source-olimpbet-kz-crawler
        image: ghcr.io/datawikipro/igaming-source-olimpbet:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          Xvfb :99 -ac -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          export DISPLAY=:99
          exec java -jar app.jar
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_ROLE
          value: league-crawler
        - name: SERVER_PORT
          value: '3040'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-olimpbet-kz-db:5432/igaming_olimpbet_kz
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_OLIMPBET_FETCH_INTERVAL_SECONDS
          value: '144'
        - name: APP_OLIMPBET_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '720'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '144000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '720000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3600'
        - name: APP_BOOKMAKER_NAME
          value: olimpbet-kz
        - name: APP_BOOKMAKER_REGIONS
          value: KZ
        - name: APP_TARGET_HOST
          value: olimpbet.kz
        - name: APP_OLIMPBET_LIVE_URL
          value: https://api4.olimpbet.kz/v2/events?page-size=500&live=true
        - name: APP_OLIMPBET_PREMATCH_URL
          value: https://api4.olimpbet.kz/v2/events?page-size=500&live=false
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: APP_VPN_ENABLED
          value: 'false'
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 600m
            memory: 1Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1.5Gi
        ports:
        - containerPort: 3040
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
