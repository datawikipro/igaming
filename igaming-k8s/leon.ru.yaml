apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-leon-db
  namespace: igaming-source
  labels:
    app: igaming-source-leon-db
spec:
  serviceName: igaming-source-leon-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-leon-db
  template:
    metadata:
      labels:
        app: igaming-source-leon-db
    spec:
      nodeSelector:
        node-type: master
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_leon
        - name: POSTGRES_PASSWORD
          value: postgres
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 256Mi
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}


