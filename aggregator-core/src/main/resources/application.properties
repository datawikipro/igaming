# Server Port
server.port=8095

# Application Name
spring.application.name=igaming-mdm-service

# Database Configuration (PostgreSQL Dedicated MDM DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://igaming-mdm-db:5432/igaming_mdm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Non-Blocking Pool Configuration (Rule 3)
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.leak-detection-threshold=60000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=flyway_mdm_schema_history
spring.flyway.locations=classpath:db/migration

# Redis Cache & PubSub
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis.infra.svc.cluster.local}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Kafka Configuration (Error Reporting & Ingestion Events)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.igaming-master.svc.cluster.local:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=mdm-score-consensus-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=pro.datawiki.igaming.dto.live.CanonicalLiveScoreDto
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
app.kafka.topics.canonical-scores=${KAFKA_TOPIC_CANONICAL_SCORES:sports.canonical.scores}
app.kafka.topics.anomaly-errors=mdm.anomaly.errors
app.kafka.topics.mutant-matches=${APP_KAFKA_TOPIC_MUTANT_MATCHES:mdm.match.mutants}

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
