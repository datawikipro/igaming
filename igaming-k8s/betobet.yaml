apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betobet-crawler
  namespace: igaming-source
  labels:
    app: igaming-source-betobet-crawler
spec:
  selector:
    app: igaming-source-betobet-crawler
  ports:
  - protocol: TCP
    port: 3046
    targetPort: 3046
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betobet-crawler
  namespace: igaming-source
  labels:
    app: igaming-source-betobet-crawler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betobet-crawler
  template:
    metadata:
      labels:
        app: igaming-source-betobet-crawler
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-betobet-crawler
        image: 100.78.183.101:30500/igaming-source-betb2b:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3046
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev,unified
        - name: APP_ROLE
          value: unified
        - name: APP_BOOKMAKER_NAME
          value: betobet
        - name: APP_BETB2B_PARTNER_ID
          value: "115"
        - name: APP_BOOKMAKER_REGIONS
          value: "EU,INT"
        - name: APP_TARGET_HOST
          value: "1x-bet.com"
        - name: APP_BETB2B_LIVE_URL
          value: "https://1x-bet.com/LiveFeed/Get1xMatchByLeague"
        - name: APP_BETB2B_PREMATCH_URL
          value: "https://1x-bet.com/LineFeed/Get1xMatchByLeague"
        - name: SERVER_PORT
          value: "3046"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:betobet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "50"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "10"
        - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
          value: "30000"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-master.svc.cluster.local:9092
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.proxy.svc.cluster.local
        - name: APP_PROXY_HOST
          value: purevpn-jp.proxy.svc.cluster.local
        - name: APP_PROXY_PORT
          value: "3128"
        - name: APP_VPN_FORCE
          value: "true"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx512m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3046
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3046
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3046
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
