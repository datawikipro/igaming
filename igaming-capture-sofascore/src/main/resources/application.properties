server.port=3041

# Aggregator connection
app.aggregator.url=http://localhost:3034

# Polling configuration (5 minutes in milliseconds)
app.capture.fixed-delay=300000
app.capture.enabled=true

# National team backfill: push national team metadata to aggregator DB after each fixture sync
app.backfill.national-teams.enabled=true

# Kafka Configuration (Institutional Advanced Metrics Stream)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}
app.kafka.topics.advanced-metrics=sports.canonical.advanced-metrics

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
