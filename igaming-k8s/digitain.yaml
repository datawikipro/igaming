apiVersion: v1
kind: Service
metadata:
  name: igaming-source-digitain-db
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-digitain-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-digitain-db
  namespace: igaming-source
spec:
  serviceName: igaming-source-digitain-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-digitain-db
  template:
    metadata:
      labels:
        app: igaming-source-digitain-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_digitain
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi

