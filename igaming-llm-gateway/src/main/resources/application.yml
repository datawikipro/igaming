server:
  port: 3040
  undertow:
    threads:
      worker: 64
      io: 16

spring:
  application:
    name: igaming-llm-gateway
  mvc:
    async:
      request-timeout: 120000

  datasource:
    url: jdbc:postgresql://${DB_HOST:gateway-postgres}:${DB_PORT:5432}/${DB_NAME:igaming_llm_gateway}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: llm-responses
    caffeine:
      spec: expireAfterWrite=1h,maximumSize=1000

logging:
  level:
    root: INFO
    pro.datawiki.igaming.llm: DEBUG

app:
  llm:
    admin-url: ${LLM_ADMIN_URL:http://igaming-llm-admin.igaming-llm.svc.cluster.local}
