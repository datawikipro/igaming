            text_html = "\n".join(text_lines)

            # Inline Keyboard
            calc_url = f"https://smartbet.guru/tools/freebet-calculator?arb_id={signal.signal_id}&utm_source=telegram&utm_medium=channel_{lang_code}"
            bk1_slug = normalize_bk_slug(signal.bk1)
