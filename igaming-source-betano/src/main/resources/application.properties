spring.application.name=igaming-source-betano
spring.profiles.active=${SPRING_PROFILES_ACTIVE:crawler}

server.port=${SERVER_PORT:8080}

app.bookmaker.name=betano
app.bookmaker.family=kaizen
app.bookmaker.country=BR
app.bookmaker.currency=BRL
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=LIGHT_PHONE
app.bookmaker.accepts-crypto=false
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT
app.bookmaker.regions=BR,PT,RO,DE,GR

# Betano API Configuration
app.betano.base-url=${APP_BETANO_BASE_URL:https://www.betano.de}
app.betano.connect-timeout=10000
app.betano.read-timeout=15000
app.betano.use-proxy=${APP_BETANO_USE_PROXY:true}
app.betano.proxy-host=${APP_BETANO_PROXY_HOST:de-proxy.proxy.svc.cluster.local}
app.betano.proxy-port=${APP_BETANO_PROXY_PORT:3128}

# Aggregator and Proxy URLs
app.proxy.backend.url=${APP_PROXY_BACKEND_URL:http://service-proxy-backend.service-proxy.svc.cluster.local}
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://igaming-source-betano-db:5432/igaming_betano}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP & JPA non-blocking (Mandatory per Golden Rules)
spring.cloud.refresh.enabled=false
# spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Crawler Delays
app.crawler.discovery-delay=${CRAWLER_DISCOVERY_DELAY:120000}
app.crawler.odds-delay=${CRAWLER_ODDS_DELAY:20000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
