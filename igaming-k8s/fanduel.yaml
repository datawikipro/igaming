apiVersion: v1
kind: Service
metadata:
  name: igaming-source-fanduel-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-fanduel-crawler
  ports:
  - protocol: TCP
    port: 3060
    targetPort: 3060
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-fanduel-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-fanduel-crawler
  template:
    metadata:
      labels:
        app: igaming-source-fanduel-crawler
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master

      initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h igaming-source-fanduel-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            echo "Waiting for igaming-source-fanduel-db..."
            sleep 2
          done
      containers:
      - name: igaming-source-fanduel-crawler
        image: 100.78.183.101:30500/igaming-source-fanduel:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3060
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: APP_ROLE
          value: league-crawler
        - name: SERVER_PORT
          value: "3060"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-fanduel-db.igaming-source.svc.cluster.local:5432/igaming_fanduel
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_BOOKMAKER_NAME
          value: fanduel
        - name: APP_BOOKMAKER_REGIONS
          value: US
        - name: APP_TARGET_HOST
          value: sbapi.ny.sportsbook.fanduel.com
        - name: FANDUEL_API_BASE_URL
          value: https://sbapi.ny.sportsbook.fanduel.com
        - name: FANDUEL_API_KEY
          value: FhMFpcPWXMeyZxOx
        - name: FANDUEL_API_SITE_ID
          value: US-SB
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx512m -XX:+UseG1GC -Dhttp.proxyHost=100.83.113.50 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=100.83.113.50 -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\""
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp
          name: tmp
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3060
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3060
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3060
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 3
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: igaming-source-fanduel-db
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-fanduel-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-fanduel-db
  namespace: igaming-source
spec:
  serviceName: igaming-source-fanduel-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-fanduel-db
  template:
    metadata:
      labels:
        app: igaming-source-fanduel-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_fanduel
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
