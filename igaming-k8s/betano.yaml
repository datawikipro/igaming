apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betano
  namespace: igaming-source
  labels:
    app: igaming-source-betano
spec:
  selector:
    app: igaming-source-betano
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betano
  namespace: igaming-source
  labels:
    app: igaming-source-betano
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betano
  template:
    metadata:
      labels:
        app: igaming-source-betano
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h igaming-source-betano-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            echo "Waiting for igaming-source-betano-db..."
            sleep 2
          done
      containers:
      - name: igaming-source-betano
        image: 100.78.183.101:30500/igaming-source-betano:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "crawler"
        - name: PLAYWRIGHT_BROWSERS_PATH
          value: "/ms-playwright"
        - name: APP_BROWSER_STEALTH_PROFILE
          value: "HEADLESS_STEALTH"
        - name: APP_BROWSER_PRE_VISIT_KEYWORDS
          value: "none"
        - name: DB_URL
          value: "jdbc:postgresql://igaming-source-betano-db.igaming-source.svc.cluster.local:5432/igaming_betano"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator-api.igaming-dev.svc.cluster.local:8080"
        - name: APP_PROXY_BACKEND_URL
          value: "http://service-proxy-backend.proxy.svc.cluster.local"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.igaming-master.svc.cluster.local:9092"
        - name: APP_BETANO_BASE_URL
          value: "https://www.betano.de"
        - name: APP_VPN_ENABLED
          value: "true"
        - name: APP_BETANO_USE_PROXY
          value: "true"
        - name: APP_BETANO_PROXY_HOST
          value: "purevpn-uk-direct.proxy.svc.cluster.local"
        - name: APP_BETANO_PROXY_PORT
          value: "3128"
        - name: HTTP_PROXY
          value: "http://purevpn-uk-direct.proxy.svc.cluster.local:3128"
        - name: HTTPS_PROXY
          value: "http://purevpn-uk-direct.proxy.svc.cluster.local:3128"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis.igaming-dev.svc.cluster.local"
        - name: SPRING_CLOUD_REFRESH_ENABLED
          value: "false"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "-1"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx1024m -XX:+UseG1GC -Dhttp.proxyHost=purevpn-uk-direct.proxy.svc.cluster.local -Dhttp.proxyPort=3128 -Dhttps.proxyHost=purevpn-uk-direct.proxy.svc.cluster.local -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.*|10.*|*.cluster.local|*.svc.cluster.local"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 120
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betano-db
  namespace: igaming-source
  labels:
    app: igaming-source-betano-db
spec:
  selector:
    app: igaming-source-betano-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-betano-db
  namespace: igaming-source
  labels:
    app: igaming-source-betano-db
spec:
  serviceName: igaming-source-betano-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-betano-db
  template:
    metadata:
      labels:
        app: igaming-source-betano-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_betano
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 10m
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: data
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
