apiVersion: v1
kind: Service
metadata:
  name: igaming-source-baltbet-crawler
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-baltbet-crawler
  ports:
  - protocol: TCP
    port: 3043
    targetPort: 3043
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-baltbet-crawler
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-baltbet-crawler
  template:
    metadata:
      labels:
        app: igaming-source-baltbet-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-baltbet-crawler
        image: ghcr.io/datawikipro/igaming-source-baltbet:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-baltbet-db:5432/igaming_baltbet
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SERVER_PORT
          value: '3043'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
        ports:
        - containerPort: 3043
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-baltbet-loader
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-baltbet-loader
  ports:
  - protocol: TCP
    port: 3043
    targetPort: 3043
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-baltbet-loader
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-baltbet-loader
  template:
    metadata:
      labels:
        app: igaming-source-baltbet-loader
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: igaming-source-baltbet-loader
        image: ghcr.io/datawikipro/igaming-source-baltbet:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: match-loader
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-baltbet-db:5432/igaming_baltbet
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SERVER_PORT
          value: '3043'
        resources:
          requests:
            cpu: 30m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 1Gi
        ports:
        - containerPort: 3043
        resources:
          requests:
            cpu: 30m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3043
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3043
          initialDelaySeconds: 15
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/info
            port: 3043
          initialDelaySeconds: 15
          periodSeconds: 10
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-baltbet-db
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-baltbet-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-baltbet-db
  namespace: igaming-dev
spec:
  serviceName: igaming-source-baltbet-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-baltbet-db
  template:
    metadata:
      labels:
        app: igaming-source-baltbet-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_baltbet
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}

