spec:
  replicas: 1
  selector:
    matchLabels:
      app: smm-bot-patreon
  template:
    metadata:
      labels:
        app: smm-bot-patreon
        module: smm-patreon-agent
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: smm-bot-patreon
        image: 100.78.183.101:30500/auth-inbox-gateway:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "/app/patreon_agent.py"]
        env:
        - name: ACCOUNT_ID
          value: "patreon_creator"
        - name: REDIS_URL
          value: "redis://igaming-redis:6379/0"
        - name: PATREON_SESSION_KEY
          value: "smm:session:patreon"
        - name: US_PROXY
          value: "http://100.83.113.50:3128"
        - name: PORTAL_API_URL
          value: "http://igaming-portal:80"
        - name: HEALTHCHECK_PORT
          value: "8080"
        - name: PORT
          value: "8080"
        - name: PATREON_WEBHOOK_SECRET
          value: "smartbet_patreon_secret_key"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: novnc-ws
          containerPort: 6080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: code-volume
          mountPath: /app/patreon_agent.py
          subPath: patreon_agent.py
        - name: code-volume
          mountPath: /app/patron_content_distributor.py
          subPath: patron_content_distributor.py
      volumes:
      - name: code-volume
        configMap:
          name: smm-bot-patreon-code
---
apiVersion: v1
kind: Service
metadata:
  name: smm-bot-patreon
  namespace: igaming-dev
  labels:
    app: smm-bot-patreon
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
    protocol: TCP
  selector:
    app: smm-bot-patreon
