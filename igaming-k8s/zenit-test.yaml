apiVersion: v1
kind: Pod
metadata:
  name: igaming-source-zenit-test
  namespace: igaming-dev
  labels:
    app: igaming-source-zenit-test
spec:
  dnsConfig:
    options:
    - name: ndots
      value: "1"
  containers:
  - name: igaming-source-zenit-test
    image: 100.78.183.101:30500/igaming-source-zenit:latest
    imagePullPolicy: Always
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev,match-loader
    - name: APP_ROLE
      value: match-loader
    - name: SERVER_PORT
      value: "3044"
    - name: APP_BOOKMAKER_NAME
      value: zenit
    - name: APP_BOOKMAKER_REGIONS
      value: RU
    - name: APP_ZENIT_LIVE_URL
      value: https://zenit.win/ajax/live/printer/ranked/%d?onlyview=0&lang_id=1&timezone=3
    - name: APP_ZENIT_PREMATCH_URL
      value: https://zenit.win/ajax/line/printer/ranked/%d?onlyview=0&lang_id=1&timezone=3
    - name: SPRING_DATASOURCE_URL
      value: jdbc:postgresql://igaming-source-zenit-db.igaming-source.svc.cluster.local:5432/igaming_zenit
    - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
      value: "false"
    - name: SPRING_JPA_HIBERNATE_DDL_AUTO
      value: update
    - name: SPRING_JPA_DATABASE_PLATFORM
      value: org.hibernate.dialect.PostgreSQLDialect
    - name: SPRING_DATASOURCE_USERNAME
      value: postgres
    - name: SPRING_DATASOURCE_PASSWORD
      value: postgres
    - name: APP_AGGREGATOR_URL
      value: http://igaming-aggregator.igaming-dev.svc.cluster.local
    - name: SPRING_DATA_REDIS_HOST
      value: localhost
    - name: APP_PERSISTENCE_USE_REDIS_FACTORS
      value: 'true'
    - name: APP_PROXY_BACKEND_URL
      value: http://service-proxy-backend.service-proxy.svc.cluster.local
    - name: APP_ZENIT_FETCH_INTERVAL_SECONDS
      value: '60'
    - name: APP_ZENIT_PREMATCH_FETCH_INTERVAL_SECONDS
      value: '90'
    - name: APP_ODDS_REFRESH_LIVE_POLL_MS
      value: '144000'
    - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
      value: '720000'
    - name: APP_MATCH_LOADER_POLL_DELAY_MS
      value: '3600'
    ports:
    - containerPort: 3044
      protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        cpu: 800m
        memory: 768Mi
    startupProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 3044
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 3044
        scheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 5
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 3044
        scheme: HTTP
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 5
      timeoutSeconds: 5
  - name: redis
    image: redis:7-alpine
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 6379
      protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  restartPolicy: Always
