server.port=8085

# File-based H2 Database configuration (will persist data under a local ./data directory)
spring.datasource.url=jdbc:h2:file:./data/overlaydb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA and Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Google OAuth API Settings
google.client.id=${GOOGLE_CLIENT_ID:REDACTED}
google.client.secret=${GOOGLE_CLIENT_SECRET:REDACTED}

# Logging
logging.level.com.antigravity.overlay.service.AgyUsageService=DEBUG
