spring.application.name=igaming-source-betrivers
server.port=8080

app.bookmaker.name=betrivers
app.bookmaker.country=US
app.bookmaker.currency=USD
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT
app.bookmaker.regions=US

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-betrivers-db}:${DB_PORT:5432}/${DB_NAME:igaming_betrivers}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-blocking HikariCP Configuration (Golden Rule #4)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Proxy configuration (US Gateway via ru-proxy)
app.proxy.enabled=${APP_PROXY_ENABLED:true}
app.proxy.host=${APP_PROXY_HOST:100.83.113.50}
app.proxy.port=${APP_PROXY_PORT:3128}

# Kambi Offering API Configuration (BetRivers NY/PA/IL, Bally Bet, etc.)
kambi.api.base-url=${KAMBI_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}
kambi.api.brand=${KAMBI_API_BRAND:rsiusny}
kambi.api.market=${KAMBI_API_MARKET:US-NY}
kambi.api.locale=${KAMBI_API_LOCALE:en_US}

# Schedulers
betrivers.discovery.cron=${BETRIVERS_DISCOVERY_CRON:0 */5 * * * *}
betrivers.loader.cron=${BETRIVERS_LOADER_CRON:*/20 * * * * *}

# Health probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
