  namespace: igaming-source
spec:
  selector:
    app: igaming-source-marathonbet-by
  ports:
  - protocol: TCP
    port: 3038
    targetPort: 3038
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-by-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-marathonbet-by
  ports:
  - protocol: TCP
    port: 3038
    targetPort: 3038
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-by-loader
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-marathonbet-by
  ports:
  - protocol: TCP
    port: 3038
    targetPort: 3038
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-marathonbet-by
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-marathonbet-by
  template:
    metadata:
      labels:
        app: igaming-source-marathonbet-by
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-marathonbet-by
        image: 100.78.183.101:30500/igaming-source-marathonbet:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-marathonbet-by
        - name: APP_ROLE
          value: unified
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler,match-loader,odds-refresher
        - name: SERVER_PORT
          value: '3038'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:marathonbet_by;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "50"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "10"
        - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
          value: "30000"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-master.svc.cluster.local:9092
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_BOOKMAKER_NAME
          value: marathonbet-by
        - name: APP_BOOKMAKER_REGIONS
          value: BY
        - name: APP_BOOKMAKER_URL
          value: http://igaming-source-marathonbet-by-gateway.igaming-source.svc.cluster.local
        - name: APP_TARGET_HOST
          value: igaming-source-marathonbet-by-gateway.igaming-source.svc.cluster.local
        - name: APP_MENU_PREMATCH_URL
          value: http://igaming-source-marathonbet-by-gateway.igaming-source.svc.cluster.local/su/react/event/menu/prematch
        - name: APP_MENU_LIVE_URL
          value: http://igaming-source-marathonbet-by-gateway.igaming-source.svc.cluster.local/su/react/event/menu/live
        - name: APP_BETTING_BASE_URL
          value: http://igaming-source-marathonbet-by-gateway.igaming-source.svc.cluster.local/su/betting
        - name: APP_LIVE_UPDATE_URL
          value: http://igaming-source-marathonbet-by-gateway.igaming-source.svc.cluster.local/su/liveupdate
        - name: MARATHONBET_FETCH_INTERVAL
          value: '144'
        - name: MARATHONBET_PREMATCH_FETCH_INTERVAL
          value: '720'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '144000'
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.proxy.svc.cluster.local
        - name: APP_PROXY_HOST
          value: cluster-switch-proxy.proxy.svc.cluster.local
        - name: APP_PROXY_PORT
          value: "3128"
        - name: APP_VPN_ENABLED
          value: 'false'
        - name: APP_VPN_FORCE
          value: 'false'
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms256m -Xmx768m -XX:+UseG1GC"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx768m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        ports:
        - containerPort: 3038
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3038
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3038
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3038
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: igaming-source-marathonbet-by-gateway-config
  namespace: igaming-source
data:
  nginx.conf: |
    worker_processes 1;
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;

        server {
            listen 80;
            server_name _;

            location / {
                proxy_pass https://marathonbet.by;
                proxy_ssl_name marathonbet.by;
                proxy_ssl_server_name on;
                proxy_ssl_protocols TLSv1.2 TLSv1.3;
                proxy_set_header Host www.marathonbet.by;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_redirect https://www.marathonbet.by/ /;
                proxy_redirect http://www.marathonbet.by/ /;
                proxy_connect_timeout 15s;
                proxy_read_timeout 60s;
                proxy_send_timeout 60s;
                proxy_buffering off;
            }

            location /healthz {
                return 200 "OK\n";
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-marathonbet-by-gateway
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: igaming-source-marathonbet-by-gateway
  template:
    metadata:
      labels:
        app: igaming-source-marathonbet-by-gateway
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
        volumeMounts:
        - name: cfg
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: cfg
        configMap:
          name: igaming-source-marathonbet-by-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-by-gateway
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-marathonbet-by-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
