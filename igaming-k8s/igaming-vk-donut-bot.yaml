# ============================================================
# igaming-vk-donut-bot — Dedicated pod for VK Donut community agent
# VK Donut Callback API handler + donor management for SmartBet.guru
# Namespace: igaming-dev
# ============================================================
---
# ── PostgreSQL for VK Donut bot ──────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-vk-donut-bot-db
  namespace: igaming-dev
  labels:
    app: igaming-vk-donut-bot-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-vk-donut-bot-db
  template:
    metadata:
      labels:
        app: igaming-vk-donut-bot-db
        tier: database
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "igaming_vk_donut"
            - name: POSTGRES_USER
              value: "igaming"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: igaming-vk-donut-bot-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - postgres
            - -c
            - synchronous_commit=off
          volumeMounts:
            - name: vk-donut-db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - igaming
                - -d
                - igaming_vk_donut
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: vk-donut-db-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-vk-donut-bot-db
  namespace: igaming-dev
  labels:
    app: igaming-vk-donut-bot-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: igaming-vk-donut-bot-db
---
# ── VK Donut Bot Application ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-vk-donut-bot
  namespace: igaming-dev
  labels:
    app: igaming-vk-donut-bot
    tier: bots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-vk-donut-bot
  template:
    metadata:
      labels:
        app: igaming-vk-donut-bot
        tier: bots
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        # Wait for PostgreSQL to be ready before starting the app
        # Uses DNS service name per AGENTS.md Rule #2 (no hardcoded IPs)
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z igaming-vk-donut-bot-db 5432; do
                echo "Waiting for igaming-vk-donut-bot-db:5432..."
                sleep 2
              done
              echo "DB is ready."
      containers:
        - name: vk-donut-bot
          image: 100.78.183.101:30500/igaming-vk-donut-bot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: DB_HOST
              value: "igaming-vk-donut-bot-db"
            - name: DB_NAME
              value: "igaming_vk_donut"
            - name: DB_USER
              value: "igaming"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: igaming-vk-donut-bot-secrets
                  key: db-password
            - name: VK_COMMUNITY_ID
              valueFrom:
                secretKeyRef:
                  name: igaming-vk-donut-bot-secrets
                  key: community-id
            - name: VK_COMMUNITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: igaming-vk-donut-bot-secrets
                  key: community-token
            - name: VK_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: igaming-vk-donut-bot-secrets
                  key: callback-secret
            - name: VK_CALLBACK_CONFIRMATION
              valueFrom:
                secretKeyRef:
                  name: igaming-vk-donut-bot-secrets
                  key: callback-confirmation
            - name: PORTAL_API_URL
              value: "http://igaming-portal.igaming-dev.svc.cluster.local:80"
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
            # VK Community autoposter schedule (default: signal=30min, promo=6h)
            - name: VK_PUBLIC_SIGNAL_INTERVAL_MS
              value: "1800000"
            - name: VK_PROMO_DIGEST_INTERVAL_MS
              value: "21600000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-vk-donut-bot
  namespace: igaming-dev
  labels:
    app: igaming-vk-donut-bot
spec:
  ports:
    - port: 8088
      targetPort: 8088
      name: http
  selector:
    app: igaming-vk-donut-bot
---
# ── Secret Template (create with kubectl) ───────────────────
# kubectl create secret generic igaming-vk-donut-bot-secrets \
#   --namespace igaming-dev \
#   --from-literal=db-password='<DB_PASSWORD>' \
#   --from-literal=community-id='<VK_COMMUNITY_ID>' \
#   --from-literal=community-token='<VK_COMMUNITY_TOKEN>' \
#   --from-literal=callback-secret='<VK_CALLBACK_SECRET>' \
#   --from-literal=callback-confirmation='<VK_CONFIRMATION_CODE>'
# ─────────────────────────────────────────────────────────────
