apiVersion: v1
kind: Service
metadata:
  name: igaming-source-svenskaspel
  namespace: igaming-source
  labels:
    app: igaming-source-svenskaspel
spec:
  selector:
    app: igaming-source-svenskaspel
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-svenskaspel
  namespace: igaming-source
  labels:
    app: igaming-source-svenskaspel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-svenskaspel
  template:
    metadata:
      labels:
        app: igaming-source-svenskaspel
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h igaming-source-svenskaspel-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            echo "Waiting for igaming-source-svenskaspel-db..."
            sleep 2
          done
      containers:
      - name: igaming-source-svenskaspel
        image: 100.78.183.101:30500/igaming-source-unibet:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "crawler"
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://igaming-source-svenskaspel-db.igaming-source.svc.cluster.local:5432/igaming_svenskaspel"
        - name: DB_URL
          value: "jdbc:postgresql://igaming-source-svenskaspel-db.igaming-source.svc.cluster.local:5432/igaming_svenskaspel"
        - name: DATABASE_HOST
          value: "igaming-source-svenskaspel-db"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "igaming_svenskaspel"
        - name: DB_HOST
          value: "igaming-source-svenskaspel-db"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "igaming_svenskaspel"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: APP_BOOKMAKER_NAME
          value: "svenskaspel"
        - name: APP_ROLE
          value: "league-crawler"
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.kafka.svc.cluster.local:9092"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: UNIBET_API_BASE_URL
          value: "https://eu.offering-api.kambicdn.com/offering/v2018"
        - name: KAMBI_API_BASE_URL
          value: "https://eu.offering-api.kambicdn.com/offering/v2018"
        - name: KAMBI_PROXY_ENABLED
          value: "true"
        - name: KAMBI_PROXY_HOST
          value: "100.83.113.50"
        - name: KAMBI_PROXY_PORT
          value: "3128"
        - name: KAMBI_API_BRAND
          value: "ub"
        - name: KAMBI_API_LOCALE
          value: "sv_SE"
        - name: KAMBI_API_MARKET
          value: "SE"
        - name: UNIBET_API_BRAND
          value: "ub"
        - name: UNIBET_API_LOCALE
          value: "sv_SE"
        - name: UNIBET_API_MARKET
          value: "SE"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms128m -Xmx512m -XX:+UseG1GC -Dhttp.proxyHost=100.83.113.50 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=100.83.113.50 -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\" -DsocksNonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\""
        resources:
          requests:
            cpu: 10m
            memory: "192Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 45
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-svenskaspel-db
  namespace: igaming-source
  labels:
    app: igaming-source-svenskaspel-db
spec:
  selector:
    app: igaming-source-svenskaspel-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-svenskaspel-db
  namespace: igaming-source
  labels:
    app: igaming-source-svenskaspel-db
spec:
  serviceName: igaming-source-svenskaspel-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-svenskaspel-db
  template:
    metadata:
      labels:
        app: igaming-source-svenskaspel-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_svenskaspel
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 10m
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: data
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
