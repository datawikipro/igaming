apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-aggregator-ingestion
  namespace: igaming-dev
  labels:
    app: igaming-aggregator-ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: igaming-aggregator-ingestion
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: igaming-aggregator-ingestion
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: ingestion
        image: 100.78.183.101:30500/igaming-aggregator-ingestion:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_CONFIG_ADDITIONAL_LOCATION
          value: file:/app/config/
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: "true"
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-aggregator-db:5432/igaming_aggregator
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: DATABASE_HOST
          value: igaming-aggregator-db
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis
        - name: REDIS_HOST
          value: igaming-redis
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: APP_NORMALIZATION_ENABLED
          value: "false"
        - name: APP_KAFKA_CONCURRENCY
          value: "8"
        - name: SPRING_KAFKA_LISTENER_CONCURRENCY
          value: "8"
        - name: HIKARI_MAX_POOL_SIZE
          value: "20"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        volumeMounts:
        - name: ingestion-config
          mountPath: /app/config
      volumes:
      - name: ingestion-config
        configMap:
          name: aggregator-ingestion-config
          defaultMode: 420
