apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-aggregator-normalizer
  namespace: igaming-dev
  labels:
    app: igaming-aggregator-normalizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-aggregator-normalizer
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: igaming-aggregator-normalizer
    spec:
      containers:
      - name: normalizer
        image: 100.78.183.101:30500/aggregator-normalizer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http-actuator
        env:
        - name: SPRING_CONFIG_ADDITIONAL_LOCATION
          value: file:/app/config/
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: "true"
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-aggregator-db:5432/igaming_aggregator
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: DATABASE_HOST
          value: igaming-aggregator-db
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis
        - name: REDIS_HOST
          value: igaming-redis
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: APP_KAFKA_LISTENER_AUTO_STARTUP
          value: "false"
        - name: APP_NORMALIZATION_ENABLED
          value: "true"
        - name: APP_DICTIONARY_SYNC_ENABLED
          value: "true"
        - name: APP_DICTIONARY_SYNC_ON_STARTUP
          value: "true"
        - name: APP_NORMALIZATION_DICTIONARY_SYNC_ENABLED
          value: "true"
        - name: APP_NORMALIZATION_DICTIONARY_SYNC_ON_STARTUP
          value: "true"
        - name: APP_DICTIONARY_SYNC_CRON
          value: "0 */30 * * * *"
        - name: APP_NORMALIZATION_DICTIONARY_SYNC_CRON
          value: "0 */30 * * * *"
        - name: APP_LLM_PARALLEL_THREADS
          value: "2"
        - name: HIKARI_MAX_POOL_SIZE
          value: "5"
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75.0
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 384Mi
        startupProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - name: ingestion-config
          mountPath: /app/config
      volumes:
      - name: ingestion-config
        configMap:
          name: aggregator-ingestion-config
          defaultMode: 420
      nodeSelector:
        node-type: standard
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-aggregator-normalizer
  namespace: igaming-dev
  labels:
    app: igaming-aggregator-normalizer
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http-actuator
  selector:
    app: igaming-aggregator-normalizer
