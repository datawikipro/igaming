apiVersion: v1
kind: Pod
metadata:
  name: igaming-source-betboom-test
  namespace: igaming-dev
  labels:
    app: igaming-source-betboom-test
spec:
  dnsConfig:
    options:
    - name: ndots
      value: "1"
  containers:
  - name: igaming-source-betboom-test
    image: 100.78.183.101:30500/igaming-source-betboom:latest
    imagePullPolicy: Always
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev,match-loader
    - name: APP_ROLE
      value: match-loader
    - name: SERVER_PORT
      value: "3037"
    - name: SPRING_DATASOURCE_URL
      value: jdbc:postgresql://igaming-source-betboom-db.igaming-source.svc.cluster.local:5432/igaming_betboom
    - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
      value: "0"
    - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
      value: "5000"
    - name: SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT
      value: "3000"
    - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
      value: "false"
    - name: SPRING_JPA_HIBERNATE_DDL_AUTO
      value: update
    - name: SPRING_JPA_DATABASE_PLATFORM
      value: org.hibernate.dialect.PostgreSQLDialect
    - name: SPRING_DATASOURCE_USERNAME
      value: postgres
    - name: SPRING_DATASOURCE_PASSWORD
      value: postgres
    - name: APP_AGGREGATOR_URL
      value: http://igaming-aggregator.igaming-dev.svc.cluster.local
    - name: BETBOOM_API_BASE_URL
      value: https://siteapi.betboom.ru/api/site_api/v1/sporthub
    - name: BETBOOM_SPORTS_URL
      value: https://siteapi.betboom.ru/api/site_api/v1/sporthub/tree/get_tree
    - name: BETBOOM_EVENTS_URL
      value: https://siteapi.betboom.ru/api/site_api/v1/sporthub/tree/get_match_details_info
    - name: BETBOOM_WS_URL
      value: wss://ru-ws.sporthub.bet:444/api/tree_ws/v1
    - name: SPRING_DATA_REDIS_HOST
      value: localhost
    - name: APP_PERSISTENCE_USE_REDIS_FACTORS
      value: 'true'
    - name: APP_PROXY_BACKEND_URL
      value: http://service-proxy-backend.service-proxy.svc.cluster.local
    - name: APP_BETBOOM_FETCH_INTERVAL_SECONDS
      value: '144'
    - name: APP_BETBOOM_PREMATCH_FETCH_INTERVAL_SECONDS
      value: '720'
    - name: APP_ODDS_REFRESH_LIVE_POLL_MS
      value: '144000'
    - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
      value: '720000'
    - name: APP_MATCH_LOADER_POLL_DELAY_MS
      value: '3600'
    # Firefox engine для обхода QRATOR WAF JS-challenge (Chromium CDP детектируется)
    - name: APP_BROWSER_ENGINE
      value: firefox
    - name: APP_BROWSER_STEALTH_PROFILE
      value: HEADLESS_STEALTH
    ports:
    - containerPort: 3037
      protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 512Mi
      limits:
        cpu: 1200m
        memory: 1536Mi
    volumeMounts:
    - mountPath: /dev/shm
      name: dshm
    startupProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 3037
        scheme: HTTP
      initialDelaySeconds: 45
      periodSeconds: 10
      failureThreshold: 60
      timeoutSeconds: 10
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 3037
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 5
      timeoutSeconds: 10
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 3037
        scheme: HTTP
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 5
      timeoutSeconds: 10
  - name: redis
    image: redis:7-alpine
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 6379
      protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 512Mi
  restartPolicy: Always
