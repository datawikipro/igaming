spring.application.name=igaming-source-tab
server.port=${SERVER_PORT:8080}

# Bookmaker Profile
app.bookmaker.name=tab
app.bookmaker.country=AU
app.bookmaker.currency=AUD
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=ID_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.regions=AU
app.bookmaker.features=NATIONAL_CHAMPION

# Database Configuration (K8s DNS)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://igaming-source-tab-db.igaming-source.svc.cluster.local:5432/igaming_tab}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Non-blocking Hikari & JPA
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Crawler schedule
app.crawler.discovery.interval-ms=30000
