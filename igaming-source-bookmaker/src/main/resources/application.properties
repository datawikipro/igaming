spring.application.name=igaming-source-bookmaker
server.port=${SERVER_PORT:8080}

# Golden Rule #4: Non-blocking HikariCP & JPA Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-bookmaker-db}:${DB_PORT:5432}/${DB_NAME:igaming_bookmaker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# DDL Auto: Golden Rule #7
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# BookMaker.eu Specific Configuration
bookmaker.base-url=https://lines.bookmaker.eu
bookmaker.sports=baseball,football,basketball,ice-hockey,soccer,tennis,mma,golf,boxing,cricket,rugby,table-tennis
bookmaker.proxy.enabled=${BOOKMAKER_PROXY_ENABLED:true}
bookmaker.proxy.host=${BOOKMAKER_PROXY_HOST:100.83.113.50}
bookmaker.proxy.port=${BOOKMAKER_PROXY_PORT:3128}

# Core Aggregator Integration
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local}
app.bookmaker.name=bookmaker
app.bookmaker.regions=US,GLOBAL
