server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-betano

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://${DATABASE_HOST:igaming-source-betano-db.igaming-source.svc.cluster.local}:${DATABASE_PORT:5432}/${DATABASE_NAME:igaming_betano}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Non-blocking HikariCP & JPA defaults
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Aggregator configuration
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Bookmaker identity
app.bookmaker.name=betano
app.bookmaker.country=BR
app.bookmaker.currency=BRL
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT,STATISTICS
app.bookmaker.regions=GLOBAL,EU,LATAM,INT

spring.main.allow-circular-references=true

# Betano API Configuration (Kaizen Gaming)
betano.api.base-url=${BETANO_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}
betano.api.brand=${BETANO_API_BRAND:kambi}
betano.api.locale=${BETANO_API_LOCALE:en_GB}
betano.api.market=${BETANO_API_MARKET:GLOBAL}

# Cluster Proxy configuration
betano.proxy.enabled=${APP_BETANO_USE_PROXY:true}
betano.proxy.host=${APP_BETANO_PROXY_HOST:100.83.113.50}
betano.proxy.port=${APP_BETANO_PROXY_PORT:3128}

# Redis configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:igaming-redis.igaming-dev.svc.cluster.local}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
