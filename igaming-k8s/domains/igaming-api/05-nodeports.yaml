apiVersion: v1
kind: Service
metadata:
  name: smartbet-guru
  namespace: igaming-api
  labels:
    app: smartbet-guru
spec:
  type: NodePort
  externalIPs:
  - 100.78.183.101
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 32000
    protocol: TCP
  selector:
    app: smartbet-guru
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-portal
  namespace: igaming-api
  labels:
    app: igaming-portal
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8081
    nodePort: 32081
    protocol: TCP
  selector:
    app: igaming-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-portal
  namespace: igaming-api
  labels:
    app: igaming-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: igaming-portal
  template:
    metadata:
      labels:
        app: igaming-portal
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: igaming-portal
        image: 100.78.183.101:30500/igaming-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: SPRING_CONFIG_LOCATION
          value: file:/config/application.yml
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://portal-postgres:5432/igaming_portal
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: DATABASE_HOST
          value: portal-postgres
        - name: REDIS_HOST
          value: localhost
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator:80/api
        - name: LLM_GATEWAY_URL
          value: http://llm-gateway-microservice:8001/api/v1/llm/search
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=75.0
        - name: APP_MDM_SERVICE_URL
          value: http://igaming-mdm-service:8095
        volumeMounts:
        - name: portal-config
          mountPath: /config
        startupProbe:
          httpGet:
            path: /api/v1/ping
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/ping
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v1/ping
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 1536Mi
          requests:
            cpu: 200m
            memory: 512Mi
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: portal-config
        configMap:
          name: igaming-portal-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartbet-guru
  namespace: igaming-api
  labels:
    app: smartbet-guru
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartbet-guru
  template:
    metadata:
      labels:
        app: smartbet-guru
    spec:
      priorityClassName: prod-critical
      nodeSelector:
        node-type: standard
      containers:
      - name: smartbet-guru
        image: 100.78.183.101:30500/smartbet.guru:v30
        imagePullPolicy: IfNotPresent
        command:
        - node
        - server.js
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: production
        - name: HOSTNAME
          value: 0.0.0.0
        - name: PORT
          value: "3000"
        - name: PORTAL_API_URL
          value: http://igaming-portal:80
        - name: AUTH_API_URL
          value: http://carrier-auth:8000
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 20
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 3
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
