spring.application.name=igaming-source-betrivers
server.port=${SERVER_PORT:8080}

app.bookmaker.name=betrivers
app.bookmaker.country=US
app.bookmaker.currency=USD
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT
app.bookmaker.regions=US,GLOBAL
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka.igaming-master.svc.cluster.local:9092}

# Redis Configuration (Health Check Disabled)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:igaming-redis.igaming-dev.svc.cluster.local}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

# Database Configuration (In-Memory H2 PostgreSQL Mode)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:betrivers;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.sql.init.mode=never
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Proxy configuration
app.proxy.enabled=${APP_PROXY_ENABLED:true}
app.proxy.host=${APP_PROXY_HOST:purevpn-uk-direct.proxy.svc.cluster.local}
app.proxy.port=${APP_PROXY_PORT:3128}

# Kambi Offering API Configuration (BetRivers US-PA via Kambi)
kambi.api.base-url=${KAMBI_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}
kambi.api.brand=${KAMBI_API_BRAND:rsiuspa}
kambi.api.market=${KAMBI_API_MARKET:US-PA}
kambi.api.locale=${KAMBI_API_LOCALE:en_US}

kambi.proxy.enabled=${KAMBI_PROXY_ENABLED:${app.proxy.enabled:true}}
kambi.proxy.host=${KAMBI_PROXY_HOST:${app.proxy.host:purevpn-uk-direct.proxy.svc.cluster.local}}
kambi.proxy.port=${KAMBI_PROXY_PORT:${app.proxy.port:3128}}

# Schedulers
betrivers.discovery.cron=${BETRIVERS_DISCOVERY_CRON:0 */2 * * * *}
betrivers.loader.cron=${BETRIVERS_LOADER_CRON:*/15 * * * * *}

# Health probes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
