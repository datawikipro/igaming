# Server port
server.port=${SERVER_PORT}
spring.application.name=${SPRING_APPLICATION_NAME:igaming-source-betb2b}
app.target.host=${APP_TARGET_HOST:}

# Bookmaker Identifier
app.bookmaker.name=${APP_BOOKMAKER_NAME}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS}

# Aggregator
app.aggregator.url=${APP_AGGREGATOR_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Betb2b Family Feed JSON API URLs
# Supports both APP_BETB2B_* (new) and APP_XBET_* (legacy) environment variable names for backward compat
app.betb2b.live-url=${APP_BETB2B_LIVE_URL:${APP_XBET_LIVE_URL:https://1xbet.com/LiveFeed/Get1xMatchByLeague?sports=1}}
app.betb2b.prematch-url=${APP_BETB2B_PREMATCH_URL:${APP_XBET_PREMATCH_URL:https://1xbet.com/LineFeed/Get1xMatchByLeague?sports=1}}
app.betb2b.fetch-interval-seconds=30

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.browser.pre-visit-keywords=1xbet.com,1xbet.rs,888starz.bet,betandyou.com,fan-sport.com,linebet.com,megapari.com

app.betb2b.partner-id=${APP_BETB2B_PARTNER_ID:${APP_XBET_PARTNER_ID:}}

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/London}

