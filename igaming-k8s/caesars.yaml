apiVersion: v1
kind: Service
metadata:
  name: igaming-source-caesars-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-caesars-crawler
  ports:
  - protocol: TCP
    port: 3065
    targetPort: 3065
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-caesars-crawler
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-caesars-crawler
  template:
    metadata:
      labels:
        app: igaming-source-caesars-crawler
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      initContainers:
      - name: db-schema-check
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: PGPASSWORD
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          HOST="igaming-source-caesars-db"
          USER="postgres"
          export PGPASSWORD="postgres"
          echo "⏳ Waiting for PostgreSQL ($HOST) to accept connections..."
          until pg_isready -h "$HOST.igaming-source.svc.cluster.local." -p 5432 -U "$USER" >/dev/null 2>&1; do
            sleep 1
          done
          echo "✅ PostgreSQL ($HOST) is ready! Handing over schema management to Java AutoMigrate."
      containers:
      - name: igaming-source-caesars-crawler
        image: ghcr.io/datawikipro/igaming-source-caesars:latest
        imagePullPolicy: Always
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: APP_BROWSER_LOCALE
          value: en-US
        - name: APP_BROWSER_ACCEPT_LANGUAGE
          value: en-US,en;q=0.9
        - name: APP_BROWSER_TIMEZONE
          value: America/New_York
        - name: APP_BROWSER_GEOLOCATION_LAT
          value: "42.3314"
        - name: APP_BROWSER_GEOLOCATION_LON
          value: "-83.0458"
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_BOOKMAKER_REGIONS
          value: us
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler
        - name: SERVER_PORT
          value: '3065'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-caesars-db:5432/igaming_caesars
        - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
          value: "0"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: AGGREGATOR_URL
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_BET365_FETCH_INTERVAL_SECONDS
          value: '144'
        - name: APP_BET365_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '720'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '144000'
        - name: APP_ODDS_REFRESH_PREMATCH_POLL_MS
          value: '720000'
        - name: APP_MATCH_LOADER_POLL_DELAY_MS
          value: '3600'
        - name: APP_TARGET_HOST
          value: sportsbook.caesars.com
        - name: BET365_API_BASE_URL
          value: https://www.caesars.com
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            -XX:+UseStringDeduplication -XshowSettings:vm
        resources:
          requests:
            cpu:  10m
            memory:  256Mi
          limits:
            cpu:  1200m
            memory:  2048Mi
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp
          name: tmp
        ports:
        - containerPort: 3065
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: igaming-source-caesars-db
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-caesars-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-caesars-db
  namespace: igaming-source
spec:
  serviceName: igaming-source-caesars-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-caesars-db
  template:
    metadata:
      labels:
        app: igaming-source-caesars-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_caesars
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi

