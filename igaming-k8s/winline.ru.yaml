apiVersion: v1
kind: Service
metadata:
  name: igaming-source-winline-crawler
  namespace: igaming-source
  labels:
    app: igaming-source-winline-crawler
spec:
  selector:
    app: igaming-source-winline-crawler
  ports:
  - protocol: TCP
    port: 3033
    targetPort: 3033
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-winline-crawler
  namespace: igaming-source
  labels:
    app: igaming-source-winline-crawler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-winline-crawler
  template:
    metadata:
      labels:
        app: igaming-source-winline-crawler
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-winline-crawler
        image: 100.78.183.101:30500/igaming-source-winline:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3033
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev,unified
        - name: APP_ROLE
          value: unified
        - name: APP_BROWSER_STEALTH_PROFILE
          value: HEADLESS_STEALTH
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:winline;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "50"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "10"
        - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
          value: "30000"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-master.svc.cluster.local:9092
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-winline
        - name: APP_BOOKMAKER_NAME
          value: winline
        - name: APP_TARGET_HOST
          value: winline.ru
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_VPN_FORCE
          value: "false"
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: SERVER_PORT
          value: "3033"
        - name: LOGGING_PATTERN_CONSOLE
          value: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{role:-CORE}] %logger{36} - %msg%n"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -XX:+UseG1GC"
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 2048Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3033
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3033
          periodSeconds: 15
          failureThreshold: 6
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3033
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp
          name: tmp
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
