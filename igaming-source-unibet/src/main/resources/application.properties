server.port=${SERVER_PORT:3055}

spring.application.name=igaming-source-unibet

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:5432/igaming_unibet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=unibet
app.bookmaker.regions=EU

# Unibet / Kambi API Configuration
unibet.api.base-url=${UNIBET_API_BASE_URL:https://eu-offering.api.kambi.com/offering/v2018}
unibet.api.brand=${UNIBET_API_BRAND:ub}
unibet.api.locale=${UNIBET_API_LOCALE:en_GB}
unibet.api.market=${UNIBET_API_MARKET:GB}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=
