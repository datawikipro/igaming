apiVersion: v1
kind: Service
metadata:
  name: igaming-aggregator-surebet
  namespace: igaming-dev
  labels:
    app: igaming-aggregator-surebet
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: igaming-aggregator-surebet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-aggregator-surebet
  namespace: igaming-dev
  labels:
    app: igaming-aggregator-surebet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-aggregator-surebet
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: igaming-aggregator-surebet
    spec:
      nodeSelector:
        node-type: standard
      priorityClassName: prod-critical
      restartPolicy: Always
      containers:
      - name: surebet
        image: 100.78.183.101:30500/igaming-aggregator-surebet:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: "true"
        - name: SPRING_MAIN_WEB_APPLICATION_TYPE
          value: "servlet"
        - name: SERVER_PORT
          value: "8080"
        - name: MANAGEMENT_SERVER_PORT
          value: "8080"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://igaming-aggregator-db:5432/igaming_aggregator"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: DATABASE_HOST
          value: "igaming-aggregator-db"
        - name: SPRING_DATA_REDIS_HOST
          value: "igaming-redis"
        - name: REDIS_HOST
          value: "igaming-redis"
        - name: HIKARI_MAX_POOL_SIZE
          value: "5"
        - name: APP_SUREBET_FULL_SCAN_ENABLED
          value: "true"
        - name: APP_SUREBET_SCAN_INTERVAL_SECONDS
          value: "30"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
