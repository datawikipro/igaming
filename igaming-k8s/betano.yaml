apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betano
  namespace: igaming-source
  labels:
    app: igaming-source-betano
spec:
  selector:
    app: igaming-source-betano
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-betano
  namespace: igaming-source
  labels:
    app: igaming-source-betano
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-betano
  template:
    metadata:
      labels:
        app: igaming-source-betano
    spec:
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      tolerations:
      - operator: Exists
      initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          until pg_isready -h igaming-source-betano-db.igaming-source.svc.cluster.local -p 5432 -U postgres; do
            echo "Waiting for igaming-source-betano-db..."
            sleep 2
          done
      containers:
      - name: igaming-source-betano
        image: 100.78.183.101:30500/igaming-source-betano:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "league-crawler"
        - name: APP_ROLE
          value: "league-crawler"
        - name: SERVER_PORT
          value: "8080"
        - name: DB_URL
          value: "jdbc:postgresql://igaming-source-betano-db.igaming-source.svc.cluster.local:5432/igaming_betano"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://igaming-source-betano-db.igaming-source.svc.cluster.local:5432/igaming_betano"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.PostgreSQLDialect"
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION
          value: "true"
        - name: APP_AGGREGATOR_URL
          value: "http://igaming-aggregator.igaming-dev.svc.cluster.local:8080"
        - name: BETANO_PROXY_ENABLED
          value: "true"
        - name: BETANO_PROXY_HOST
          value: "100.83.113.50"
        - name: BETANO_PROXY_PORT
          value: "3128"
        - name: APP_BETANO_USE_PROXY
          value: "true"
        - name: APP_BETANO_PROXY_HOST
          value: "100.83.113.50"
        - name: APP_BETANO_PROXY_PORT
          value: "3128"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -Dhttp.proxyHost=100.83.113.50 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=100.83.113.50 -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=\"localhost|127.*|10.*|172.*|192.168.*|*.cluster.local|*.svc.cluster.local\""
        resources:
          requests:
            cpu: 10m
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betano-db
  namespace: igaming-source
  labels:
    app: igaming-source-betano-db
spec:
  selector:
    app: igaming-source-betano-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-betano-db
  namespace: igaming-source
  labels:
    app: igaming-source-betano-db
spec:
  serviceName: igaming-source-betano-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-betano-db
  template:
    metadata:
      labels:
        app: igaming-source-betano-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "full_page_writes=off"
        - "-c"
        - "wal_level=minimal"
        - "-c"
        - "max_wal_senders=0"
        - "-c"
        - "shared_buffers=128MB"
        env:
        - name: POSTGRES_DB
          value: igaming_betano
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 10m
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: data
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
