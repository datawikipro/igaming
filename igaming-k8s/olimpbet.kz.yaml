apiVersion: v1
kind: Service
metadata:
  name: igaming-source-olimpbet-kz-db
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-olimpbet-kz-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-olimpbet-kz-db
  namespace: igaming-source
spec:
  serviceName: igaming-source-olimpbet-kz-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-olimpbet-kz-db
  template:
    metadata:
      labels:
        app: igaming-source-olimpbet-kz-db
    spec:
      nodeSelector:
        node-type: master
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_olimpbet_kz
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 256Mi
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}


