apiVersion: v1
kind: Service
metadata:
  name: igaming-source-betandyou-db
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-betandyou-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-betandyou-db
  namespace: igaming-source
spec:
  serviceName: igaming-source-betandyou-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-betandyou-db
  template:
    metadata:
      labels:
        app: igaming-source-betandyou-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_betandyou
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}

