apiVersion: v1
kind: Service
metadata:
  name: igaming-source-fon-bet-ru-crawler
  namespace: igaming-source
  labels:
    app: igaming-source-fon-bet-ru-crawler
spec:
  selector:
    app: igaming-source-fon-bet-ru-crawler
  ports:
  - protocol: TCP
    port: 3032
    targetPort: 3032
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-fon-bet-ru-crawler
  namespace: igaming-source
  labels:
    app: igaming-source-fon-bet-ru-crawler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-fon-bet-ru-crawler
  template:
    metadata:
      labels:
        app: igaming-source-fon-bet-ru-crawler
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-fon-bet-ru-crawler
        image: 100.78.183.101:30500/igaming-source-fon-bet-ru:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3032
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev,unified
        - name: APP_ROLE
          value: unified
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:fon-bet-ru;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "30"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "5"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: never
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-master.svc.cluster.local:9092
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-fon-bet-ru
        - name: APP_BOOKMAKER_NAME
          value: fon-bet-ru
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_TARGET_HOST
          value: fon.bet
        - name: APP_FONBET_URLS_JSON
          value: https://fon.bet/urls.json
        - name: APP_FONBET_SITE_BASE_URL
          value: https://www.fon.bet
        - name: APP_FONBET_FALLBACK_MIRRORS
          value: https://line04w.bk6bba-resources.com,https://line05w.bk6bba-resources.com,https://line02w.bk6bba-resources.com,https://line54w.bk6bba-resources.com,https://line55w.bk6bba-resources.com,https://line-lb51.bk6bba-resources.com,https://line-lb52.bk6bba-resources.ru,https://line-vk-w.bk6bba-resources.ru
        - name: APP_FONBET_FETCH_INTERVAL_SECONDS
          value: "60"
        - name: APP_FONBET_PREMATCH_FETCH_INTERVAL_SECONDS
          value: "180"
        - name: APP_BOOKMAKER_SCOPE_MARKET
          value: "1600"
        - name: APP_VPN_FORCE
          value: "false"
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: SERVER_PORT
          value: "3032"
        - name: LOGGING_PATTERN_CONSOLE
          value: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{role:-CORE}] %logger{36} - %msg%n"
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -XX:+UseG1GC"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 2048Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3032
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3032
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3032
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
