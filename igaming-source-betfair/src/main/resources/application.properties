server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-betfair

# Database configuration (K8s DNS name, non-blocking HikariCP)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:igaming-source-betfair-db.igaming-source.svc.cluster.local}:5432/igaming_betfair}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Bookmaker identity
app.bookmaker.name=betfair
app.bookmaker.country=GB
app.bookmaker.currency=GBP
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=EXCHANGE,CASH_OUT,VIP_HIGH_LIMIT
app.bookmaker.regions=GB,EU,INT

# Betfair API & Exchange Configuration
betfair.api.base-url=${BETFAIR_API_BASE_URL:https://www.betfair.com/sport}
betfair.api.aping-url=${BETFAIR_APING_URL:https://api.betfair.com/exchange/betting/rest/v1.0}
betfair.exchange.exchange-url=${BETFAIR_EXCHANGE_URL:https://www.betfair.com/exchange/plus}
betfair.exchange.min-matches-threshold=${BETFAIR_EXCHANGE_MIN_MATCHES:500}
betfair.exchange.commission-rate=${BETFAIR_EXCHANGE_COMMISSION_RATE:0.02}
betfair.exchange.deduct-commission=true

# Cluster HTTP Proxy Routing (ru-proxy 100.83.113.50:3128 -> outline-vpn-eu-nl)
betfair.fetch.use-proxy=${BETFAIR_FETCH_USE_PROXY:true}
betfair.fetch.proxy-host=${BETFAIR_PROXY_HOST:100.83.113.50}
betfair.fetch.proxy-port=${BETFAIR_PROXY_PORT:3128}
betfair.fetch.delay-ms=${BETFAIR_FETCH_DELAY_MS:15000}

# Kafka & Smart Money institutional load detection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}
betfair.exchange.smart-money.enabled=${SMART_MONEY_ENABLED:true}
betfair.exchange.smart-money.topic=${SMART_MONEY_KAFKA_TOPIC:odds.smart-money}
betfair.exchange.smart-money.min-delta-volume=${SMART_MONEY_MIN_DELTA_VOLUME:2500.0}
betfair.exchange.smart-money.volume-spike-ratio=${SMART_MONEY_VOLUME_SPIKE_RATIO:0.30}
betfair.exchange.smart-money.poll-interval-ms=${SMART_MONEY_POLL_INTERVAL_MS:15000}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/London}

# Telegram Bot Configuration
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_BOT_CHAT_ID:}
telegram.bot.cooldown-min=${TELEGRAM_BOT_COOLDOWN_MIN:15}

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
