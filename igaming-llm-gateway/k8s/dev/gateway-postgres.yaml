apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway-postgres
  namespace: igaming-llm
  labels:
    app: gateway-postgres
spec:
  serviceName: "gateway-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: gateway-postgres
  template:
    metadata:
      labels:
        app: gateway-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: igaming_llm_gateway
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      nodeSelector:
        node-type: master
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-postgres
  namespace: igaming-llm
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: gateway-postgres
