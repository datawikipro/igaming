apiVersion: v1
kind: Service
metadata:
  name: igaming-source-1xbet-db
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-1xbet-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: igaming-source-1xbet-db
  namespace: igaming-source
spec:
  serviceName: igaming-source-1xbet-db
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-1xbet-db
  template:
    metadata:
      labels:
        app: igaming-source-1xbet-db
    spec:
      nodeSelector:
        node-type: standard
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: igaming_xbet
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 96Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        emptyDir: {}

