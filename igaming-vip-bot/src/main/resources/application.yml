server:
  port: 8087

spring:
  application:
    name: igaming-vip-bot

  datasource:
    url: jdbc:postgresql://${DB_HOST:igaming-vip-bot-db}:5432/${DB_NAME:igaming_vip}
    username: ${DB_USER:igaming}
    password: ${DB_PASSWORD:igaming}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Non-blocking startup per AGENTS.md Rule #4
      initialization-fail-timeout: 0
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Non-blocking startup per AGENTS.md Rule #4
        temp.use_jdbc_metadata_defaults: false

# Telegram VIP Bot Configuration
vip:
  bot:
    token: ${VIP_BOT_TOKEN:REPLACE_WITH_REAL_TOKEN}
    webhook-secret: ${VIP_BOT_WEBHOOK_SECRET:changeme}
  channel:
    id: ${VIP_CHANNEL_ID:-1001234567890}
  portal:
    service-token: ${VIP_PORTAL_SERVICE_TOKEN:}
    signup-url: ${VIP_PORTAL_SIGNUP_URL:https://smartbet.guru/vip}
  broadcast:
    interval-ms: ${VIP_BROADCAST_INTERVAL_MS:300000}    # 5 minutes
    initial-delay-ms: ${VIP_BROADCAST_INITIAL_DELAY_MS:30000}  # 30 seconds

# Portal API
portal:
  api:
    url: ${PORTAL_API_URL:http://igaming-portal.igaming-dev.svc.cluster.local:80}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
