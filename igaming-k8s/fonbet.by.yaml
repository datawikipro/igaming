apiVersion: v1
kind: Service
metadata:
  name: igaming-source-fon-bet-by-crawler
  namespace: igaming-dev
spec:
  selector:
    app: igaming-source-fon-bet-by-crawler
  ports:
  - protocol: TCP
    port: 3032
    targetPort: 3032
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-fon-bet-by-crawler
  namespace: igaming-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-source-fon-bet-by-crawler
  template:
    metadata:
      labels:
        app: igaming-source-fon-bet-by-crawler
    spec:
      imagePullSecrets:
      - name: regcred
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
      containers:
      - name: igaming-source-fon-bet-by-crawler
        image: ghcr.io/datawikipro/igaming-source-fon-bet-ru:latest
        imagePullPolicy: Always
        env:
        - name: APP_BROWSER_STEALTH_PROFILE
          value: XVFB_HEADED
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-fon-bet-by
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: APP_ROLE
          value: league-crawler
        - name: SERVER_PORT
          value: '3032'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://igaming-source-fon-bet-by-db:5432/igaming_fonbet_by
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: postgres
        - name: SPRING_DATA_REDIS_HOST
          value: localhost
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: APP_PROXY_BACKEND_URL
          value: http://service-proxy-backend.service-proxy.svc.cluster.local
        - name: APP_FONBET_FETCH_INTERVAL_SECONDS
          value: '120'
        - name: APP_FONBET_PREMATCH_FETCH_INTERVAL_SECONDS
          value: '600'
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator
        - name: APP_BOOKMAKER_NAME
          value: fon-bet-by
        - name: APP_BOOKMAKER_REGIONS
          value: BY
        - name: APP_TARGET_HOST
          value: fonbet.by
        - name: APP_FONBET_URLS_JSON
          value: https://fonbet.by/urls.json
        - name: APP_FONBET_SITE_BASE_URL
          value: https://www.fonbet.by
        - name: APP_FONBET_FALLBACK_MIRRORS
          value: https://line06.fonbet.by,https://line1.fonbet.by,https://line2.fonbet.by,https://line3.fonbet.by,https://line4.fonbet.by,https://line5.fonbet.by
        - name: APP_VPN_ENABLED
          value: 'true'
        - name: APP_BOOKMAKER_SCOPE_MARKET
          value: '700'
        - name: JAVA_OPTS
          value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=35.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
            -XX:+UseStringDeduplication -XshowSettings:vm
        ports:
        - containerPort: 3032
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3032
          initialDelaySeconds: 180
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3032
          initialDelaySeconds: 120
          periodSeconds: 10
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
