server.port=${SERVER_PORT:3040}

spring.application.name=igaming-source-pinnacle

# Database configuration (connects to pinnacle-db StatefulSet in K8s)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:5432/igaming_pinnacle}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=pinnacle
app.bookmaker.regions=INT,EU

# Pinnacle Guest API Configuration
pinnacle.api.base-url=${PINNACLE_API_BASE_URL:https://guest.api.pinnacle.com/v1}
app.target.host=pinnacle.com

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
