apiVersion: v1
kind: Secret
metadata:
  name: igaming-social-media-secrets
  namespace: igaming-master
type: Opaque
stringData:
  # Токен, полученный через скрипт exchange_meta_token.py
  META_GRAPH_TOKEN: "вставьте_ваш_long_lived_token_сюда"
  # ID аккаунта Instagram (начинается на 17...)
  META_INSTAGRAM_USER_ID: "вставьте_id_instagram_сюда"
  # ID аккаунта Threads
  META_THREADS_USER_ID: "вставьте_id_threads_сюда"

