apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-match-vision
  namespace: igaming-analytics
  labels:
    app: igaming-match-vision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-match-vision
  template:
    metadata:
      labels:
        app: igaming-match-vision
    spec:
      containers:
      - name: igaming-match-vision
        image: 100.78.183.101:30500/igaming-match-vision:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://igaming-aggregator-db.igaming-enrichment.svc.cluster.local:5432/igaming_analytics?currentSchema=public"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: DB_HOST
          value: "igaming-aggregator-db.igaming-enrichment.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: APP_WORKERS_COUNT
          value: "18"
        - name: APP_WORKERS_BASE_URL_PATTERN
          value: "http://plane-ai-worker-%d.plane-ai-worker.plane.svc.cluster.local:8000"
        - name: APP_WORKERS_TIMEOUT_SECONDS
          value: "115"
        - name: APP_WORKERS_MODEL
          value: "gemini-3.8-flash-high"
        - name: APP_SCHEDULER_SWEEP_FIXED_DELAY_MS
          value: "45000"
        - name: APP_SCHEDULER_LINEUP_FIXED_DELAY_MS
          value: "25000"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 25
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-match-vision
  namespace: igaming-analytics
  labels:
    app: igaming-match-vision
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30896
    name: http
  selector:
    app: igaming-match-vision
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-match-vision
  namespace: igaming-dev
spec:
  type: ExternalName
  externalName: igaming-match-vision.igaming-analytics.svc.cluster.local
