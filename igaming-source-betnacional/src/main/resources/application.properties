spring.application.name=igaming-source-betnacional
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://igaming-source-betnacional-db.igaming-source.svc.cluster.local:5432/igaming_betnacional}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}
app.betnacional.api-url=${APP_BETNACIONAL_API_URL:https://betnacional.com}
app.betnacional.use-proxy=${APP_BETNACIONAL_USE_PROXY:true}
app.betnacional.proxy-host=${APP_BETNACIONAL_PROXY_HOST:100.83.113.50}
app.betnacional.proxy-port=${APP_BETNACIONAL_PROXY_PORT:3128}
app.betnacional.poll-rate-ms=${APP_BETNACIONAL_POLL_RATE_MS:10000}
