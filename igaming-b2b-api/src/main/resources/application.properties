spring.application.name=igaming-b2b-api
server.port=8080

# Golden Rule #2: K8s DNS Service Name ONLY
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080/api}
app.auth.url=${APP_AUTH_URL:http://carrier-auth.igaming-dev.svc.cluster.local:8002}

# Commercial Quota Defaults
app.b2b.default-daily-limit=${B2B_DEFAULT_DAILY_LIMIT:50000}
app.b2b.cache-ttl-seconds=${B2B_CACHE_TTL_SECONDS:2}

# Actuator & Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
