name: "Build Jib Services (aggregator, bot, portal)"


on:
  push:
    branches: [master, main]
    paths:
      - "igaming-dto"
      - "igaming-dto/**"
      - "aggregator-*"
      - "aggregator-*/**"
      - "igaming-bot"
      - "igaming-bot/**"
      - "igaming-portal"
      - "igaming-portal/**"
      - "auth-base"
      - "auth-base/**"
      - "igaming-auth-microservice"
      - "igaming-auth-microservice/**"
      - "table-manager-auth-microservice"
      - "table-manager-auth-microservice/**"
      - "service-proxy-backend"
      - "service-proxy-backend/**"
      - "pom.xml"
      - ".github/workflows/build-jib-services.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        module:
          - igaming-aggregator
          - igaming-bot
          - igaming-portal
          - igaming-auth-microservice
          - table-manager-auth-microservice
          - service-proxy-backend

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build module with Jib
        run: |
          if [ "${{ matrix.module }}" = "igaming-aggregator" ]; then
            for svc in aggregator-ingestion aggregator-api aggregator-enrichment aggregator-normalizer aggregator-odds-sync aggregator-surebet; do
              echo "==> Building $svc..."
              mvn -pl $svc -am clean compile \
                com.google.cloud.tools:jib-maven-plugin:3.4.1:build \
                -Djib.from.image=eclipse-temurin:21-jre-jammy \
                -Djib.to.image=${{ env.REGISTRY }}/${{ github.repository_owner }}/$svc:latest \
                -DskipTests -Dmaven.test.skip=true
            done
          else
            mvn -pl ${{ matrix.module }} -am clean compile \
              com.google.cloud.tools:jib-maven-plugin:3.4.1:build \
              -Djib.from.image=eclipse-temurin:21-jre-jammy \
              -Djib.to.image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.module }}:latest \
              -DskipTests -Dmaven.test.skip=true
          fi

      - name: Rollout restart Kubernetes deployments
        run: |
          if [ "${{ matrix.module }}" = "igaming-aggregator" ]; then
            kubectl rollout restart deployment/igaming-aggregator-api -n igaming-master || true
            kubectl rollout restart deployment/igaming-aggregator-enrichment -n igaming-master || true
            kubectl rollout restart deployment/igaming-aggregator-ingestion -n igaming-master || true
            kubectl rollout restart deployment/igaming-aggregator-middles -n igaming-master || true
            kubectl rollout restart deployment/igaming-aggregator-normalizer -n igaming-master || true
            kubectl rollout restart deployment/igaming-aggregator-odds-sync -n igaming-master || true
            kubectl rollout restart deployment/igaming-aggregator-surebet -n igaming-master || true
          elif [ "${{ matrix.module }}" = "igaming-bot" ]; then
            kubectl rollout restart deployment/igaming-bot-telegram -n igaming-dev || true
            kubectl rollout restart deployment/igaming-bot-threads -n igaming-dev || true
          elif [ "${{ matrix.module }}" = "igaming-portal" ]; then
            kubectl rollout restart deployment/igaming-portal -n igaming-master || true
          elif [ "${{ matrix.module }}" = "igaming-auth-microservice" ]; then
            kubectl rollout restart deployment/igaming-auth-microservice -n igaming-master || true
          elif [ "${{ matrix.module }}" = "table-manager-auth-microservice" ]; then
            kubectl rollout restart deployment/table-manager-auth-microservice -n igaming-master || true
          fi
