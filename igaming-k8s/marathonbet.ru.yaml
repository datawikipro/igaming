apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-marathonbet
  ports:
  - protocol: TCP
    port: 3036
    targetPort: 3036
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-crawler
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-marathonbet
  ports:
  - protocol: TCP
    port: 3036
    targetPort: 3036
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-source-marathonbet-loader
  namespace: igaming-source
spec:
  selector:
    app: igaming-source-marathonbet
  ports:
  - protocol: TCP
    port: 3036
    targetPort: 3036
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-source-marathonbet
  namespace: igaming-source
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: igaming-source-marathonbet
  template:
    metadata:
      labels:
        app: igaming-source-marathonbet
    spec:
      shareProcessNamespace: true
      imagePullSecrets:
      - name: regcred
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - standard
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - spot
                - standard
                - master
      containers:
      - name: igaming-source-marathonbet
        image: 100.78.183.101:30500/igaming-source-marathonbet:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_APPLICATION_NAME
          value: igaming-source-marathonbet
        - name: APP_ROLE
          value: unified
        - name: SPRING_PROFILES_ACTIVE
          value: league-crawler,match-loader,odds-refresher
        - name: SERVER_PORT
          value: '3036'
        - name: SPRING_DATASOURCE_URL
          value: jdbc:h2:mem:marathonbet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          value: org.h2.Driver
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: org.hibernate.dialect.H2Dialect
        - name: SPRING_DATASOURCE_USERNAME
          value: sa
        - name: SPRING_DATASOURCE_PASSWORD
          value: ""
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "50"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "10"
        - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
          value: "30000"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_SQL_INIT_MODE
          value: "never"
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS
          value: "false"
        - name: SPRING_DATA_REDIS_HOST
          value: igaming-redis.igaming-dev.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.igaming-master.svc.cluster.local:9092
        - name: APP_AGGREGATOR_URL
          value: http://igaming-aggregator.igaming-dev.svc.cluster.local:8080
        - name: APP_BOOKMAKER_NAME
          value: marathonbet
        - name: APP_BOOKMAKER_REGIONS
          value: RU
        - name: APP_BOOKMAKER_URL
          value: https://www.marathonbet.ru
        - name: APP_TARGET_HOST
          value: www.marathonbet.ru
        - name: APP_MENU_PREMATCH_URL
          value: https://www.marathonbet.ru/su/react/event/menu/prematch
        - name: APP_MENU_LIVE_URL
          value: https://www.marathonbet.ru/su/react/event/menu/live
        - name: APP_BETTING_BASE_URL
          value: https://www.marathonbet.ru/su/betting
        - name: APP_LIVE_UPDATE_URL
          value: https://lu.marathonbet.ru/su/liveupdate
        - name: APP_VPN_ENABLED
          value: "false"
        - name: APP_VPN_FORCE
          value: "false"
        - name: MARATHONBET_FETCH_INTERVAL
          value: '86'
        - name: MARATHONBET_PREMATCH_FETCH_INTERVAL
          value: '432'
        - name: APP_ODDS_REFRESH_LIVE_POLL_MS
          value: '86400'
        - name: APP_PERSISTENCE_USE_REDIS_FACTORS
          value: 'true'
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms256m -Xmx768m -XX:+UseG1GC"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx768m -XX:+UseG1GC"
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        ports:
        - containerPort: 3036
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3036
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 3036
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 3036
          periodSeconds: 10
          timeoutSeconds: 5
