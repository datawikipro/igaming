spring.application.name=igaming-source-veikkaus
server.port=${SERVER_PORT:8080}

app.bookmaker.name=veikkaus
app.bookmaker.family=veikkaus
app.bookmaker.country=FI
app.bookmaker.currency=EUR
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.features=NATIONAL_MONOPOLY,FAST_LOCAL_PAYMENTS
app.bookmaker.accepts-crypto=false
app.bookmaker.regions=FI,EU,GLOBAL

# Crawler API configuration
app.veikkaus.base-url=https://www.veikkaus.fi/api/sportsbook/v1
app.veikkaus.connect-timeout=10000
app.veikkaus.read-timeout=15000

# Aggregator URL
app.aggregator.url=${APP_AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}

# Database Configuration (K8s DNS)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://igaming-source-veikkaus-db.igaming-source.svc.cluster.local:5432/igaming_veikkaus}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mandatory non-blocking HikariCP & JPA per Golden Rule 4
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true