server.port=${SERVER_PORT:3060}

spring.application.name=igaming-source-fanduel

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:5432/igaming_fanduel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${AGGREGATOR_URL:http://igaming-aggregator:3034}

# Bookmaker identity
app.bookmaker.name=fanduel
app.bookmaker.country=US
app.bookmaker.currency=USD
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=BET_BUILDER,CASH_OUT,FAST_PAYOUT
app.bookmaker.regions=US

# FanDuel API Configuration
fanduel.api.base-url=${FANDUEL_API_BASE_URL:https://sbapi.ny.sportsbook.fanduel.com}
fanduel.api.api-key=${FANDUEL_API_KEY:FhMFpcPWXMeyZxOx}
fanduel.api.site-id=${FANDUEL_API_SITE_ID:US-SB}

# Golden Rule #4: Non-blocking HikariCP and JPA start
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
app.browser.engine=NONE
app.browser.stealth.profile=BASIC

# Polling interval: 5 minutes (300,000 ms)
app.odds.refresh.prematch.poll.ms=300000
app.match.loader.poll.delay.ms=10000
app.target-host=sbapi.ny.sportsbook.fanduel.com
app.vpn.target-host=sbapi.ny.sportsbook.fanduel.com

