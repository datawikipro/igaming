server.port=${SERVER_PORT:8080}

spring.application.name=igaming-source-unibet

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DATABASE_HOST:${DB_HOST:localhost}}:${DATABASE_PORT:${DB_PORT:5432}}/${DATABASE_NAME:${DB_NAME:igaming_unibet}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP & Hibernate configuration (Non-blocking Golden Rule)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aggregator configuration
app.aggregator.url=${APP_AGGREGATOR_URL:${AGGREGATOR_URL:http://igaming-aggregator.igaming-dev.svc.cluster.local:8080}}

# Bookmaker identity
app.bookmaker.name=${APP_BOOKMAKER_NAME:unibet}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS:EU}

# Unibet / Kambi API Configuration
unibet.api.base-url=${UNIBET_API_BASE_URL:${KAMBI_API_BASE_URL:https://eu.offering-api.kambicdn.com/offering/v2018}}
unibet.api.brand=${KAMBI_API_BRAND:${UNIBET_API_BRAND:ub}}
unibet.api.locale=${KAMBI_API_LOCALE:${UNIBET_API_LOCALE:en_GB}}
unibet.api.market=${KAMBI_API_MARKET:${UNIBET_API_MARKET:GB}}

# Proxy Configuration
unibet.proxy.enabled=${UNIBET_PROXY_ENABLED:${KAMBI_PROXY_ENABLED:true}}
unibet.proxy.host=${UNIBET_PROXY_HOST:${KAMBI_PROXY_HOST:100.83.113.50}}
unibet.proxy.port=${UNIBET_PROXY_PORT:${KAMBI_PROXY_PORT:3128}}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
app.browser.pre-visit-keywords=

# Browser stealth config
app.browser.locale=${APP_BROWSER_LOCALE:en-US}
app.browser.accept-language=${APP_BROWSER_ACCEPT_LANGUAGE:en-US,en;q=0.9}
app.browser.timezone=${APP_BROWSER_TIMEZONE:Europe/London}
