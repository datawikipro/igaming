# Server port
server.port=${SERVER_PORT}
spring.application.name=igaming-source-xbet

# Bookmaker Identifier
app.bookmaker.name=${APP_BOOKMAKER_NAME}
app.bookmaker.regions=${APP_BOOKMAKER_REGIONS}

# Aggregator
app.aggregator.url=${APP_AGGREGATOR_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 1xBet / BetB2B Family Feed JSON API URLs
app.xbet.live-url=${APP_XBET_LIVE_URL}
app.xbet.prematch-url=${APP_XBET_PREMATCH_URL}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.browser.pre-visit-keywords=
