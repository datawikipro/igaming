---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igaming-ai-analyst
  namespace: igaming-dev
  labels:
    app: igaming-ai-analyst
    tier: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: igaming-ai-analyst
  template:
    metadata:
      labels:
        app: igaming-ai-analyst
        tier: analytics
    spec:
      containers:
        - name: ai-analyst
          image: 100.78.183.101:30500/igaming-ai-analyst:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3046
              name: http
          env:
            - name: SERVER_PORT
              value: "3046"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.igaming-dev.svc.cluster.local:9092"
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "igaming-ai-analyst-group"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 3046
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 3046
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: igaming-ai-analyst
  namespace: igaming-dev
  labels:
    app: igaming-ai-analyst
spec:
  type: ClusterIP
  ports:
    - port: 3046
      targetPort: 3046
      name: http
  selector:
    app: igaming-ai-analyst
