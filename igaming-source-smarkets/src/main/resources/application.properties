spring.application.name=igaming-source-smarkets
server.port=8080

# Golden Rule #2: K8s DNS Service Name ONLY
spring.datasource.url=jdbc:postgresql://${DB_HOST:igaming-source-smarkets-db}:${DB_PORT:5432}/${DB_NAME:smarkets}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Golden Rule #4: Non-blocking HikariCP / JPA
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Factors persistence in PostgreSQL table match_factor
app.persistence.use-redis-factors=false

# Actuator & Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Smarkets Exchange Engine Configuration
smarkets.api.base-url=${SMARKETS_API_URL:https://api.smarkets.com/v3}
smarkets.api.connect-timeout-seconds=10
smarkets.api.read-timeout-seconds=25
smarkets.api.events-per-sport-limit=${EVENTS_PER_SPORT_LIMIT:500}
smarkets.proxy.enabled=${HTTP_PROXY_ENABLED:true}
smarkets.proxy.host=${HTTP_PROXY_HOST:100.83.113.50}
smarkets.proxy.port=${HTTP_PROXY_PORT:3128}

# Polling interval (milliseconds)
smarkets.scheduler.poll-interval-ms=${POLL_INTERVAL_MS:30000}
app.bookmaker.name=smarkets
app.bookmaker.country=GB
app.bookmaker.currency=GBP
app.bookmaker.legal-status=LICENSED
app.bookmaker.kyc-level=FULL_DOCUMENT
app.bookmaker.accepts-crypto=false
app.bookmaker.features=EXCHANGE,CASH_OUT,VIP_HIGH_LIMIT
app.bookmaker.regions=GB,EU,INT
